<!DOCTYPE html>
<!-- ============================================================
  墨韵 · 个人主页 v3.0（浅色清爽 · 个人主页式）
  设计稿：docs/design/home-redesign.md ｜ 事务：TX-20260817-02
  依赖：src/assets/css/core/theme.css（令牌） src/assets/css/pages/home.css（布局）
        src/assets/js/core/logger.js（日志） src/assets/js/core/tools-data.js（数据） src/assets/js/pages/home.js（交互）
============================================================ -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="墨韵 · 专注公众号 / 小红书创作的独立开发者：AI 写作、图文排版、海报生成、图片压缩等创作工具一站直达">
<title>墨韵 · 个人主页与创作工具集</title>
<link rel="stylesheet" href="src/assets/css/core/theme.css">
<link rel="stylesheet" href="src/assets/css/pages/home.css">
</head>
<body>

<!-- ===== 导航 =====（全站统一导航由 js/site-nav.js 注入；首页/关于统一定位 #hero，「工具」为下拉入口） -->
<script>
  window.SITE_NAV = {
    links: [
      { href: '#hero', text: '首页' },
      { href: '#hero', text: '关于' }
    ]
  };
</script>

<!-- ===== Hero（个人介绍 · ≤50vh） ===== -->
<header class="hero" id="hero">
  <!-- 底层图案：鼠标擦除后露出（品牌蓝圆点纹理） -->
  <div class="hero__pattern" aria-hidden="true"></div>
  <!-- 遮罩 canvas：鼠标轨迹擦除层（js/hero-effect.js） -->
  <canvas class="hero__mask" id="heroMask" aria-hidden="true"></canvas>
  <!-- 默认光泽晕染层：打开即有慢速流光 -->
  <div class="hero__gloss" aria-hidden="true"></div>

  <img class="hero__avatar" src="src/assets/image/tx/tx2.jpg" alt="墨韵头像">
  <p class="hero__eyebrow">个人主页 · 创作工具集</p>
  <h1 class="hero__title">你好，我是<span class="grad">墨韵</span></h1>
  <p class="hero__sub">专注公众号 / 小红书创作的独立开发者<br>用代码，让创作更简单</p>
  <div class="hero__cta">
    <a class="btn btn--primary" href="#tools">进入工具集</a>
    <a class="btn btn--ghost" href="#about">关于我</a>
  </div>
</header>

<!-- ===== 关于我 ===== -->
<section class="section" id="about">
  <h2 class="section-title"><span class="sec-num">01</span>关于我<span class="sec-line"></span></h2>
  <div class="about">
    <p class="about__text">
      我是墨韵，一名独立开发者，专注于内容创作方向的工具研发。
      从公众号排版到小红书海报，我把自己创作中遇到的痛点，逐个打磨成顺手的小工具，
      开源共享，让每一位创作者都能把时间花在内容本身。
    </p>
    <div class="about__skills" aria-label="技能清单">
      <span class="skill-chip">HTML / CSS / JS</span>
      <span class="skill-chip">公众号生态</span>
      <span class="skill-chip">小红书创作</span>
      <span class="skill-chip">图像处理</span>
      <span class="skill-chip">AI 写作工作流</span>
    </div>
  </div>
</section>

<!-- ===== 工具集 ===== -->
<section class="section" id="tools">
  <h2 class="section-title"><span class="sec-num">02</span>工具集<span class="sec-line"></span></h2>

  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="搜索工具，例如「海报」「MD」「压缩」…" autocomplete="off">
    <span class="search-kbd"><kbd>⌘</kbd><kbd>K</kbd></span>
  </div>

  <div class="chips" id="chips">
    <button class="chip is-active" data-cat="all">全部</button>
    <button class="chip" data-cat="creation">创作</button>
    <button class="chip" data-cat="layout">排版</button>
    <button class="chip" data-cat="image">图片</button>
    <button class="chip" data-cat="doc">文档</button>
    <button class="chip" data-cat="fun">趣味</button>
  </div>

  <div id="toolContainer"></div>
</section>

<!-- ===== 联系我 ===== -->
<section class="section section--contact" id="contact">
  <h2 class="section-title"><span class="sec-num">03</span>联系我<span class="sec-line"></span></h2>
  <div class="contact">
    <a class="contact__link" href="https://github.com/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
      GitHub
    </a>
    <a class="contact__link" href="src/tools/skills/skill.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      技能文档
    </a>
  </div>
</section>

<!-- ===== 页脚 ===== -->
<footer class="site-footer">© 2026 墨韵 · 纯 HTML + CSS · GitHub Pages 托管</footer>

<!-- 返回顶部 -->
<a href="#" class="back-top" id="backTop" aria-label="返回顶部">↑</a>

<script src="src/assets/js/core/logger.js"></script>
<script src="src/assets/js/core/tools-data.js"></script>
<script src="src/assets/js/pages/home.js"></script>
<script src="src/assets/js/pages/hero-effect.js"></script>
<script src="src/assets/js/components/site-nav.js"></script>
</body>
</html>
