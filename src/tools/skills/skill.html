<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills 技能文档</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --primary:#2563eb; --primary-dark:#1d4ed8; --primary-soft:#dbeafe;
  --border:#e5e7eb; --code-bg:#0f172a; --code-text:#e2e8f0; --code-border:#1e293b;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-hover:0 10px 25px rgba(37,99,235,.12),0 4px 10px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
a:hover{color:var(--primary-dark)}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1100px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px}
.topbar h1{font-size:18px;margin:0;flex:0 0 auto;font-weight:700}
.search-wrap{margin-left:auto;display:flex;align-items:center;gap:10px}
#search{width:220px;padding:7px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;
  outline:none;transition:border-color .15s,box-shadow .15s;background:#fff}
#search:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.count{font-size:13px;color:var(--muted);white-space:nowrap}

/* 返回栏 */
.detail-topbar .topbar-inner{justify-content:flex-start}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;
  background:var(--primary-soft);color:var(--primary-dark);font-weight:600;font-size:14px;transition:background .15s}
.back-btn:hover{background:#bfdbfe}
.detail-file{font-family:"SFMono-Regular",Consolas,Menlo,monospace;font-size:13px;color:var(--muted);
  margin-left:4px;word-break:break-all}

/* 容器 */
.container{max-width:1100px;margin:0 auto;padding:28px 24px 60px}
.container-narrow{max-width:880px}

/* 列表 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:18px 18px 14px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s;
  border-left:3px solid var(--primary);color:inherit;cursor:pointer}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--primary)}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card-badge{font-size:11px;font-weight:700;color:var(--primary-dark);background:var(--primary-soft);
  padding:2px 7px;border-radius:5px;letter-spacing:.5px}
.card-title{font-size:16px;margin:0;font-weight:700;color:var(--text);line-height:1.4}
.card-desc{font-size:13.5px;color:var(--muted);margin:0 0 14px;flex:1;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed var(--border);padding-top:10px}
.card-file{font-size:12px;color:var(--muted);font-family:"SFMono-Regular",Consolas,Menlo,monospace;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65%}
.card-go{font-size:13px;font-weight:600;color:var(--primary);white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:15px}

/* markdown 正文 */
.markdown-body{font-size:15px;line-height:1.75}
.markdown-body h1{font-size:26px;margin:8px 0 18px;padding-bottom:10px;border-bottom:2px solid var(--border)}
.markdown-body h2{font-size:21px;margin:32px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.markdown-body h3{font-size:18px;margin:26px 0 12px}
.markdown-body h4{font-size:16px;margin:22px 0 10px}
.markdown-body h5,.markdown-body h6{font-size:14.5px;margin:18px 0 8px}
.markdown-body p{margin:0 0 14px}
.markdown-body ul,.markdown-body ol{margin:0 0 14px;padding-left:24px}
.markdown-body li{margin:4px 0}
.markdown-body li.task{list-style:none;margin-left:-20px}
.markdown-body li.task input{margin-right:6px}
.markdown-body blockquote{margin:0 0 14px;padding:8px 16px;border-left:4px solid var(--primary-soft);
  background:#f8fafc;color:#475569;border-radius:0 6px 6px 0}
.markdown-body blockquote p{margin:0}
.markdown-body hr{border:none;border-top:1px solid var(--border);margin:24px 0}
.markdown-body a{word-break:break-word}
.markdown-body strong{font-weight:700;color:#111827}
.markdown-body code{font-family:"SFMono-Regular",Consolas,Menlo,monospace;font-size:13px;
  background:#f1f5f9;color:#db2777;padding:1.5px 5px;border-radius:4px}
.markdown-body pre{background:var(--code-bg);border:1px solid var(--code-border);border-radius:10px;
  padding:16px 18px;overflow:auto;margin:0 0 16px;line-height:1.55}
.markdown-body pre code{background:none;color:var(--code-text);padding:0;font-size:13px;border:none;
  white-space:pre;display:block}
.markdown-body table{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:14px;
  display:block;overflow:auto}
.markdown-body th,.markdown-body td{border:1px solid var(--border);padding:8px 12px;text-align:left}
.markdown-body th{background:#f8fafc;font-weight:700}
.markdown-body tr:nth-child(even) td{background:#fafbfc}
.markdown-body img{max-width:100%;border-radius:8px}
.loading{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
</style>

</head>

<script type="application/json" id="skill-data">[{"slug": "article-v3-workflow", "name": "article-v3-workflow.txt", "title": "公众号文章深度拆解 — AI写作工作流", "desc": "通过API调用复刻AI文章写作工具V3的六步流程：AI拆解关键词→生成公众号文章。核心是Prompt模板，不依赖浏览器页面，支持火山引擎ARK API。", "file": "skills-doc/article-v3-workflow/article-v3-workflow.txt", "raw": "---\nname: article-v3-workflow\ndescription: \"通过API调用复刻AI文章写作工具V3的六步流程：AI拆解关键词→生成公众号文章。核心是Prompt模板，不依赖浏览器页面，支持火山引擎ARK API。\"\n---\n\n# 公众号文章深度拆解 — AI写作工作流\n\n## 功能概述\n\n复刻 `shengmingzhishu.github.io` 上 AI文章写作工具 V3 的核心逻辑，通过 **API 直调** 完成全流程，无需浏览器操作：\n\n1. **输入主题** — 用户提供关键词/方向\n2. **AI拆解分析** — 提取核心关键词、价值点、标题、搜索词\n3. **生成公众号文章** — 带加粗、标题、引用、列表的深度文章\n\n**优势**：跳过页面操作，直接调 API，速度快10倍，适合批量生成。\n\n---\n\n## 触发条件\n\n- \"写一篇XX的深度拆解文章\"\n- \"生成公众号文章\"\n- \"用article-v3写文章\"\n- \"书籍拆解文章\"\n\n---\n\n## 核心提示词模板\n\n### 步骤1：AI拆解关键词（Step 2）\n\n```python\nsystem_prompt = \"你是一个内容策划专家。请分析用户提供的主题，提取核心关键词和价值点。输出JSON格式。\"\n\nuser_prompt = f\"\"\"主题：{topic}\n\n请分析并提取：\n1. 核心关键词（5-8个）\n2. 价值点（3-5个）\n3. 建议标题（3个）\n4. 搜索关键词（3-5个）\n\nJSON格式：{{\"keywords\":[\"关键词1\"],\"valuePoints\":[\"价值点1\"],\"titles\":[\"标题1\"],\"searchQueries\":[\"搜索词1\"]}}\"\"\"\n```\n\n使用 `doubao-seed-2.0-mini` 模型（快速省token）。\n\n### 步骤2：生成公众号文章（Step 4）\n\n```python\nsystem_prompt = \"\"\"你是一个公众号爆款文章创作者。要求：\n1. 开头第一句话必须用**加粗**格式，有吸引力\n2. 文章必须有4-6个小段落标题（使用### 标记）\n3. 每个段落内的重点关键词必须用**加粗**\n4. 内容要有深度、有独到见解\n5. 适当使用引用（> 标记）来突出金句\n6. 使用列表（- 标记）来组织要点\n7. 结尾有总结\n8. 总字数约1200-1500字\"\"\"\n\nuser_prompt = f\"\"\"主题：{topic}\n\n核心关键词：{analysis['keywords']}\n\n价值点：{analysis['valuePoints']}\n\n请生成一篇高质量的公众号深度拆解文章。\"\"\"\n```\n\n使用 `doubao-seed-2.0-pro` 模型（质量更高）。\n\n---\n\n## 完整API调用代码\n\n```python\nimport requests, json, re\n\nAPI_KEY = \"用户提供的ARK Key\"\nBASE_URL = \"https://ark.cn-beijing.volces.com/api/plan/v3/chat/completions\"\nHEADERS = {\"Content-Type\": \"application/json\", \"Authorization\": f\"Bearer {API_KEY}\"}\n\ndef generate_article(topic):\n    # Step 1: AI拆解\n    messages = [\n        {\"role\": \"system\", \"content\": \"你是一个内容策划专家。请分析用户提供的主题，提取核心关键词和价值点。输出JSON格式。\"},\n        {\"role\": \"user\", \"content\": f\"\"\"主题：{topic}\n\n请分析并提取：\n1. 核心关键词（5-8个）\n2. 价值点（3-5个）\n3. 建议标题（3个）\n4. 搜索关键词（3-5个）\n\nJSON格式：{{\"keywords\":[\"关键词1\"],\"valuePoints\":[\"价值点1\"],\"titles\":[\"标题1\"],\"searchQueries\":[\"搜索词1\"]}}\"\"\"}\n    ]\n    resp = requests.post(BASE_URL, headers=HEADERS,\n        json={\"model\": \"doubao-seed-2.0-mini\", \"messages\": messages, \"max_tokens\": 800},\n        timeout=60)\n    result_text = json.loads(resp.text)[\"choices\"][0][\"message\"][\"content\"]\n    json_match = re.search(r'\\{[\\s\\S]*\\}', result_text)\n    analysis = json.loads(json_match.group(0)) if json_match else json.loads(result_text)\n\n    # Step 2: 生成公众号文章\n    messages = [\n        {\"role\": \"system\", \"content\": \"\"\"你是一个公众号爆款文章创作者。要求：\n1. 开头第一句话必须用**加粗**格式，有吸引力\n2. 文章必须有4-6个小段落标题（使用### 标记）\n3. 每个段落内的重点关键词必须用**加粗**\n4. 内容要有深度、有独到见解\n5. 适当使用引用（> 标记）来突出金句\n6. 使用列表（- 标记）来组织要点\n7. 结尾有总结\n8. 总字数约1200-1500字\"\"\"},\n        {\"role\": \"user\", \"content\": f\"\"\"主题：{topic}\n\n核心关键词：{', '.join(analysis['keywords'])}\n\n价值点：{' '.join(analysis['valuePoints'])}\n\n请生成一篇高质量的公众号深度拆解文章。\"\"\"}\n    ]\n    resp = requests.post(BASE_URL, headers=HEADERS,\n        json={\"model\": \"doubao-seed-2.0-pro\", \"messages\": messages, \"max_tokens\": 2200},\n        timeout=120)\n    article = json.loads(resp.text)[\"choices\"][0][\"message\"][\"content\"]\n\n    return analysis, article\n```\n\n---\n\n## 最终输出格式\n\n文章保存为 `.md` 文件，带YAML frontmatter：\n\n```markdown\n---\ntitle: 《红楼梦》深度拆解：从荣国府生存学看懂人生+职场双智慧\nauthor: 屿蓝\ncategory: 书籍拆解\nkeywords: 红楼梦, 曹雪芹, 深度拆解, 人生哲学, 职场智慧\ndate: 2024-01-15\n---\n\n**开头第一句加粗...**\n\n### 段落标题\n\n正文内容，重点**加粗**...\n\n> 引用金句...\n\n- 列表项\n- 列表项\n\n## 总结\n\n结尾总结内容...\n```\n\n---\n\n## 注意事项\n\n### ⚠️ 模型选择\n- `doubao-seed-2.0-mini` - **首选**，速度快，额度消耗低，拆解+生成都能用\n- `doubao-seed-2.0-pro` - 质量更高但额度消耗大，额度有限时不要用\n- `ark-code-latest` - **不推荐用于文章生成**：是推理模型，content字段经常为空(内容在reasoning_content)，max_tokens=500时全部token花在推理上，输出为空字符串\n\n### ⚠️ 额度陷阱\n- 所有模型共享同一个额度池，一个超限全部不可用\n- 短消息测试(max_tokens=10)能过不代表长文生成(max_tokens=2000)能过\n- 遇到 `AccountQuotaExceeded` 立即停止，不要重试，告知用户重置时间\n- 火山引擎Key不能在DeepSeek官方API(api.deepseek.com)上使用，两者独立\n\n### ⚠️ Token消耗\n- 拆解步骤：约800 token\n- 文章生成：约2000-2200 token\n- 每篇文章总计约3000 token\n\n### ⚠️ 文章质量要点\n- 始终要求**加粗**开头第一句\n- 要求4-6个`###`段落标题\n- 要求引用`>`突出金句\n- 使用`-`列表组织要点\n- 结尾必须有总结\n\n## References\n\n- `references/article-v3-source-analysis.md` - article-v3.html 完整源码分析，包含6步流程的Prompt模板、API调用方式、配置面板字段说明"}, {"slug": "gzh-article-generator", "name": "gzh-article-generator.txt", "title": "公众号书籍拆解文章生成器", "desc": "书籍拆解公众号文章生成器。通过火山引擎API自动生成1200-1500字深度拆解文章，支持任何书籍主题，输出符合公众号发布标准的Markdown格式。", "file": "skills-doc/gzh-article-generator/gzh-article-generator.txt", "raw": "---\nname: gzh-article-generator\ndescription: \"书籍拆解公众号文章生成器。通过火山引擎API自动生成1200-1500字深度拆解文章，支持任何书籍主题，输出符合公众号发布标准的Markdown格式。\"\n---\n\n# 公众号书籍拆解文章生成器\n\n## 核心流程（无需打开网页，直接API调用）\n\n```\n输入主题关键词 → [AI拆解：提取关键词/价值点/标题]\n                → [生成公众号文章：开头加粗 + 4-6个###段落 + 引用+列表]\n                → [保存为带frontmatter的.md文件]\n                → [排版样式（可选）]\n```\n\n## Step 1: AI拆解关键词\n\n### Prompt模板\n```\n你是一个内容策划专家。请分析用户提供的主题，提取核心关键词和价值点。输出JSON格式。\n\n主题：{用户输入的关键词，用逗号分隔}\n\n请分析并提取：\n1. 核心关键词（5-8个）\n2. 价值点（3-5个）\n3. 建议标题（3个）\n4. 搜索关键词（3-5个）\n\nJSON格式：{\"keywords\":[\"关键词1\"],\"valuePoints\":[\"价值点1\"],\"titles\":[\"标题1\"],\"searchQueries\":[\"搜索词1\"]}\n```\n\n### API参数\n```python\nmodel = \"doubao-seed-2.0-mini\"  # 速度快，适合结构化输出\nmax_tokens = 800\ntemperature = 0.3\n```\n\n## Step 2: 生成公众号文章\n\n### Prompt模板\n```\n你是一个公众号爆款文章创作者。要求：\n1. 开头第一句话必须用加粗格式，3秒内抓住注意力\n2. 文章必须有4-6个小段落标题（使用### 标记）\n3. 每个段落内的重点关键词必须用加粗\n4. 内容要有深度、有独到见解，结合真实案例\n5. 适当使用引用（> 标记）来突出金句或名人名言\n6. 使用列表（- 标记）来组织要点，增强可读性\n7. 结尾有总结升华，呼应主题\n8. 总字数约1200-1500字，宁可少写也不灌水\n\n主题：{用户输入的关键词}\n\n核心关键词：{拆解得到的keywords列表}\n\n价值点：{拆解得到的valuePoints列表}\n\n请生成一篇高质量的公众号深度拆解文章。\n```\n\n### API参数\n```python\nmodel = \"doubao-seed-2.0-pro\"  # 深度推理，适合长文\nmax_tokens = 2200\ntemperature = 0.7\n```\n\n## Step 3: 输出格式\n\n### 标准Frontmatter\n```markdown\n---\ntitle: {第一个建议标题}\nauthor: 屿蓝\ncategory: 书籍拆解\nkeywords: {逗号分隔的关键词}\ndate: {当前日期}\n---\n\n{文章正文}\n```\n\n## 完整Python代码示例\n\n```python\nimport requests, json, re, os\nfrom datetime import datetime\n\nAPI_KEY = \"your-api-key\"\nBASE_URL = \"https://ark.cn-beijing.volces.com/api/plan/v3/chat/completions\"\nHEADERS = {\"Content-Type\": \"application/json\", \"Authorization\": f\"Bearer {API_KEY}\"}\n\ndef generate_article(topic, output_dir=\"/home/ubuntu/article_output\"):\n    \"\"\"\n    生成一篇完整的公众号书籍拆解文章\n    \n    Args:\n        topic: 书籍主题关键词，如\"红楼梦, 曹雪芹, 职场智慧\"\n        output_dir: 输出目录\n    \n    Returns:\n        (title, filepath, word_count)\n    \"\"\"\n    os.makedirs(output_dir, exist_ok=True)\n    \n    # ========== Step 1: AI拆解关键词 ==========\n    messages = [\n        {\"role\": \"system\", \"content\": \"你是一个内容策划专家。请分析用户提供的主题，提取核心关键词和价值点。输出JSON格式。\"},\n        {\"role\": \"user\", \"content\": f\"\"\"主题：{topic}\n\n请分析并提取：\n1. 核心关键词（5-8个）\n2. 价值点（3-5个）\n3. 建议标题（3个）\n4. 搜索关键词（3-5个）\n\nJSON格式：{{\"keywords\":[\"关键词1\"],\"valuePoints\":[\"价值点1\"],\"titles\":[\"标题1\"],\"searchQueries\":[\"搜索词1\"]}}\"\"\"}\n    ]\n    \n    resp = requests.post(BASE_URL, headers=HEADERS, json={\n        \"model\": \"doubao-seed-2.0-mini\",\n        \"messages\": messages,\n        \"max_tokens\": 800\n    })\n    result_text = json.loads(resp.text)[\"choices\"][0][\"message\"][\"content\"]\n    json_match = re.search(r'\\{[\\s\\S]*\\}', result_text)\n    analysis = json.loads(json_match.group(0)) if json_match else json.loads(result_text)\n    \n    # ========== Step 2: 生成公众号文章 ==========\n    messages = [\n        {\"role\": \"system\", \"content\": \"\"\"你是一个公众号爆款文章创作者。要求：\n1. 开头第一句话必须用加粗格式，3秒内抓住注意力\n2. 文章必须有4-6个小段落标题（使用### 标记）\n3. 每个段落内的重点关键词必须用加粗\n4. 内容要有深度、有独到见解，结合真实案例\n5. 适当使用引用（> 标记）来突出金句或名人名言\n6. 使用列表（- 标记）来组织要点，增强可读性\n7. 结尾有总结升华，呼应主题\n8. 总字数约1200-1500字，宁可少写也不灌水\"\"\"},\n        {\"role\": \"user\", \"content\": f\"\"\"主题：{topic}\n\n核心关键词：{analysis['keywords']}\n\n价值点：{analysis['valuePoints']}\n\n请生成一篇高质量的公众号深度拆解文章。\"\"\"}\n    ]\n    \n    resp = requests.post(BASE_URL, headers=HEADERS, json={\n        \"model\": \"doubao-seed-2.0-pro\",\n        \"messages\": messages,\n        \"max_tokens\": 2200\n    })\n    article = json.loads(resp.text)[\"choices\"][0][\"message\"][\"content\"]\n    \n    # ========== Step 3: 保存文件 ==========\n    title = analysis['titles'][0] if analysis['titles'] else topic\n    today = datetime.now().strftime('%Y-%m-%d')\n    keywords_str = ', '.join(analysis['keywords'][:6])\n    \n    # 生成文件名\n    safe_title = re.sub(r'[^\\w\\s-]', '', title).replace(' ', '-')[:40]\n    filename = f\"{safe_title}.md\"\n    filepath = os.path.join(output_dir, filename)\n    \n    # 写入文件\n    with open(filepath, 'w', encoding='utf-8') as f:\n        f.write(f\"\"\"---\ntitle: {title}\nauthor: 屿蓝\ncategory: 书籍拆解\nkeywords: {keywords_str}\ndate: {today}\n---\n\n{article}\n\"\"\")\n    \n    word_count = len(article)\n    return title, filepath, word_count\n\n# ========== 批量生成示例 ==========\nif __name__ == \"__main__\":\n    topics = [\n        \"红楼梦, 曹雪芹, 人生哲学, 职场智慧\",\n        \"三体, 刘慈欣, 科幻文学, 黑暗森林法则\",\n        \"原则, 达利欧, 商业管理, 投资思维\",\n    ]\n    \n    print(f\"开始批量生成 {len(topics)} 篇文章...\")\n    for idx, topic in enumerate(topics, 1):\n        title, filepath, wc = generate_article(topic)\n        print(f\"[{idx}/{len(topics)}] ✓ {title[:40]}... ({wc}字)\")\n        print(f\"      保存到: {filepath}\")\n```\n\n## 输出质量标准\n\n| 检查项 | 要求 |\n|--------|------|\n| 开头 | 第一句必须加粗，有冲击力 |\n| 段落标题 | 4-6个，使用 ### 标记 |\n| 关键词加粗 | 每个段落内至少2-3个加粗关键词 |\n| 引用 | 至少1处使用 > 标记的引用 |\n| 列表 | 至少1处使用 - 标记的有序要点 |\n| 字数 | 1200-1500字 |\n| 结尾 | 有总结升华，呼应主题 |\n\n## 模型回退策略（关键）\n\n火山引擎API有额度限制，批量生成时经常遇到 `AccountQuotaExceeded` 错误。必须实现模型回退：\n\n```python\nMODELS_FALLBACK = [\"doubao-seed-2.0-pro\", \"doubao-seed-2.0-mini\", \"ark-code-latest\"]\n\ndef call_api(messages, max_tokens=2000):\n    for model in MODELS_FALLBACK:\n        try:\n            resp = requests.post(BASE_URL, headers=HEADERS, json={\n                \"model\": model,\n                \"messages\": messages,\n                \"max_tokens\": max_tokens\n            }, timeout=180)\n            resp_json = json.loads(resp.text)\n            \n            if 'error' in resp_json:\n                if resp_json['error'].get('code') == 'AccountQuotaExceeded':\n                    print(f\"  ⚠️ {model} 额度用完，尝试下一个模型...\")\n                    continue\n                else:\n                    raise Exception(resp_json['error']['message'])\n            \n            # ✅ ark-code-latest 的内容在 reasoning_content 里！\n            content = resp_json[\"choices\"][0][\"message\"][\"content\"]\n            if not content or len(content) < 50:\n                content = resp_json[\"choices\"][0][\"message\"].get(\"reasoning_content\", \"\") or content\n            \n            return content\n        except requests.exceptions.Timeout:\n            continue\n    raise Exception(\"所有模型均不可用\")\n```\n\n## JSON响应解析修复\n\nAI返回的JSON可能包含额外文本，必须用正则提取：\n\n```python\nresult_text = json.loads(resp.text)[\"choices\"][0][\"message\"][\"content\"]\njson_match = re.search(r'\\{[\\s\\S]*\\}', result_text)\nanalysis = json.loads(json_match.group(0)) if json_match else json.loads(result_text)\n```\n\n## ⚠️ 模型选择与额度陷阱（实战经验）\n\n### 模型优先级\n\n```\ndoubao-seed-2.0-mini  >  doubao-seed-2.0-pro  >>  ark-code-latest (不推荐)\n```\n\n- **doubao-seed-2.0-mini**：首选！速度快(15-20s/篇)，质量足够，额度消耗低\n- **doubao-seed-2.0-pro**：质量更好但额度消耗高，适合单篇精修\n- **ark-code-latest**：**极度不推荐用于文章生成**，原因见下\n\n### ark-code-latest 三大陷阱\n\n1. **内容在 reasoning_content 里**：该模型是推理模型(底层是GLM系列)，`content` 字段经常为空，实际文本在 `reasoning_content` 中。必须检查两个字段：\n   ```python\n   content = msg.get(\"content\", \"\") or msg.get(\"reasoning_content\", \"\") or \"\"\n   ```\n\n2. **推理消耗全部token**：max_tokens=500 时，500个token全部花在推理(reasoning)上，content 返回空字符串。需要 max_tokens=4000+ 才能拿到完整文章，但这样额度消耗是 mini 模型的3-5倍。\n\n3. **短消息能过、长文超限**：测试连接(max_tokens=10)能返回OK，但正式生成文章(max_tokens=2000)立即报 `AccountQuotaExceeded`。不能用短消息测试来判断是否有额度。\n\n### 模型回退不能绕过额度限制\n\n**关键**：doubao-seed-2.0-pro、doubao-seed-2.0-mini、ark-code-latest 共享同一个额度池。当一个模型报 `AccountQuotaExceeded`，切换到其他模型也会报同样的错误。模型回退只对网络超时有效，不能绕过额度限制。\n\n正确做法：\n- 遇到 `AccountQuotaExceeded` 立即停止，告知用户额度重置时间\n- 错误消息中包含重置时间：`\"It will reset at 2026-08-03 00:00:00 +0800 CST\"`\n- 不要重试3次浪费时间，直接告知用户\n\n### DeepSeek 官方API ≠ 火山引擎ARK\n\n火山引擎的 Key (`ark-xxxx`) 不能在 `api.deepseek.com` 上使用，两者是完全独立的平台：\n- 火山引擎ARK：`https://ark.cn-beijing.volces.com/api/plan/v3/chat/completions`\n- DeepSeek官方：`https://api.deepseek.com/v1/chat/completions`（需要单独注册的DeepSeek API Key）\n\n如果火山引擎额度用完，需要用户提供 DeepSeek 官方的 API Key 才能继续。\n\n## 其他注意事项\n\n1. **JSON解析**：AI返回的JSON可能包含额外文本说明，必须用 `re.search(r'\\{[\\s\\S]*\\}', text)` 提取JSON部分。\n2. **重试机制**：遇到网络超时时重试1-2次，每次间隔3-5秒。遇到额度超限不要重试。\n3. **去重处理**：批量生成多本书时，每次生成前检查主题是否重复。\n4. **超时设置**：doubao-seed-2.0-mini 设60秒，doubao-seed-2.0-pro 设120秒，ark-code-latest 设180秒。\n5. **额度重置时间不固定**：按套餐购买时间滚动计算（通常7天周期），错误消息中会包含具体重置时间。\n\n## 调用示例\n\n```bash\n# 单篇生成\npython3 -c \"\nfrom gzh_generator import generate_article\ntitle, path, wc = generate_article('被讨厌的勇气, 阿德勒心理学, 自我接纳')\nprint(f'✓ 完成: {title} ({wc}字)')\n\"\n```\n"}, {"slug": "gzh-article-publish", "name": "SKILL.txt", "title": "公众号文章发布技能", "desc": "将文章发布到微信公众号草稿箱，支持文章来源（用户提供或AI拆书）、排版工具转换、封面图获取、自动填写标题/作者/摘要/正文/标签，保存为草稿。通过ProseMirror的pasteHTML方法插入带样式HTML，内容持久化不丢失。", "file": "skills-doc/gzh-article-publish/SKILL.txt", "raw": "---\nname: gzh-article-publish\ndescription: \"将文章发布到微信公众号草稿箱，支持文章来源（用户提供或AI拆书）、排版工具转换、封面图获取、自动填写标题/作者/摘要/正文/标签，保存为草稿。通过ProseMirror的pasteHTML方法插入带样式HTML，内容持久化不丢失。\"\n---\n\n# 公众号文章发布技能\n\n## 功能概述\n\n将文章发布到微信公众号草稿箱，完整流程包含：\n1. **文章来源** — 用户提供文章 或 AI拆书生成文章\n2. **文章准备** — 标题、作者、内容、标签、摘要、封面图\n3. **排版转换** — 使用排版工具将Markdown转为公众号格式\n4. **发布到草稿箱** — 自动填写所有字段并保存\n\n## 触发条件\n\n当用户需要将文章发布到公众号时调用：\n- \"发到公众号\"\n- \"把这篇文章发公众号\"\n- \"拆解《书名》发公众号\"\n- \"公众号发文章\"\n- \"帮我写篇拆书文章发公众号\"\n\n---\n\n## 第一阶段：文章来源\n\n### 来源一：用户提供\n\n用户直接提供文章内容（Markdown或纯文本），直接进入第二阶段。\n\n### 来源二：AI拆书生成\n\n当用户给出书名和作者时，按以下流程生成文章：\n\n#### 步骤1：获取书名和作者\n- 用户提供书名和作者（如\"拆解《原子习惯》，作者是詹姆斯·克利尔\"）\n\n#### 步骤2：写抖音口播长文文案\n从用户角度写有价值、有质量的抖音口播长文文案：\n- 开头要有冲击力，3秒内抓住注意力\n- 用大白话讲解，避免学术腔\n- 有故事、有案例、有金句\n- 适合口播的短句和节奏\n- 长度：1500-2500字\n\n#### 步骤3：转化为公众号文章\n将口播文案转化为公众号文章格式：\n- **小段落标题**：用 `###` 标记每个核心观点\n- **关键字/句子加粗**：用 `**加粗**` 标记金句和核心概念\n- **引用块**：用 `>` 标记金句\n- **列表**：用 `-` 或 `1.` 标记要点\n- **表格**：对比内容用表格呈现\n- **首句加粗**：文章第一句必须加粗（`**首句内容**`）\n- **排版合理**：段落之间空行，层次清晰\n\n---\n\n## 第二阶段：文章准备\n\n发布前需要准备以下内容：\n\n| 字段 | 说明 | 示例 |\n|------|------|------|\n| 标题 | 吸引点击，不超过64字 | 《原子习惯》：每天进步1%，一年后你会强大37倍 |\n| 作者 | 默认填 LGQ | LGQ |\n| 内容 | Markdown格式文章 | 见第一阶段 |\n| 摘要 | 50-120字，概括核心价值 | 詹姆斯·克利尔告诉你，真正的高手从不靠意志力硬撑... |\n| 标签 | 3-5个相关标签 | 拆书、原子习惯、习惯养成 |\n| 封面图 | 从封面图工具获取 | 见封面图获取流程 |\n\n---\n\n## 第三阶段：排版转换（获取带样式的HTML）\n\n**⚠️ 关键**：必须使用排版工具获取带样式（颜色、风格）的HTML，不能直接用mdToHtml()的纯HTML。\n排版工具会应用主题样式（字体、颜色、间距、装饰元素等），直接使用mdToHtml()只能得到无样式的裸HTML。\n\n### 排版工具地址\n`https://shengmingzhishu.github.io/tools/wechat/editor-v1.html`\n\n### 操作步骤\n\n1. **打开排版工具页面**\n2. **点击\"Markdown\"按钮**（页面左下角，id: `modeMd`，切换到Markdown模式）\n3. **将Markdown内容粘贴到编辑框**（textarea，id: `mdArea`）\n\n```javascript\n// 在排版工具页面的browser_evaluate中执行\nconst md = `Markdown文章内容...`;\nconst textarea = document.querySelector('textarea');\nconst setter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;\nsetter.call(textarea, md);\ntextarea.dispatchEvent(new Event('input', { bubbles: true }));\n```\n\n4. **等待排版工具渲染完成**（预览区显示带样式的文章）\n\n### ⚠️ 获取带样式HTML的正确方法\n\n**使用 `getCleanArticleHTML()` 函数（唯一可靠方法）**\n\n排版工具提供了全局函数 `getCleanArticleHTML()`，返回带完整样式的HTML。\n预览区选择器是 `#previewBody`（不是 `.preview`）。\n\n```javascript\n// 在排版工具页面执行：获取带样式的HTML\nconst html = getCleanArticleHTML();\nreturn JSON.stringify({\n  htmlLength: html.length,\n  htmlPreview: html.substring(0, 200),\n  hasSection: html.includes('<section'),\n  message: '获取到带样式的HTML'\n});\n```\n\n**返回的HTML结构**：\n```html\n<section style=\"...\">\n  <p data-trae-ref=\"...\"><strong>首句加粗<\/strong>，正文内容...<\/p>\n  <h3 data-trae-ref=\"...\" style=\"color: rgb(254, 44, 85); font-weight: bold; ...\">段落标题<\/h3>\n  <blockquote style=\"border-left:4px solid #fe2c55; ...\">金句内容<\/blockquote>\n  ...\n<\/section>\n```\n\n### ⚠️ 关键：必须移除外层 `<section>` 包裹\n\nProseMirror的schema不识别 `<section>` 标签，如果直接插入会导致所有内容被合并成一个段落。\n\n**必须移除外层 `<section>` 包裹，只使用内部的 `<p>`、`<h3>`、`<blockquote>` 等元素。**\n\n```javascript\n// 移除section包裹\nlet html = getCleanArticleHTML();\n// 方法：用DOM解析提取内部HTML\nconst temp = document.createElement('div');\ntemp.innerHTML = html;\nconst section = temp.querySelector('section');\nconst innerHTML = section ? section.innerHTML : html;\nreturn innerHTML; // 这就是要插入的HTML\n```\n\n### 排版工具页面元素\n\n| 元素 | 选择器 | 说明 |\n|------|--------|------|\n| Markdown按钮 | `#modeMd` | 切换到Markdown模式 |\n| Markdown输入框 | `textarea#mdArea` 或 `textarea` | 粘贴Markdown内容 |\n| 预览区 | `#previewBody` | class: \"preview-body t-xhs\"，显示带样式预览 |\n| 获取HTML函数 | `getCleanArticleHTML()` | 全局函数，返回带样式HTML（含section包裹） |\n| mdToHtml函数 | `mdToHtml(md)` | 全局函数，Markdown转HTML（无样式，不用） |\n\n---\n\n## 第四阶段：跨标签页数据传输（CORS HTTP服务器）\n\n**⚠️ 关键技术**：排版工具和公众号编辑器在不同标签页，无法直接传递HTML。\n需要通过本地HTTP服务器（带CORS头）中转数据。\n\n### 步骤1：创建HTTP服务器\n\n在工作目录创建 `cors_server.py`：\n\n```python\nimport http.server\nimport socketserver\nimport os\n\nPORT = 18888\nDIRECTORY = os.path.dirname(os.path.abspath(__file__))\n\nclass CORSHTTPRequestHandler(http.server.SimpleHTTPRequestHandler):\n    def __init__(self, *args, **kwargs):\n        super().__init__(*args, directory=DIRECTORY, **kwargs)\n    \n    def end_headers(self):\n        self.send_header('Access-Control-Allow-Origin', '*')\n        self.send_header('Access-Control-Allow-Methods', 'GET')\n        self.send_header('Access-Control-Allow-Headers', 'Content-Type')\n        super().end_headers()\n\n    def do_GET(self):\n        if self.path == '/article':\n            self.path = '/article_html.txt'\n        super().do_GET()\n\nwith socketserver.TCPServer((\"127.0.0.1\", PORT), CORSHTTPRequestHandler) as httpd:\n    print(f\"Serving at port {PORT}\")\n    httpd.serve_forever()\n```\n\n### 步骤2：将HTML写入文件\n\n```python\n# 将从排版工具获取的HTML（已移除section包裹）写入文件\nhtml_content = \"<p>...<\/p><h3>...<\/h3><blockquote>...<\/blockquote>\"\nwith open('article_html.txt', 'w', encoding='utf-8') as f:\n    f.write(html_content)\n```\n\n### 步骤3：启动服务器\n\n```bash\npython cors_server.py\n# 服务器运行在 http://127.0.0.1:18888\n# 访问 http://127.0.0.1:18888/article 获取HTML内容\n```\n\n---\n\n## 第五阶段：封面图准备\n\n### 封面图工具地址\n`https://shengmingzhishu.github.io/tools/image-layout/word-book-v1.html`\n\n### ⚠️ 封面图完整流程概述（重要！）\n\n封面图是文章的\"门面\"，必须按以下完整流程操作，缺一不可：\n\n1. **获取图片URL** — 从封面图工具页面获取一张图片的URL\n2. **插入图片到正文顶部** — 将图片上传到公众号，作为文章正文的第一张图\n3. **插入正文内容** — 在图片下方插入文章正文\n4. **首次保存草稿** — 保存包含图片+正文的草稿\n5. **从正文选择封面** — 点击\"拖拽或选择封面\" → \"从正文选择\" → 选中图片 → \"下一步\" → \"确认\"\n6. **再次保存草稿** — 保存包含封面设置的草稿\n\n**核心原则**：封面图必须先插入正文，再从正文中选择为封面。不能直接上传图片作为封面。\n\n### 步骤1：打开封面图工具页面并获取图片URL\n\n1. 导航到 `https://shengmingzhishu.github.io/tools/image-layout/word-book-v1.html`\n2. 等待页面加载完成（页面会显示多张排版好的图片）\n3. 获取页面中所有图片的URL：\n\n```javascript\n// 在封面图工具页面的browser_evaluate中执行\nconst imgs = document.querySelectorAll('img');\nconst imgUrls = Array.from(imgs)\n  .map(img => img.src)\n  .filter(url => url && !url.startsWith('data:')); // 过滤掉base64图片\nreturn JSON.stringify({ \n  count: imgUrls.length, \n  urls: imgUrls,\n  firstUrl: imgUrls[0] || '',\n  message: '获取到图片URL列表，选择第一张作为封面'\n});\n```\n\n4. **选择第一张图片URL作为封面**（通常第一张尺寸最合适）\n5. 公众号封面建议尺寸：900×383（2.35:1比例），微信支持裁剪\n\n### 步骤2：记录图片URL备用\n\n将获取到的图片URL（如 `https://tencentcdna.production.link3.cc/...`）记录下来，在第六阶段步骤3中会用到。\n\n---\n\n## 第六阶段：发布到草稿箱\n\n### 步骤1：获取token并导航到编辑页\n\n1. 导航到 `https://mp.weixin.qq.com/`\n2. 从跳转后的URL中提取 `token=XXXX`\n3. 导航到编辑页：\n   `https://mp.weixin.qq.com/cgi-bin/appmsg?t=media/appmsg_edit&action=edit&type=77&lang=zh_CN&token=YOUR_TOKEN`\n4. 等待页面加载完成\n\n### 步骤2：填写标题、作者、摘要\n\n```javascript\n// 在browser_evaluate中执行\nconst title = '文章标题';\nconst author = 'LGQ';\nconst digest = '摘要内容（50-120字）';\n\nconst titleInput = document.getElementById('title');\nconst authorInput = document.querySelector('input[placeholder*=\"作者\"]');\nconst digestInput = document.querySelector('textarea[placeholder*=\"选填\"]');\n\nconst setter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;\nconst inputSetter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;\n\nif (titleInput) {\n  setter.call(titleInput, title);\n  titleInput.dispatchEvent(new Event('input', { bubbles: true }));\n  titleInput.dispatchEvent(new Event('change', { bubbles: true }));\n}\nif (authorInput) {\n  inputSetter.call(authorInput, author);\n  authorInput.dispatchEvent(new Event('input', { bubbles: true }));\n  authorInput.dispatchEvent(new Event('change', { bubbles: true }));\n}\nif (digestInput) {\n  setter.call(digestInput, digest);\n  digestInput.dispatchEvent(new Event('input', { bubbles: true }));\n  digestInput.dispatchEvent(new Event('change', { bubbles: true }));\n}\nreturn JSON.stringify({ title: titleInput.value, author: authorInput.value, digest: digestInput.value.substring(0, 50) });\n```\n\n**注意**：标题是 `TEXTAREA` 元素（id为 `title`），必须用 `HTMLTextAreaElement.prototype`，否则报 \"Illegal invocation\"。\n\n### 步骤3：先插入封面图到正文顶部（重要！）\n\n**⚠️ 正确顺序**：先插入封面图 → 再插入正文内容 → 图片在上方，正文在下方\n\n**关键点**：\n1. 图片工具栏按钮选择器是 `li.jsInsertIcon`（第一个），不是 `.jsInsertIcon.img`\n2. 上传图片前，需要先将光标定位到正文编辑器的起始位置\n3. 使用 DataTransfer API 上传图片（fetch → blob → File → DataTransfer → input.files → change事件）\n\n#### 3.1 将光标定位到正文编辑器起始位置\n\n```javascript\n// 在browser_evaluate中执行\nconst view = window.__mpBodyChecktextView;\nif (!view) return JSON.stringify({ error: 'EditorView not found' });\n\n// 聚焦编辑器\nview.focus();\n\n// 将光标定位到文档起始位置（位置0）\nconst state = view.state;\nconst tr = state.tr;\nconst startSelection = state.selection.constructor.create(state.doc, 0, 0);\ntr.setSelection(startSelection);\nview.dispatch(tr);\n\nreturn JSON.stringify({ \n  success: true, \n  message: '光标已定位到正文起始位置，接下来上传封面图'\n});\n```\n\n#### 3.2 展开图片上传菜单并上传封面图\n\n```javascript\n// 在browser_evaluate中执行\n// 1. 展开图片上传菜单（使用 li.jsInsertIcon 选择器，第一个）\nconst imgBtn = document.querySelector('li.jsInsertIcon');\nif (!imgBtn) return JSON.stringify({ error: '未找到图片工具栏按钮 li.jsInsertIcon' });\nimgBtn.click();\nawait new Promise(r => setTimeout(r, 800)); // 等待下拉菜单展开\n\n// 2. fetch封面图并上传到正文顶部\nconst coverUrl = '获取到的封面图URL'; // 从第五阶段获取的URL\nconst resp = await fetch(coverUrl);\nconst blob = await resp.blob();\nconst file = new File([blob], 'cover.png', { type: blob.type || 'image/png' });\n\n// 3. 找到文件上传input并上传\nconst fileInput = document.querySelector('input[type=file]');\nif (!fileInput) return JSON.stringify({ error: '未找到文件上传input' });\n\nconst dt = new DataTransfer();\ndt.items.add(file);\nfileInput.files = dt.files;\nfileInput.dispatchEvent(new Event('change', { bubbles: true }));\n\n// 4. 等待图片上传完成（微信服务器处理）\nawait new Promise(r => setTimeout(r, 3000));\n\n// 5. 验证图片已插入到正文顶部\nconst newState = view.state;\nconst firstNode = newState.doc.child(0);\nconst firstNodeName = firstNode ? firstNode.type.name : 'null';\n\n// 查找已上传到微信服务器的图片（src包含mmbiz）\nconst bodyEditor = document.querySelectorAll('.ProseMirror')[1];\nconst imgs = bodyEditor ? bodyEditor.querySelectorAll('img[src*=\"mmbiz\"]') : [];\n\nreturn JSON.stringify({ \n  coverInserted: imgs.length > 0, \n  imgCount: imgs.length, \n  firstNodeName: firstNodeName,\n  childCount: newState.doc.childCount,\n  imgSrc: imgs[0] ? imgs[0].src.substring(0, 80) : '',\n  message: imgs.length > 0 ? '封面图已插入正文顶部' : '图片上传可能失败，请检查'\n});\n```\n\n**验证标准**：\n- `coverInserted: true`\n- `imgCount > 0`\n- `firstNodeName` 可能是 `nodeleaf`（图片被包裹在 `<section style=\"text-align: center\">` 中）或 `image`\n- `imgSrc` 应包含 `mmbiz.qpic.cn`（微信服务器域名）\n\n**注意**：图片上传后，ProseMirror 会将其包装在 `<section style=\"text-align: center\">` 中，此时第一个节点的类型名是 `nodeleaf`，这是正常现象，不影响后续操作。\n\n### 步骤4：插入正文内容（pasteHTML方法）⭐ 核心步骤\n\n**⚠️ 这是整个流程最关键的一步！**\n\n**技术原理**：\n1. 公众号编辑器使用ProseMirror，全局变量 `window.__mpBodyChecktextView` 是EditorView实例\n2. `view.pasteHTML(html)` 方法通过ProseMirror的剪贴板解析器处理HTML，创建正确的文档节点\n3. 与 `execCommand('insertHTML')` 不同，`pasteHTML` 插入的内容**不会被ProseMirror重渲染清除**\n4. 内联样式会被保留：`<h3>` 的样式在 `attrs.attributes.style`，`<blockquote>` 的样式在 `attrs.style`\n\n**已验证成功的方法：pasteHTML + browser_click保存**\n\n#### 4.1 从HTTP服务器获取HTML并插入\n\n```javascript\n// 在公众号编辑页面的browser_evaluate中执行\n// 前提：已启动CORS HTTP服务器，HTML已写入article_html.txt\n\n// 1. 获取ProseMirror EditorView实例\nconst view = window.__mpBodyChecktextView;\nif (!view) return JSON.stringify({ error: 'EditorView not found' });\n\n// 2. 聚焦编辑器并全选（替换现有内容）\nview.focus();\nconst state = view.state;\nconst tr = state.tr;\nconst allSelection = state.selection.constructor.create(state.doc, 0, state.doc.content.size);\ntr.setSelection(allSelection);\nview.dispatch(tr);\n\n// 3. 从本地HTTP服务器获取HTML（已移除section包裹）\nconst response = await fetch('http://127.0.0.1:18888/article');\nconst html = await response.text();\n\n// 4. 使用pasteHTML插入HTML（核心方法！）\nconst result = view.pasteHTML(html);\n\n// 5. 验证插入结果\nconst newState = view.state;\nconst nodeInfo = [];\nlet headingCount = 0, paraCount = 0, bqCount = 0;\nfor (let i = 0; i < newState.doc.childCount; i++) {\n  const node = newState.doc.child(i);\n  if (node.type.name === 'heading') headingCount++;\n  if (node.type.name === 'para') paraCount++;\n  if (node.type.name === 'blockquote') bqCount++;\n}\n\nreturn JSON.stringify({\n  pasteResult: result,\n  docSize: newState.doc.nodeSize,\n  childCount: newState.doc.childCount,\n  headingCount, paraCount, blockquoteCount: bqCount,\n  message: '内容插入成功，接下来需要用browser_click点击保存按钮'\n});\n```\n\n#### 4.2 保存草稿（使用browser_click工具，不能用JavaScript click！）\n\n**⚠️ 关键**：保存按钮必须通过 `browser_click` 工具点击（模拟真实鼠标点击），不能用 `element.click()` 或 jQuery `trigger('click')`。\n\n**JavaScript的click()和jQuery trigger('click')都不会触发保存API！**\n\n操作步骤：\n1. 调用 `browser_snapshot`（selector: `#js_button_area`，interactive: true）获取页面快照\n2. 在快照中找到 `role: button, name: 保存为草稿` 的元素及其 ref\n3. 调用 `browser_click` 工具，传入该 ref\n4. 等待3-5秒，保存按钮会短暂变为 disabled 状态\n5. 检查网络请求，确认有 `POST operate_appmsg?t=ajax-response&sub=update` 请求\n\n**验证保存成功**：\n```javascript\n// 保存后检查网络请求中是否有：\n// POST https://mp.weixin.qq.com/cgi-bin/operate_appmsg?t=ajax-response&sub=update&type=77\n// 如果有这个请求，说明保存成功\n```\n\n### 步骤5：验证保存结果（刷新页面验证持久化）\n\n**⚠️ 关键验证**：保存后刷新页面，检查内容是否持久化。\n\n```javascript\n// 刷新后执行：验证内容持久化\nconst view = window.__mpBodyChecktextView;\nif (!view) return 'view not found';\n\nconst state = view.state;\nconst doc = state.doc;\nconst results = [];\nresults.push('docSize: ' + doc.nodeSize + ', childCount: ' + doc.childCount);\n\nlet headingCount = 0, paraCount = 0, bqCount = 0;\nfor (let i = 0; i < doc.childCount; i++) {\n  const node = doc.child(i);\n  if (node.type.name === 'heading') {\n    headingCount++;\n    const style = node.attrs.attributes && node.attrs.attributes.style ? 'has style' : 'no style';\n    results.push('heading[' + headingCount + ']: ' + node.textContent.substring(0, 30) + ' | ' + style);\n  }\n  if (node.type.name === 'para') paraCount++;\n  if (node.type.name === 'blockquote') {\n    bqCount++;\n    const style = node.attrs.style ? 'has style' : 'no style';\n    results.push('blockquote[' + bqCount + ']: ' + node.textContent.substring(0, 30) + ' | ' + style);\n  }\n}\nresults.push('totals: heading=' + headingCount + ', para=' + paraCount + ', blockquote=' + bqCount);\nreturn results.join('\\n');\n```\n\n**验证标准**：\n- childCount > 0（内容存在）\n- headingCount > 0（标题节点存在）\n- 样式保留（heading有 `attrs.attributes.style`，blockquote有 `attrs.style`）\n- 如果刷新后内容丢失，说明保存未成功\n\n### 步骤6：设置封面（从正文选择）⭐ 核心步骤\n\n**⚠️ 这是封面图设置的核心步骤！**\n\n**前提条件**：\n- 封面图已插入正文顶部（步骤3完成）\n- 正文内容已插入（步骤4完成）\n- 草稿已首次保存（步骤4.2完成）\n\n**用户要求的正确流程**：\n1. 点击\"拖拽或选择封面\"展开封面设置菜单\n2. 点击\"从正文选择\"打开图片选择对话框\n3. 在对话框中选中正文中的封面图\n4. 点击\"下一步\"进入封面裁剪页面\n5. 点击\"确认\"按钮完成封面设置（如果按钮在视口外，需要先滚动到可见区域）\n6. 验证封面已设置（`has_first_cover: true`）\n7. 再次保存草稿\n\n#### 6.1 点击\"拖拽或选择封面\"展开菜单\n\n```javascript\n// 在browser_evaluate中执行\n// 查找\"拖拽或选择封面\"按钮（SPAN.js_share_type_none_image，display: block 表示未设置封面）\nconst coverTrigger = document.querySelector('SPAN.js_share_type_none_image');\nif (!coverTrigger) {\n  // 检查是否已自动设置封面\n  const appmsg = document.querySelector('.appmsg');\n  const hasAutoCover = appmsg ? appmsg.classList.contains('has_first_cover') : false;\n  return JSON.stringify({ \n    error: '未找到封面设置按钮',\n    hasAutoCover: hasAutoCover,\n    message: hasAutoCover ? '封面已自动设置，跳过此步骤' : '页面结构可能变化，请检查'\n  });\n}\n\n// 点击展开封面设置菜单\ncoverTrigger.click();\nawait new Promise(r => setTimeout(r, 1000)); // 等待菜单展开\n\nreturn JSON.stringify({ \n  success: true, \n  message: '封面设置菜单已展开，接下来点击\"从正文选择\"'\n});\n```\n\n#### 6.2 点击\"从正文选择\"打开图片选择对话框\n\n```javascript\n// 在browser_evaluate中执行\n// 查找\"从正文选择\"链接（A.js_selectCoverFromContent）\nconst selectFromContent = document.querySelector('A.js_selectCoverFromContent');\nif (!selectFromContent) {\n  return JSON.stringify({ \n    error: '未找到\"从正文选择\"按钮',\n    message: '请确认封面设置菜单已展开'\n  });\n}\n\n// 点击\"从正文选择\"\nselectFromContent.click();\nawait new Promise(r => setTimeout(r, 1500)); // 等待对话框加载\n\n// 验证对话框已出现\nconst coverDialog = document.querySelector('.weui-desktop-dialog');\nconst dialogTitle = coverDialog ? coverDialog.querySelector('.weui-desktop-dialog__title') : null;\n\nreturn JSON.stringify({ \n  success: coverDialog ? true : false,\n  dialogTitle: dialogTitle ? dialogTitle.textContent.trim() : '',\n  message: coverDialog ? '图片选择对话框已打开' : '对话框未出现，请重试'\n});\n```\n\n**预期对话框内容**：\n- 标题：\"选择图片\"\n- 说明：\"请从正文插入的图片和视频封面中选择封面\"\n- 按钮：\"下一步\"、\"取消\"\n\n#### 6.3 在对话框中选中封面图\n\n```javascript\n// 在browser_evaluate中执行\n// 查找对话框中的图片项（LI.appmsg_content_img_item）\nconst coverDialog = document.querySelector('.weui-desktop-dialog');\nif (!coverDialog) {\n  return JSON.stringify({ error: '图片选择对话框未找到' });\n}\n\n// 查找图片项\nconst imgItems = coverDialog.querySelectorAll('.appmsg_content_img_item');\nif (imgItems.length === 0) {\n  return JSON.stringify({ \n    error: '对话框中未找到图片',\n    message: '请确认正文已插入图片并保存'\n  });\n}\n\n// 点击第一张图片（即正文顶部的封面图）\nconst firstImg = imgItems[0];\nfirstImg.click();\nawait new Promise(r => setTimeout(r, 500)); // 等待选中状态更新\n\n// 验证图片已被选中（class应包含 selected）\nconst isSelected = firstImg.classList.contains('selected');\n\nreturn JSON.stringify({ \n  success: isSelected,\n  imgCount: imgItems.length,\n  isSelected: isSelected,\n  message: isSelected ? '封面图已选中，接下来点击\"下一步\"' : '选中状态未更新，请检查'\n});\n```\n\n**验证标准**：\n- `isSelected: true`\n- 点击后图片项的 class 会变为 `appmsg_content_img_item selected`\n\n#### 6.4 点击\"下一步\"按钮（使用browser_click工具）\n\n**⚠️ 关键**：对话框按钮必须通过 `browser_click` 工具点击，不能用 JavaScript click()。\n\n操作步骤：\n1. 调用 `browser_snapshot`（selector: `.weui-desktop-dialog`，interactive: true）获取对话框快照\n2. 在快照中找到 `role: button, name: 下一步` 的元素及其 ref\n3. 调用 `browser_click` 工具，传入该 ref\n4. 等待2秒，进入\"编辑封面\"页面\n\n**进入\"编辑封面\"页面后**：\n- 显示封面裁剪界面，包含 2.35:1 和 1:1 两种比例的预览\n- 底部有\"上一步\"、\"确认\"按钮\n\n#### 6.5 点击\"确认\"按钮完成封面设置（使用browser_click工具）\n\n**⚠️ 关键**：\"确认\"按钮可能在视口外，需要先滚动到可见区域！\n\n操作步骤：\n1. 调用 `browser_snapshot`（selector: `.weui-desktop-dialog`，interactive: true）获取对话框快照\n2. 在快照中找到 `role: button, name: 确认` 的元素及其 ref\n3. **如果点击失败（\"Click target intercepted\" 或 \"coordinates outside the visible viewport\"）**：\n   - 调用 `browser_scroll` 工具，传入该 ref 和 `scrollIntoView: true`\n   - 等待1秒\n   - 重新调用 `browser_click` 工具点击该 ref\n4. 等待2秒，对话框关闭，封面设置完成\n\n**错误处理示例**：\n```\n错误：Click target intercepted - Click coordinates (546, 787) are outside the visible viewport\n解决：先调用 browser_scroll（ref: 确认按钮的ref, scrollIntoView: true），再调用 browser_click\n```\n\n#### 6.6 验证封面已设置\n\n```javascript\n// 在browser_evaluate中执行\n// 检查 .appmsg 元素的 classList 是否包含 has_first_cover\nconst appmsg = document.querySelector('.appmsg');\nconst hasFirstCover = appmsg ? appmsg.classList.contains('has_first_cover') : false;\n\n// 检查封面设置区域的显示状态\nconst noneImageSpan = document.querySelector('SPAN.js_share_type_none_image');\nconst imageSpan = document.querySelector('SPAN.js_share_type_image');\nconst noneImageDisplay = noneImageSpan ? getComputedStyle(noneImageSpan).display : 'not found';\nconst imageDisplay = imageSpan ? getComputedStyle(imageSpan).display : 'not found';\n\nreturn JSON.stringify({ \n  hasFirstCover: hasFirstCover,\n  noneImageDisplay: noneImageDisplay, // 应为 'none'（\"拖拽或选择封面\"隐藏）\n  imageDisplay: imageDisplay,         // 应为 'block'（\"默认首图为封面\"显示）\n  message: hasFirstCover ? '✅ 封面设置成功！' : '❌ 封面可能未设置成功，请检查'\n});\n```\n\n**验证标准**：\n- `hasFirstCover: true` ✅\n- `noneImageDisplay: 'none'`（\"拖拽或选择封面\"按钮隐藏）\n- `imageDisplay: 'block'`（\"默认首图为封面\"显示）\n\n#### 6.7 再次保存草稿（使用browser_click工具）\n\n**⚠️ 关键**：封面设置完成后，必须再次保存草稿，否则封面设置不会持久化！\n\n操作步骤：\n1. 调用 `browser_snapshot`（selector: `#js_button_area`，interactive: true）获取页面快照\n2. 在快照中找到 `role: button, name: 保存为草稿` 的元素及其 ref\n3. 调用 `browser_click` 工具，传入该 ref\n4. 等待3-5秒，保存按钮会短暂变为 disabled 状态\n5. 检查网络请求，确认有 `POST operate_appmsg?t=ajax-response&sub=update` 请求\n\n**保存成功后**：封面图设置已持久化，草稿发布完成！\n\n---\n\n## 完整发布流程\n\n### 第一步：准备阶段\n1. 生成或获取文章内容（Markdown格式）\n2. 打开排版工具，粘贴Markdown，等待渲染\n3. 调用 `getCleanArticleHTML()` 获取带样式HTML\n4. 移除 `<section>` 包裹，只保留内部HTML\n5. 将HTML写入 `article_html.txt` 文件\n6. 启动CORS HTTP服务器（端口18888）\n\n### 第二步：发布阶段\n1. 获取封面图URL（从封面图工具页面 word-book-v1.html）\n2. 导航到公众号编辑页（需要token）\n3. 填写标题、作者、摘要\n4. 定位光标到正文起始位置（位置0）\n5. 插入封面图到正文顶部（展开 `li.jsInsertIcon` 菜单 → fetch上传 → 等待3秒）\n6. 执行 pasteHTML 插入正文内容（从HTTP服务器fetch HTML）\n7. 用 `browser_click` 工具点击\"保存为草稿\"按钮（首次保存：图片+正文）\n8. 等待5秒\n9. 刷新页面，验证内容持久化\n10. 设置封面（从正文选择）：\n    - 点击\"拖拽或选择封面\"（`SPAN.js_share_type_none_image`）\n    - 点击\"从正文选择\"（`A.js_selectCoverFromContent`）\n    - 选中对话框中的图片（`LI.appmsg_content_img_item` → 添加 `selected` class）\n    - 用 `browser_click` 点击\"下一步\"按钮\n    - 如\"确认\"按钮在视口外，先 `browser_scroll`（scrollIntoView: true）\n    - 用 `browser_click` 点击\"确认\"按钮\n11. 验证封面设置（`has_first_cover: true`）\n12. 用 `browser_click` 工具再次保存（保存封面设置）\n\n---\n\n## 实测验证的页面元素（2026-07-18）\n\n### 基础元素\n\n| 元素 | 选择器 | 状态 |\n|------|--------|------|\n| 标题输入框 | `#title` 或 `textarea#title` | ✅ TEXTAREA元素，placeholder: \"请在这里输入标题\" |\n| 作者输入框 | `input[placeholder*=\"作者\"]` | ✅ placeholder: \"请输入作者\" |\n| 摘要输入框 | `textarea[placeholder*=\"选填\"]` | ✅ placeholder: \"选填，不填写则默认抓取正文开头部分文字...\" |\n| **ProseMirror EditorView** | `window.__mpBodyChecktextView` | ✅ 全局变量，直接访问EditorView实例 |\n| **正文编辑器DOM** | `document.querySelectorAll('.ProseMirror')[1]` | ✅ 父元素class: `view rich_media_content autoTypeSetting24psection` |\n| 保存草稿按钮 | `#js_submit`（SPAN元素） | ✅ 在 `#js_button_area` 内，必须用browser_click点击 |\n| 发表按钮 | 文本含\"发表\" | ✅ 有效 |\n| 图片工具栏按钮 | `li.jsInsertIcon`（第一个） | ✅ class含 `tpl_item tpl_item_dropdown jsInsertIcon`，点击展开下拉菜单 |\n| 文件上传input | `input[type=file]` | ✅ multiple:true，accept:image/gif,image/jpeg,image/jpg,image/png,image/svg,image/webp |\n\n### 封面图设置相关元素（2026-07-18验证通过）\n\n| 元素 | 选择器 | 状态 |\n|------|--------|------|\n| \"拖拽或选择封面\"按钮 | `SPAN.js_share_type_none_image` | ✅ display:block（未设置封面时显示），点击展开菜单 |\n| \"从正文选择\"链接 | `A.js_selectCoverFromContent` | ✅ 点击打开图片选择对话框 |\n| \"默认首图为封面\" | `SPAN.js_share_type_image` | ✅ display:none（未设置封面时隐藏），设置后显示 |\n| 图片选择对话框 | `.weui-desktop-dialog` | ✅ 标题\"选择图片\"，说明\"请从正文插入的图片和视频封面中选择封面\" |\n| 对话框中的图片项 | `LI.appmsg_content_img_item` | ✅ 点击后class添加 `selected` |\n| \"下一步\"按钮 | `.weui-desktop-dialog` 内按钮 | ✅ 需用browser_click点击，进入裁剪页面 |\n| \"确认\"按钮 | `.weui-desktop-dialog` 内按钮 | ✅ 需用browser_click点击，可能在视口外需先scrollIntoView |\n| 封面设置验证 | `.appmsg` classList 含 `has_first_cover` | ✅ true表示封面已设置 |\n\n### ⚠️ 核心技术发现：pasteHTML方法（2026-07-18验证通过）\n\n**问题**：`execCommand('insertHTML')` 插入的内容会被ProseMirror在重渲染时清除，即使立即保存也会在刷新后丢失。\n\n**解决方案**：使用ProseMirror EditorView的 `pasteHTML()` 方法。\n\n```javascript\nconst view = window.__mpBodyChecktextView;\nview.pasteHTML(html); // 通过ProseMirror剪贴板解析器处理HTML\n```\n\n**pasteHTML的优势**：\n1. 创建正确的ProseMirror文档节点（para, heading, blockquote等）\n2. 内容**不会被重渲染清除**，刷新后依然存在\n3. 内联样式被保留：`<h3>` 样式在 `attrs.attributes.style`，`<blockquote>` 样式在 `attrs.style`\n4. 支持的节点类型：para, heading, blockquote, listitem, list, code, codeblock, table, image, text\n\n**注意事项**：\n- 必须移除 `<section>` 包裹，否则所有内容会被合并成一个段落\n- 保存按钮必须用 `browser_click` 工具点击，JavaScript的click()无效\n\n### ProseMirror Schema节点类型\n\n| HTML标签 | ProseMirror节点 | 说明 |\n|----------|----------------|------|\n| `<p>` | `para` | 段落（注意不是paragraph） |\n| `<h3>` | `heading` | 标题，样式保留在 attrs.attributes.style |\n| `<blockquote>` | `blockquote` | 引用块，样式保留在 attrs.style |\n| `<ul>/<li>` | `list`/`listitem` | 列表 |\n| `<table>` | `table` | 表格（会被转换为DIV结构） |\n| `<img>` | `image` | 图片 |\n| `<strong>/<b>` | text mark | 加粗文本 |\n| `<section>` | ❌ 不支持 | 必须移除外层包裹 |\n\n### ⚠️ 保存按钮的正确点击方式\n\n**保存按钮是 SPAN 元素，id 为 `js_submit`，在 `#js_button_area` 内。**\n\n| 方法 | 是否有效 | 说明 |\n|------|---------|------|\n| `browser_click` 工具（用snapshot ref） | ✅ 有效 | 模拟真实鼠标点击，触发jQuery事件处理器 |\n| `element.click()` | ❌ 无效 | 不触发jQuery绑定的click事件 |\n| `$(el).trigger('click')` | ❌ 无效 | 触发了事件但未发起保存API请求 |\n| `document.execCommand('save')` | ❌ 无效 | 无此命令 |\n\n**保存API**：`POST https://mp.weixin.qq.com/cgi-bin/operate_appmsg?t=ajax-response&sub=update&type=77`\n保存成功后，按钮会短暂变为 disabled 状态，然后恢复。\n\n---\n\n## 排版工具页面元素\n\n| 元素 | 选择器 | 说明 |\n|------|--------|------|\n| Markdown按钮 | `#modeMd` | 切换到Markdown模式 |\n| Markdown输入框 | `textarea#mdArea` | 粘贴Markdown内容 |\n| 预览区 | `#previewBody` | class: \"preview-body t-xhs\" |\n| 获取HTML函数 | `getCleanArticleHTML()` | 返回带样式HTML（含section包裹，需移除） |\n| mdToHtml函数 | `mdToHtml(md)` | Markdown转HTML（无样式，不要使用） |\n\n排版工具地址：`https://shengmingzhishu.github.io/tools/wechat/editor-v1.html`\n\n## 封面图工具页面元素\n\n| 元素 | 选择器 | 说明 |\n|------|--------|------|\n| 图片列表 | `document.querySelectorAll('img')` | 页面上的排版图片 |\n\n封面图工具地址：`https://shengmingzhishu.github.io/tools/image-layout/word-book-v1.html`\n\n---\n\n## 重要注意事项\n\n1. **文章来源**：可以是用户提供，也可以是AI拆书生成（书名作者 → 抖音口播文案 → 公众号文章）\n2. **首句加粗**：文章第一句必须加粗（`**首句内容**`），提升开篇冲击力\n3. **段落标题**：用 `###` 标记核心观点，层次清晰\n4. **关键字加粗**：金句和核心概念用 `**加粗**` 标记\n5. **排版工具**：先点Markdown按钮，粘贴MD内容，等待渲染完成\n6. **获取HTML**：使用 `getCleanArticleHTML()` 函数获取带样式HTML\n7. **移除section**：必须移除外层 `<section>` 包裹，否则内容合并成一个段落\n8. **CORS服务器**：需要本地HTTP服务器中转HTML数据（端口18888）\n9. **pasteHTML方法**：使用 `window.__mpBodyChecktextView.pasteHTML(html)` 插入内容\n10. **保存按钮**：必须用 `browser_click` 工具点击，不能用JavaScript click()\n11. **标题类型**：标题是TEXTAREA，必须用 `HTMLTextAreaElement.prototype`\n12. **作者默认**：作者填 LGQ\n13. **封面图完整流程**（重要！）：\n    - 从 word-book-v1.html 获取封面图URL（步骤5）\n    - 定位光标到正文起始位置（步骤3.1）\n    - 将封面图插入文章正文顶部（步骤3.2，使用 `li.jsInsertIcon` + DataTransfer）\n    - 插入正文内容在图片下方（步骤4，使用 pasteHTML）\n    - 首次保存草稿（步骤4.2，用browser_click）\n    - 设置封面：点击\"拖拽或选择封面\" → \"从正文选择\" → 选中图片 → \"下一步\" → \"确认\"（步骤6）\n    - 验证封面设置（`has_first_cover: true`）\n    - 再次保存草稿（步骤6.7，用browser_click）\n14. **token有效期**：token有时效性，过期需从首页重新获取\n15. **草稿保存**：点击\"保存为草稿\"后URL变化（含 `appmsgid=XXXX`）\n16. **验证持久化**：保存后刷新页面，检查内容是否还在（防止保存失败）\n17. **\"确认\"按钮可能不在视口内**：点击\"确认\"时如报\"Click target intercepted\"，需先用 `browser_scroll`（scrollIntoView: true）滚动到按钮位置\n\n---\n\n## 错误处理\n\n| 错误情况 | 处理方式 |\n|---------|---------|\n| 页面跳转到登录页 | 提醒用户登录公众号后重试 |\n| 标题填写失败 | 确认用HTMLTextAreaElement.prototype（不是HTMLInputElement） |\n| `__mpBodyChecktextView` 未找到 | 确认页面已完全加载，或刷新页面重试 |\n| pasteHTML后内容为空 | 检查HTML是否含 `<section>` 包裹（需移除） |\n| 保存按钮点击无效 | 必须用 `browser_click` 工具，不能用JavaScript click() |\n| 刷新后内容丢失 | 说明保存未成功，检查网络请求是否有 `sub=update` 的POST请求 |\n| token过期 | 重新导航到首页获取新token |\n| 查询到错误的ProseMirror | 用 `window.__mpBodyChecktextView` 而非DOM查询 |\n| 排版工具获取HTML失败 | 确认已切换到Markdown模式并粘贴内容，使用 `getCleanArticleHTML()` |\n| CORS服务器未启动 | 检查 `cors_server.py` 是否运行在端口18888 |\n| fetch HTML失败 | 检查 `article_html.txt` 文件是否存在，服务器是否正常 |\n| 封面图上传失败 | 检查封面图URL是否可访问，重试fetch；确认使用 `li.jsInsertIcon` 选择器 |\n| \"拖拽或选择封面\"未找到 | 检查 `SPAN.js_share_type_none_image` 是否存在；可能已自动设置封面（检查 `has_first_cover`） |\n| \"从正文选择\"未找到 | 确认 `A.js_selectCoverFromContent` 存在；确认封面菜单已展开（先点击\"拖拽或选择封面\"） |\n| 对话框中未找到图片 | 确认正文已插入图片并首次保存；检查 `LI.appmsg_content_img_item` 是否存在 |\n| 图片选中状态未更新 | 点击后检查 class 是否包含 `selected`；可能需要等待500ms |\n| \"下一步\"按钮点击无效 | 必须用 `browser_click` 工具点击，不能用JS click() |\n| \"确认\"按钮点击报错\"Click target intercepted\" | 先用 `browser_scroll`（scrollIntoView: true）滚动到按钮，再 `browser_click` |\n| 封面设置后未保存 | 确保用 `browser_click` 工具点击最终保存按钮（步骤6.7） |\n| `has_first_cover` 为 false | 封面未设置成功，重新执行步骤6.1-6.7 |\n| 光标定位失败 | 使用 `view.focus()` + `state.selection.constructor.create(state.doc, 0, 0)` 定位到起始位置 |\n\n---\n\n## 输出报告格式\n\n```\n公众号文章发布完成\n- 标题：文章标题\n- 作者：LGQ\n- 摘要：摘要内容...\n- 正文：N个节点（heading=X, para=X, blockquote=X），样式保留\n- 封面：已设置 / 未设置（草稿可后续补充）\n- 草稿ID：appmsgid=XXXXXXX\n- 持久化验证：刷新后内容完整保留 ✅\n- 查看草稿：访问 https://mp.weixin.qq.com/ 首页\"近期草稿\"区域\n```\n\n---\n\n## 批量发布流程\n\n1. 准备多篇文章（用户提供或AI拆书生成）\n2. 对每篇：\n   - 排版工具转换Markdown → `getCleanArticleHTML()` 获取HTML\n   - 移除section包裹，写入article_html.txt\n   - 启动CORS服务器\n   - 从 word-book-v1.html 获取封面图URL\n   - 导航到编辑页，填写标题、作者、摘要\n   - 定位光标到正文起始位置\n   - 插入封面图到正文顶部（`li.jsInsertIcon` → DataTransfer上传）\n   - 执行 pasteHTML 插入正文内容\n   - 用 `browser_click` 工具点击保存（首次保存：图片+正文）\n   - 等待5秒，刷新验证持久化\n   - 设置封面（从正文选择）：\n     - 点击\"拖拽或选择封面\"（`SPAN.js_share_type_none_image`）\n     - 点击\"从正文选择\"（`A.js_selectCoverFromContent`）\n     - 选中图片（`LI.appmsg_content_img_item`）\n     - 用 `browser_click` 点击\"下一步\"\n     - 如需要，先 `browser_scroll`（scrollIntoView: true）再点击\"确认\"\n     - 用 `browser_click` 点击\"确认\"\n   - 验证封面设置（`has_first_cover: true`）\n   - 用 `browser_click` 工具再次保存（保存封面设置）\n3. 每篇间隔5秒\n4. 报告发布结果\n\n---\n\n## 完整流程速查表\n\n| 步骤 | 操作 | 关键点 |\n|------|------|--------|\n| 1. 文章来源 | 用户提供或AI拆书 | 首句加粗，段落标题用### |\n| 2. 文章准备 | 标题/作者(LGQ)/摘要/标签/封面图 | 摘要50-120字 |\n| 3. 排版转换 | 排版工具Markdown模式 → `getCleanArticleHTML()` | 移除section包裹 |\n| 4. 数据传输 | HTML写入文件 → 启动CORS服务器 | 端口18888 |\n| 5. 封面图准备 | 从word-book-v1.html获取图片URL | 过滤base64，选第一张 |\n| 6. 导航编辑页 | 获取token → 导航到编辑页URL | token从跳转URL提取 |\n| 7. 填写字段 | 标题(TEXTAREA)/作者(INPUT)/摘要 | 用对应的prototype |\n| 8. 定位光标 | `view.focus()` + 定位到位置0 | 光标在正文起始位置 |\n| 9. 插入封面图 | `li.jsInsertIcon` → DataTransfer上传 → 等待3秒 | 图片在正文顶部 |\n| 10. 插入正文 | `view.pasteHTML(html)` 从HTTP服务器fetch | **核心方法** |\n| 11. 首次保存 | `browser_click` 工具点击\"保存为草稿\" | **不能用JS click()** |\n| 12. 验证持久化 | 刷新页面，检查节点数和样式 | 确认内容不丢失 |\n| 13. 展开封面菜单 | 点击\"拖拽或选择封面\"（`SPAN.js_share_type_none_image`） | 等待1秒菜单展开 |\n| 14. 从正文选择 | 点击\"从正文选择\"（`A.js_selectCoverFromContent`） | 等待1.5秒对话框加载 |\n| 15. 选中封面图 | 点击 `LI.appmsg_content_img_item` | class添加 `selected` |\n| 16. 点击下一步 | `browser_click` 点击\"下一步\"按钮 | 进入裁剪页面 |\n| 17. 点击确认 | 如需先 `browser_scroll`（scrollIntoView）→ `browser_click` 点击\"确认\" | **可能需要先滚动** |\n| 18. 验证封面 | 检查 `has_first_cover: true` | 确认封面已设置 |\n| 19. 再次保存 | `browser_click` 工具点击\"保存为草稿\" | **保存封面设置** |\n"}, {"slug": "gzh-batch-publish", "name": "gzh-batch-publish.txt", "title": "公众号文章批量发布技能", "desc": "将用户提供的Markdown文章批量发布到微信公众号草稿箱。支持排版转换、封面图插入、互动语清理、ensure_ascii=False防乱码发布。", "file": "skills-doc/gzh-batch-publish/gzh-batch-publish.txt", "raw": "---\nname: gzh-batch-publish\ndescription: \"将用户提供的Markdown文章批量发布到微信公众号草稿箱。支持排版转换、封面图插入、互动语清理、ensure_ascii=False防乱码发布。\"\n---\n\n# 公众号文章批量发布技能\n\n## 功能概述\n\n将用户提供的 Markdown 文章批量发布到微信公众号草稿箱，完整流程包含：\n\n1. **文章来源** — 用户指定 `.md` 文件所在目录\n2. **内容清理** — 删除互动引导句、关注提醒等不合规内容\n3. **排版转换** — Markdown 转 HTML，应用小红书/精读蓝等模板样式\n4. **封面图插入** — 在正文顶部插入封面图片\n5. **防乱码发布** — 使用 `ensure_ascii=False` 方式调用微信 API\n\n## 触发条件\n\n当用户需要将本地的 Markdown 文章批量发布到公众号时调用：\n- \"把这个目录的文章发到公众号\"\n- \"批量发布这些 md 文件\"\n- \"把这 100 篇文章发到草稿箱\"\n\n---\n\n## 第一阶段：文章来源\n\n### 用户提供文章目录\n\n用户指定一个目录路径，该目录下包含 `.md` 格式的文章文件。\n\n文件格式示例：\n```markdown\n---\ntitle: 《未来简史2.0》深度拆解\nauthor: 尤瓦尔·赫拉利\ncategory: 社会科学\nbook_id: 1\n---\n\n**首句加粗**，正文内容...\n\n### 小段落标题\n\n正文内容...\n```\n\n每篇文章包含：\n- **YAML 前置元数据**（frontmatter）：`title`、`author`、`category`、`book_id`\n- **正文**：Markdown 格式，包含 `**加粗**`、`### 标题`、`> 引用`、`- 列表`、`--- 分割线` 等\n\n### 文件命名规则\n\n`序号_书名.md`，例如：\n- `001_未来简史2.0.md`\n- `002_原子习惯.md`\n\n---\n\n## 第二阶段：文章准备与清理\n\n### 解析文件\n\n```python\nimport re\n\ndef parse_md_file(filepath):\n    \"\"\"Parse a markdown article file\"\"\"\n    with open(filepath, 'r', encoding='utf-8') as f:\n        content = f.read()\n    \n    # 从 frontmatter 提取标题\n    title_match = re.search(r'title:\\s*(.+?)$', content, re.MULTILINE)\n    title = title_match.group(1).strip() if title_match else os.path.splitext(os.path.basename(filepath))[0]\n    \n    # 提取摘要\n    digest_match = re.search(r'description:\\s*(.+?)$', content, re.MULTILINE)\n    digest = digest_match.group(1).strip() if digest_match else \"\"\n    \n    # 移除 frontmatter\n    body = re.sub(r'^---\\n.*?\\n---\\n', '', content, flags=re.DOTALL)\n    \n    return title, digest, body\n```\n\n### 内容清理（去除互动引导和关注提醒）\n\n```python\ndef clean_article(content):\n    \"\"\"Remove ALL interactive questions, follow reminders, and guiding sentences\"\"\"\n    patterns = [\n        # 评论区互动引导\n        r'你在.*?最[戳打].*?的[瞬间画面].*?是[什么哪].*?[？?]',\n        r'你[最近上次].*?有没有.*?(?:的[经历故事时刻]|[吗？?])',\n        r'你有没有过.*?(?:的时刻|的经历|的感觉|被.*?[吗？?])',\n        r'(?:欢迎|快来).*?在.*?(?:评论区|留言区|下方).*?(?:留言|评论|分享|告诉我|聊聊).*',\n        r'在.*?(?:评论区|留言区|下方).*?(?:留言|评论|分享|聊聊|告诉我|说说).*',\n        r'(?:分享|说说|聊聊).*?你的.*?(?:想法|看法|故事|经历|答案).*[。.！!]?$',\n        r'你对.*?怎么[看看想].*[？?]',\n        r'你觉得.*?(?:呢|吗|？|\\\\?)',\n        r'你[认同同意]吗[？?]',\n        r'说说你的看法[。.]?$',\n        r'你准备好.*?了吗[？?]',\n        \n        # 关注/点赞/在看提醒\n        r'关注我[们]?[，,。.！!]?.*?(?:获取|收看|收到|不错过|一起|更多)',\n        r'(?:记得|不要忘了|别忘了|不要忘记).*?(?:点赞|在看|关注|转发|分享|收藏)',\n        r'(?:点击|点个).*?(?:关注|在看|赞|收藏)',\n        r'(?:长按|扫码|扫描).*?(?:关注|二维码|识别)',\n        r'(?:如果你喜欢|如果觉得不错|喜欢的话).*?(?:分享|点赞|关注|转发)',\n        \n        # 下期预告/抽奖/送书\n        r'抽[1-9]位.*?(?:送出|赠送|送).*',\n        r'我们下期(?:再见|见|分享|更新|继续聊).*',\n        r'下期[再见见].*',\n        r'关注我们.*下期.*',\n        \n        # 感谢/结尾套话\n        r'感谢.*?(?:阅读|观看|收看|聆听).*?(?:我们下期|下次|再见)',\n        r'感谢大家的.*?(?:阅读|观看|收看|支持).*',\n        \n        # 其他互动引导\n        r'最后想[问问问问聊].*',\n        r'你最近一次.*是[什么哪].*[？?]',\n        r'你上次在.*是.*[？?]',\n        r'你.*时候.*开始.*[？?]',\n        r'你在.*有没有.*[？?]',\n        r'说说你的.*[。.！!]?$',\n        r'欢迎.*告诉我.*[。.！!]?$',\n    ]\n    for p in patterns:\n        content = re.sub(p, '', content, flags=re.MULTILINE)\n    return content.strip()\n```\n\n---\n\n## 第三阶段：排版转换（带样式的 HTML）\n\n### 小红书模板样式\n\n```python\nTEMPLATE = {\n    'body': 'color:#333333;background:#ffffff;line-height:1.75;font-size:16px;letter-spacing:1px;',\n    'h1': 'color:#fe2c55;font-weight:bold;text-align:center;margin:28px 0 14px;border-bottom:2px solid #fe2c55;padding-bottom:8px;letter-spacing:2px;',\n    'h2': 'color:#ffffff;font-weight:bold;margin:24px 0 12px;background:#fe2c55;padding:6px 16px;border-radius:20px;display:inline-block;',\n    'h3': 'color:#fe2c55;font-weight:bold;margin:20px 0 8px;border-left:4px solid #fe2c55;padding:3px 0 3px 10px;',\n    'blockquote': 'border-left:4px solid #fe2c55;color:#555;background:#fff5f7;margin:14px 0;padding:8px 14px;border-radius:0 8px 8px 0;',\n    'hr': 'border:none;border-top:1px dashed #ffb3c1;margin:20px 0;',\n    'a': 'color:#fe2c55;text-decoration:none;border-bottom:1px solid #fe2c55;',\n    'code': 'background:#fff0f2;color:#fe2c55;padding:2px 6px;border-radius:3px;font-size:90%;',\n    'pre': 'background:#fff5f7;padding:12px;border-radius:8px;overflow:auto;border:1px solid #ffe0e6;'\n}\n```\n\n### Markdown 转 HTML（带样式）\n\n```python\ndef md_to_styled_html(md_text):\n    \"\"\"Convert markdown to HTML with inline styles (小红书模板)\"\"\"\n    lines = md_text.split('\\n')\n    html_parts = []\n    in_ul = False\n    \n    for line in lines:\n        stripped = line.strip()\n        if not stripped:\n            if in_ul: html_parts.append('<\/ul>'); in_ul = False\n            continue\n        \n        # Headings\n        h = re.match(r'^(#{1,6})\\s+(.+)$', stripped)\n        if h:\n            if in_ul: html_parts.append('<\/ul>'); in_ul = False\n            level = len(h.group(1))\n            text = inline_format(h.group(2))\n            tag = f'h{level}'\n            style = TEMPLATE.get(tag, '')\n            html_parts.append(f'<{tag} style=\"{style}\">{text}<\/{tag}>')\n            continue\n        \n        # Blockquote\n        if stripped.startswith('> '):\n            if in_ul: html_parts.append('<\/ul>'); in_ul = False\n            text = inline_format(stripped[2:])\n            html_parts.append(f'<blockquote style=\"{TEMPLATE[\"blockquote\"]}\">{text}<\/blockquote>')\n            continue\n        \n        # HR\n        if re.match(r'^[-*_]{3,}$', stripped):\n            if in_ul: html_parts.append('<\/ul>'); in_ul = False\n            html_parts.append(f'<hr style=\"{TEMPLATE[\"hr\"]}\">')\n            continue\n        \n        # List\n        if re.match(r'^[-*+]\\s+', stripped):\n            text = inline_format(re.sub(r'^[-*+]\\s+', '', stripped))\n            if not in_ul: html_parts.append('<ul>'); in_ul = True\n            html_parts.append(f'<li>{text}<\/li>')\n            continue\n        \n        # Paragraph\n        if in_ul: html_parts.append('<\/ul>'); in_ul = False\n        text = inline_format(stripped)\n        html_parts.append(f'<p style=\"margin:8px 0;\">{text}<\/p>')\n    \n    if in_ul: html_parts.append('<\/ul>')\n    return '\\n'.join(html_parts)\n\ndef inline_format(text):\n    text = re.sub(r'\\*\\*(.+?)\\*\\*', r'<strong>\\1<\/strong>', text)\n    text = re.sub(r'\\*(.+?)\\*', r'<em>\\1<\/em>', text)\n    text = re.sub(r'`(.+?)`', rf'<code style=\"{TEMPLATE[\"code\"]}\">\\1<\/code>', text)\n    return text\n```\n\n---\n\n## 第四阶段：发布到草稿箱（防乱码）\n\n### 核心：使用 ensure_ascii=False\n\n**这是解决乱码问题的关键！** 微信 API 的部分后端服务器对 JSON 中 `\\uXXXX` Unicode 转义码处理不正确，会二次转义导致乱码。\n\n解决方案：发送时用 `ensure_ascii=False`，让中文以 **UTF-8 原始字节** 形式出现在 JSON 中，而非 `\\uXXXX` 转义序列。\n\n```python\n# ✅ 正确方式（防乱码）\nbody = json.dumps(payload, ensure_ascii=False).encode('utf-8')\nresp = requests.post(\n    url,\n    data=body,\n    headers={'Content-Type': 'application/json; charset=utf-8'},\n    timeout=30\n)\n\n# ❌ 错误方式（可能导致乱码）\nresp = requests.post(url, json=payload)  # 内部使用 ensure_ascii=True\n```\n\n### 完整发布函数\n\n```python\ndef publish_article(token, title, styled_html, digest=\"\"):\n    \"\"\"Publish article to WeChat draft with styled HTML\"\"\"\n    # 1. 封面图插入正文顶部\n    img_tag = f'<p style=\"text-align:center;margin:0 0 16px 0;\">' \\\n              f'<img src=\"{CONTENT_IMG_URL}\" alt=\"\" style=\"max-width:100%;height:auto;' \\\n              f'border-radius:6px;display:block;margin:0 auto;\" /><\/p>'\n    full_html = img_tag + '\\n' + styled_html\n    \n    # 2. 清理互动引导\n    full_html = clean_article(full_html)\n    \n    # 3. 用 section 包裹并应用 body 样式\n    full_html = f'<section style=\"{TEMPLATE[\"body\"]}\">\\n{full_html}\\n<\/section>'\n    \n    # 4. 构建请求\n    payload = {\n        \"articles\": [{\n            \"title\": title,\n            \"author\": AUTHOR,\n            \"digest\": digest[:120] if digest else title,\n            \"content\": full_html,\n            \"content_source_url\": \"\",\n            \"thumb_media_id\": COVER_MEDIA_ID,\n            \"need_open_comment\": 0,\n            \"only_fans_can_comment\": 0\n        }]\n    }\n    \n    # 5. 防乱码发送\n    body = json.dumps(payload, ensure_ascii=False).encode('utf-8')\n    resp = requests.post(\n        f'https://api.weixin.qq.com/cgi-bin/draft/add?access_token={token}',\n        data=body,\n        headers={'Content-Type': 'application/json; charset=utf-8'},\n        timeout=30\n    )\n    result = resp.json()\n    \n    if 'media_id' in result:\n        return result['media_id']\n    return None\n```\n\n### 封面图准备\n\n```python\n# 上传封面图到微信素材库\ncurl -s -F \"media=@cover.jpg\" \\\n  \"https://api.weixin.qq.com/cgi-bin/material/add_material?access_token=${TOKEN}&type=image\"\n# 返回: {\"media_id\": \"xxx\", \"url\": \"http://mmbiz.qpic.cn/...\"}\n\n# 上传正文可用的图片\ncurl -s -F \"media=@cover.jpg\" \\\n  \"https://api.weixin.qq.com/cgi-bin/media/uploadimg?access_token=${TOKEN}\"\n# 返回: {\"url\": \"http://mmbiz.qpic.cn/...\"}\n```\n\n---\n\n## 第五阶段：批量运行\n\n### 后台运行\n\n```bash\ncd /home/ubuntu && python3 /tmp/batch_publish_styled_v2.py\n```\n\n使用 `background=true` + `notify_on_complete=true` 后台运行，完成后自动通知。\n\n### 完整脚本结构\n\n```python\n#!/usr/bin/env python3\n\"\"\"\n批量发布书籍拆解文章到公众号草稿箱\n\"\"\"\nimport json, re, os, time, requests\n\n# === 配置 ===\nAPPID = \"用户AppID\"\nAPPSECRET = \"用户AppSecret\"\nAUTHOR = \"屿蓝\"  # 公众号作者名（2个中文字以内）\nCOVER_MEDIA_ID = \"上传后获取的永久media_id\"\nCONTENT_IMG_URL = \"上传后获取的图片URL\"\nARTICLES_DIR = \"/path/to/articles\"  # 用户提供的 .md 文件目录\n\n# === 主流程 ===\ndef main():\n    token = get_token()\n    files = sorted([f for f in os.listdir(ARTICLES_DIR) if f.endswith('.md')])\n    \n    for fname in files:\n        # 1. 解析文件\n        # 2. 清理内容\n        # 3. 排版转换\n        # 4. 发布到草稿箱\n        # 5. 间隔0.5秒\n        pass\n    \n    print(f\"完成: {success}篇成功, {failed}篇失败\")\n```\n\n---\n\n## 注意事项与已知问题\n\n### 🚫 绝对禁止：删除草稿箱内容\n**永远不要删除用户公众号草稿箱中的已有草稿。** 即使用户要求\"清理\"或\"重置\"，也不要调用 `draft/delete` API。如果用户提到需要清理旧草稿，告知用户手动在公众号后台操作。此规则不可覆盖。\n\n### ⚠️ 作者名字节限制\n微信 API 的 `author` 字段限制 **8 个字节**。中文 UTF-8 编码每字 3 字节，所以最多 **2 个中文字**。\n\n### ⚠️ API 编码不一致\n微信 `draft/add` API 存在后端负载均衡问题，部分服务器正确解析 Unicode，部分服务器二次转义。使用 `ensure_ascii=False` + `data=` 方式发送，成功率 100%。\n\n---\n\n## 参考文件\n\n- `references/wx-api-encoding-deep-dive.md` — 微信API编码问题深度分析（ensure_ascii=False 原理、根因、验证方法）\n- `references/wechat-api-key-points.md` — 微信API Key配置要点\n\n## 完整脚本文件\n\n本 skill 引用的完整发布脚本位于：\n- `/tmp/batch_publish_styled_v2.py` — 批量发布脚本（排版 + 防乱码）\n"}, {"slug": "gzh-image-publish", "name": "SKILL.txt", "title": "公众号贴图发布技能", "desc": "将本地图片目录批量上传到微信公众号草稿箱（贴图模式）。从草稿箱→新的创作→贴图入口进入，按首页→内容页→尾页顺序逐张上传，自动填写标题和描述，保存为草稿。通过CORS文件服务器+DataTransfer API实现浏览器自动化上传。", "file": "skills-doc/gzh-image-publish/SKILL.txt", "raw": "---\nname: gzh-image-publish\ndescription: \"将本地图片目录批量上传到微信公众号草稿箱（贴图模式）。从草稿箱→新的创作→贴图入口进入，按首页→内容页→尾页顺序逐张上传，自动填写标题和描述，保存为草稿。通过CORS文件服务器+DataTransfer API实现浏览器自动化上传。\"\n---\n\n# 公众号贴图发布技能\n\n## 功能概述\n\n将本地图片目录批量上传到微信公众号草稿箱（贴图模式），适合小红书风格图片发布。\n- **正确入口**：草稿箱 → 新的创作 → 贴图（下拉菜单第3项）\n- 按文件名排序自动确定上传顺序：`00_cover` → `01_content` → ... → `0X_end`（首页→内容页→尾页）\n- 自动填写标题（取自文件夹名，选填）和描述（摘要）\n- 第一张图片自动成为封面\n- 保存为草稿，不自动发表\n\n## 触发条件\n\n当用户需要将图片批量上传到公众号时调用：\n- \"把xxx目录的图片发到公众号\"\n- \"上传贴图到公众号草稿\"\n- \"批量上传公众号图文\"\n- \"公众号发贴图\"\n\n## 前置条件\n\n1. **已登录公众号**：用户需在浏览器中已登录微信公众平台 (mp.weixin.qq.com)\n2. **图片目录**：指定目录下含有图片文件（png/jpg/jpeg/gif/webp），文件名以数字前缀排序\n3. **CORS文件服务器**：需启动支持CORS的本地HTTP服务器（端口18889）\n\n## 图片目录结构要求\n\n```\n指定目录/\n├── 文章标题1/\n│   ├── 00_cover.png      ← 首页（自动成为封面）\n│   ├── 01_content.png    ← 内容页1\n│   ├── 02_content.png    ← 内容页2\n│   ├── 03_content.png    ← 内容页3\n│   └── 04_end.png        ← 尾页\n├── 文章标题2/\n│   ├── 00_cover.png\n│   ├── 01_content.png\n│   ├── 02_content.png\n│   └── 03_end.png\n```\n\n**排序规则**：按文件名数字前缀升序排列（00 → 01 → 02 → ...），确保首页在前、尾页在后。\n**标题来源**：文件夹名即为文章标题（可去除emoji后缀）。\n\n---\n\n## 完整流程\n\n### 第一步：启动CORS文件服务器\n\n将以下脚本保存为 `file_server_cors.py`：\n\n```python\nimport http.server, sys\n\nPORT = 18889\nDIRECTORY = sys.argv[1] if len(sys.argv) > 1 else \".\"\n\nclass CORSHandler(http.server.SimpleHTTPRequestHandler):\n    def __init__(self, *args, **kwargs):\n        super().__init__(*args, directory=DIRECTORY, **kwargs)\n\n    def end_headers(self):\n        self.send_header('Access-Control-Allow-Origin', '*')\n        self.send_header('Access-Control-Allow-Methods', 'GET, OPTIONS')\n        self.send_header('Access-Control-Allow-Headers', '*')\n        super().end_headers()\n\n    def do_OPTIONS(self):\n        self.send_response(200)\n        self.end_headers()\n\nhttpd = http.server.HTTPServer((\"127.0.0.1\", PORT), CORSHandler)\nprint(f\"Serving {DIRECTORY} on port {PORT} with CORS\")\nhttpd.serve_forever()\n```\n\n运行方式（blocking: false，长驻进程）：\n```bash\npython file_server_cors.py \"D:\\图片目录路径\"\n```\n\n**关键**：必须添加CORS头，否则公众号页面（HTTPS）无法fetch localhost。\n\n### 第二步：扫描图片目录\n\n```powershell\n# 列出目录下所有图片文件（按名称排序）\nGet-ChildItem -Path \"D:\\图片目录\\文章标题\" -Include *.png,*.jpg,*.jpeg,*.gif,*.webp -File | Sort-Object Name | Select-Object Name\n```\n\n确认图片列表和排序顺序。文件名应形如 `00_cover.png`, `01_content.png`, ..., `0X_end.png`。\n\n### 第三步：导航到草稿箱并进入贴图编辑页（⚠️ 正确入口）\n\n**⚠️ 关键：必须从草稿箱→新的创作→贴图入口进入，不能直接导航到编辑页URL！**\n\n#### 3.1 导航到公众号首页\n\n```\n导航到 https://mp.weixin.qq.com/\n```\n\n#### 3.2 进入草稿箱\n\n用 `browser_snapshot` 获取页面元素，找到\"全部草稿\"按钮并点击：\n- 按钮名称：`全部草稿`\n- 点击后会打开新标签页，URL格式：`https://mp.weixin.qq.com/cgi-bin/appmsg?begin=0&count=10&type=77&action=list_card&token=XXXX&lang=zh_CN`\n\n#### 3.3 点击\"新的创作\"按钮\n\n在草稿箱页面，用 `browser_snapshot` 找到\"新的创作\"按钮：\n- 按钮名称：`新的创作`\n- 位置：页面右侧\n\n用 `browser_click` 工具点击该按钮（不要用JavaScript click()）。\n\n#### 3.4 选择\"贴图\"选项\n\n点击\"新的创作\"后，会展开下拉菜单，包含以下选项：\n1. 文章\n2. 选择已有内容\n3. **贴图** ← 第3个选项，这就是我们要的！\n4. 视频\n5. 播客\n6. 转载\n\n用 `browser_snapshot` 找到\"贴图\"选项，用 `browser_click` 工具点击。\n\n#### 3.5 确认进入贴图编辑页\n\n点击贴图后会打开新标签页，URL格式：\n```\nhttps://mp.weixin.qq.com/cgi-bin/appmsg?t=media/appmsg_edit_v2&action=edit&isNew=1&type=10&createType=8&token=XXXX&lang=zh_CN&timestamp=XXXX\n```\n\n**关键参数**：\n- `type=10`（贴图类型，不同于普通文章的type=77）\n- `createType=8`（贴图创建类型）\n- `isNew=1`（新建）\n\n等待页面加载完成，用 `browser_snapshot` 确认看到以下元素：\n- 图片上传区域：\"选择或拖拽图片到此处\"\n- 标题输入框（placeholder: \"请在这里输入标题（选填）\"）\n- 描述输入框（placeholder: \"选填，不填写则默认抓取正文开头部分文字...\"）\n- \"保存为草稿\"按钮\n\n### 第四步：填写标题和描述\n\n```javascript\n// 在browser_evaluate中执行\nconst results = {};\n\n// 1. 设置标题（选填）\nconst titleInput = document.getElementById('title');\nif (titleInput) {\n  const setter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;\n  setter.call(titleInput, '文章标题');\n  titleInput.dispatchEvent(new Event('input', { bubbles: true }));\n  titleInput.dispatchEvent(new Event('change', { bubbles: true }));\n  results.title = titleInput.value;\n}\n\n// 2. 设置描述/摘要（选填）\nconst descInput = document.getElementById('js_description');\nif (descInput) {\n  const setter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;\n  setter.call(descInput, '描述内容...');\n  descInput.dispatchEvent(new Event('input', { bubbles: true }));\n  descInput.dispatchEvent(new Event('change', { bubbles: true }));\n  results.description = descInput.value.substring(0, 50) + '...';\n}\n\nreturn JSON.stringify(results);\n```\n\n**注意**：\n- 标题是 `TEXTAREA` 元素（id为 `title`），必须用 `HTMLTextAreaElement.prototype`，否则报 \"Illegal invocation\" 错误\n- 标题是**选填**的（placeholder含\"选填\"字样）\n- 描述框id为 `js_description`，用于填写摘要内容\n\n### 第五步：逐张上传图片（核心步骤）\n\n**⚠️ 关键要点**：\n1. **第一张图片**：使用 `.image-selector__add` 区域的 file input（主上传区域）\n2. **后续图片**：使用 `.image-selector__bottom-add` 区域的 file input（底部添加区域，第一张上传后出现）\n3. **不需要展开下拉菜单**：直接通过DataTransfer API设置file input\n4. 每张图片上传后等待4秒，确保上传完成\n\n#### 5.1 上传第一张图片（封面）\n\n```javascript\n// 在browser_evaluate中执行\nconst imageUrl = 'http://127.0.0.1:18889/00_cover.png';\n\nasync function uploadFirstImage() {\n  try {\n    // 1. 从CORS服务器获取图片\n    const resp = await fetch(imageUrl);\n    if (!resp.ok) return 'fetch failed: ' + resp.status;\n    const blob = await resp.blob();\n    const fileName = imageUrl.split('/').pop();\n    const file = new File([blob], fileName, { type: blob.type });\n    \n    // 2. 找到主上传区域的file input\n    // 主上传区域：.image-selector__add\n    const addArea = document.querySelector('.image-selector__add');\n    if (!addArea) return 'main upload area not found';\n    \n    const fileInput = addArea.querySelector('input[type=file]');\n    if (!fileInput) return 'file input not found in main area';\n    \n    // 3. 通过DataTransfer API设置文件\n    const dt = new DataTransfer();\n    dt.items.add(file);\n    fileInput.files = dt.files;\n    fileInput.dispatchEvent(new Event('change', { bubbles: true }));\n    \n    // 4. 等待上传完成\n    await new Promise(r => setTimeout(r, 4000));\n    \n    // 5. 验证上传结果\n    const mmbizImgs = document.querySelectorAll('img[src*=\"mmbiz\"]');\n    const cardThumbs = document.querySelectorAll('.card_img_thumb');\n    const bottomAdd = document.querySelector('.image-selector__bottom-add');\n    \n    return JSON.stringify({\n      success: true,\n      fileName: fileName,\n      fileSize: blob.size,\n      mmbizImgCount: mmbizImgs.length,\n      cardThumbCount: cardThumbs.length,\n      bottomAddAppeared: !!bottomAdd\n    });\n  } catch (e) {\n    return 'error: ' + e.message;\n  }\n}\n\nreturn await uploadFirstImage();\n```\n\n#### 5.2 上传后续图片（内容页和尾页）\n\n```javascript\n// 在browser_evaluate中执行（第2张及之后的图片）\nconst imageUrl = 'http://127.0.0.1:18889/01_content.png';\n\nasync function uploadSubsequentImage() {\n  try {\n    const resp = await fetch(imageUrl);\n    if (!resp.ok) return 'fetch failed: ' + resp.status;\n    const blob = await resp.blob();\n    const fileName = imageUrl.split('/').pop();\n    const file = new File([blob], fileName, { type: blob.type });\n    \n    // ⚠️ 关键：后续图片使用底部添加区域的file input\n    const bottomAdd = document.querySelector('.image-selector__bottom-add');\n    if (!bottomAdd) return 'bottom add area not found';\n    \n    const fileInput = bottomAdd.querySelector('input[type=file]');\n    if (!fileInput) return 'file input not found in bottom add';\n    \n    const dt = new DataTransfer();\n    dt.items.add(file);\n    fileInput.files = dt.files;\n    fileInput.dispatchEvent(new Event('change', { bubbles: true }));\n    \n    // 等待上传完成\n    await new Promise(r => setTimeout(r, 4000));\n    \n    // 验证\n    const cardThumbs = document.querySelectorAll('.card_img_thumb');\n    return JSON.stringify({\n      success: true,\n      fileName: fileName,\n      cardThumbCount: cardThumbs.length\n    });\n  } catch (e) {\n    return 'error: ' + e.message;\n  }\n}\n\nreturn await uploadSubsequentImage();\n```\n\n#### 5.3 批量上传完整脚本（推荐）\n\n```javascript\n// === 在browser_evaluate中一次性执行 ===\n// 前置条件：CORS文件服务器已在端口18889运行，指向图片目录\n\nconst images = [\n  'http://127.0.0.1:18889/00_cover.png',\n  'http://127.0.0.1:18889/01_content.png',\n  'http://127.0.0.1:18889/02_content.png',\n  'http://127.0.0.1:18889/03_content.png',\n  'http://127.0.0.1:18889/04_end.png'\n];\n\n// 上传第一张图片（使用主上传区域）\nasync function uploadFirstImage(imgUrl) {\n  const resp = await fetch(imgUrl);\n  const blob = await resp.blob();\n  const fileName = imgUrl.split('/').pop();\n  const file = new File([blob], fileName, { type: blob.type });\n  \n  const addArea = document.querySelector('.image-selector__add');\n  const fileInput = addArea.querySelector('input[type=file]');\n  \n  const dt = new DataTransfer();\n  dt.items.add(file);\n  fileInput.files = dt.files;\n  fileInput.dispatchEvent(new Event('change', { bubbles: true }));\n  \n  await new Promise(r => setTimeout(r, 4000));\n  return { fileName, size: blob.size };\n}\n\n// 上传后续图片（使用底部添加区域）\nasync function uploadSubsequentImage(imgUrl) {\n  const resp = await fetch(imgUrl);\n  const blob = await resp.blob();\n  const fileName = imgUrl.split('/').pop();\n  const file = new File([blob], fileName, { type: blob.type });\n  \n  // 等待底部添加区域出现\n  let bottomAdd = document.querySelector('.image-selector__bottom-add');\n  if (!bottomAdd) {\n    await new Promise(r => setTimeout(r, 1000));\n    bottomAdd = document.querySelector('.image-selector__bottom-add');\n  }\n  \n  const fileInput = bottomAdd.querySelector('input[type=file]');\n  \n  const dt = new DataTransfer();\n  dt.items.add(file);\n  fileInput.files = dt.files;\n  fileInput.dispatchEvent(new Event('change', { bubbles: true }));\n  \n  await new Promise(r => setTimeout(r, 4000));\n  return { fileName, size: blob.size };\n}\n\n// 逐张上传图片\nconst uploadResults = [];\n\n// 第一张：使用主上传区域\nuploadResults.push(await uploadFirstImage(images[0]));\n\n// 后续图片：使用底部添加区域\nfor (let i = 1; i < images.length; i++) {\n  uploadResults.push(await uploadSubsequentImage(images[i]));\n}\n\nreturn JSON.stringify({\n  success: true,\n  imagesUploaded: uploadResults.length,\n  uploadDetails: uploadResults\n});\n```\n\n### 第六步：保存为草稿\n\n**⚠️ 关键：必须用 `browser_click` 工具点击保存按钮，不能用JavaScript click()！**\n\n#### 6.1 获取页面快照\n\n```\n用 browser_snapshot（interactive: true）获取页面元素\n找到\"保存为草稿\"按钮的 ref\n```\n\n#### 6.2 点击保存按钮\n\n```\n用 browser_click 工具点击保存按钮\nelement: \"保存为草稿按钮\"\nref: 从快照中获取的 ref 值\n```\n\n**不能用以下方式**（均无效）：\n- `document.getElementById('js_submit').click()` ❌\n- `jQuery trigger('click')` ❌\n- `evaluate中的 saveBtn.click()` ❌\n\n### 第七步：确认保存成功\n\n```javascript\n// 在browser_evaluate中执行\nawait new Promise(r => setTimeout(r, 3000));\n\n// 检查URL变化\nconst results = {\n  url: location.href,\n  hasAppMsgId: location.href.includes('appmsgid='),\n  appMsgId: (location.href.match(/appmsgid=(\\d+)/) || [])[1]\n};\n\n// 检查分页指示器（确认图片数量）\nconst previewCenter = document.querySelector('.image-selector__preview-center');\nif (previewCenter) {\n  const text = (previewCenter.textContent || '').trim();\n  // 分页格式如 \"1/4\" 表示第1页共4页\n  const match = text.match(/(\\d+)\\/(\\d+)/);\n  if (match) {\n    results.currentPage = match[1];\n    results.totalPages = match[2];\n  }\n}\n\nreturn JSON.stringify(results, null, 2);\n```\n\n**保存成功的标志**：\n- URL从 `type=10&createType=8` 变为 `type=77&appmsgid=XXXX`\n- URL包含 `appmsgid=数字`\n\n### 第八步：刷新验证（可选但推荐）\n\n```\n用 browser_navigate 重新导航到保存后的URL\n用 browser_evaluate 检查：\n- 标题是否保存\n- 分页指示器是否显示正确的图片数量\n```\n\n---\n\n## 实测验证的页面元素（2026-07-18）\n\n### 入口页面元素\n\n| 元素 | 选择器/位置 | 状态 |\n|------|--------|------|\n| 全部草稿按钮 | 首页\"全部草稿\"button | ✅ 点击后打开草稿箱新标签页 |\n| 草稿箱页面 | URL含 `action=list_card` | ✅ 显示草稿列表 |\n| 新的创作按钮 | 草稿箱页面右侧button | ✅ 点击展开下拉菜单 |\n| 贴图选项 | 下拉菜单第3项 | ✅ 点击后打开贴图编辑页新标签页 |\n\n### 贴图编辑页元素\n\n| 元素 | 选择器 | 状态 |\n|------|--------|------|\n| 编辑页URL | `type=10&createType=8` | ✅ 贴图类型标识 |\n| 标题输入框 | `#title` 或 `textarea#title` | ✅ TEXTAREA元素，placeholder: \"请在这里输入标题（选填）\" |\n| 描述/摘要框 | `#js_description` | ✅ TEXTAREA元素，placeholder: \"选填，不填写则默认抓取正文开头部分文字...\" |\n| 主图片上传区域 | `.image-selector__add` | ✅ 包含file input，文本\"选择或拖拽图片到此处\" |\n| 底部添加区域 | `.image-selector__bottom-add` | ✅ 第一张上传后出现，用于添加后续图片 |\n| 主上传file input | `.image-selector__add input[type=file]` | ✅ multiple:true |\n| 底部添加file input | `.image-selector__bottom-add input[type=file]` | ✅ multiple:true |\n| 图片预览区 | `.image-selector__preview-center-img` | ✅ 显示当前选中图片 |\n| 卡片缩略图 | `.card_img_thumb` | ✅ 每张图片一个缩略图，使用background-image |\n| 分页指示器 | `.image-selector__preview-center` 文本 | ✅ 格式如\"1/4\"表示第1页共4页 |\n| 保存草稿按钮 | `SPAN#js_submit` 或 button文本\"保存为草稿\" | ✅ 必须用browser_click工具点击 |\n| 发表按钮 | button文本\"发表\" | ✅ 有效 |\n| 预览按钮 | button文本\"预览\" | ✅ 有效 |\n\n### 上传选项（主上传区域和底部添加区域都有）\n\n| 选项 | 说明 |\n|------|------|\n| 本地上传 | 通过file input上传本地图片 |\n| 从图片库选择 | 从微信图片库选择 |\n| 微信扫码上传 | 手机扫码上传 |\n| AI 配图 | AI生成图片 |\n| 文字海报 | 生成文字海报 |\n\n---\n\n## ⚠️ 关键区别：贴图 vs 普通文章\n\n| 方面 | 贴图模式 | 普通文章模式 |\n|------|---------|------------|\n| **入口** | 草稿箱→新的创作→贴图 | 草稿箱→新的创作→文章 |\n| **URL参数** | `type=10&createType=8` | `type=77` |\n| **编辑器** | 无ProseMirror，用image-selector | 有ProseMirror正文编辑器 |\n| **图片上传** | 主上传区域file input | 工具栏下拉菜单 |\n| **标题** | 选填 | 必填 |\n| **内容** | 描述框 `#js_description`（摘要） | ProseMirror正文编辑器 |\n| **保存后URL** | 变为 `type=77&appmsgid=XXXX` | 保持 `type=77&appmsgid=XXXX` |\n\n---\n\n## 重要注意事项\n\n1. **正确入口**：必须从草稿箱→新的创作→贴图进入，不能直接导航到编辑页URL\n2. **CORS必须**：文件服务器必须添加 `Access-Control-Allow-Origin: *` 头，否则HTTPS页面无法fetch localhost\n3. **两个上传区域**：第一张图片用 `.image-selector__add`，后续图片用 `.image-selector__bottom-add`\n4. **不需要展开下拉菜单**：直接通过DataTransfer API设置file input，不需要点击展开任何菜单\n5. **标题类型**：标题是 `TEXTAREA`（id为 `title`），必须用 `HTMLTextAreaElement.prototype`，否则报 \"Illegal invocation\"\n6. **保存按钮**：必须用 `browser_click` 工具点击，不能用JavaScript click()或jQuery trigger\n7. **草稿保存**：点击\"保存为草稿\"后URL变化（含 `appmsgid=XXXX`），type从10变为77\n8. **token有效期**：token有时效性，过期需从首页重新获取\n9. **上传间隔**：每张图片上传后等待4秒，确保上传完成再上传下一张\n10. **上传顺序**：按文件名排序（00→01→02→...），确保首页在前、尾页在后\n11. **图片上传到微信CDN**：上传后图片URL变为 `mmbiz.qpic.cn` 域名\n12. **分页指示器**：上传后可通过 `.image-selector__preview-center` 的文本确认图片数量（如\"1/4\"）\n\n---\n\n## 错误处理\n\n| 错误情况 | 处理方式 |\n|---------|---------|\n| 页面跳转到登录页 | 提醒用户登录公众号后重试 |\n| \"Failed to fetch\"错误 | 检查CORS文件服务器是否运行（端口18889） |\n| 找不到\"新的创作\"按钮 | 确认已进入草稿箱页面（URL含 `action=list_card`） |\n| 找不到\"贴图\"选项 | 确认已点击\"新的创作\"展开下拉菜单 |\n| 主上传区域file input未找到 | 确认页面已完全加载，用 `.image-selector__add input[type=file]` |\n| 底部添加区域未出现 | 第一张图片可能未上传成功，检查mmbiz图片是否存在 |\n| 标题填写失败 | 确认用HTMLTextAreaElement.prototype（不是HTMLInputElement） |\n| 保存按钮点击失败 | 必须用browser_click工具，不能用JavaScript click() |\n| 保存后URL无appmsgid | 检查网络请求，确认保存API被调用 |\n| token过期 | 重新导航到首页获取新token |\n| 上传后图片数量不对 | 检查分页指示器 `.image-selector__preview-center` 的文本 |\n\n---\n\n## 清理步骤\n\n1. 终止CORS文件服务器进程\n2. 解锁浏览器（`browser_unlock`）\n3. 向用户报告结果\n\n## 输出报告格式\n\n```\n公众号贴图发布完成\n- 标题：文章标题\n- 描述：描述内容摘要\n- 图片数量：N张（首页1 + 内容页M + 尾页1）\n- 上传成功：N张\n- 封面：已自动设置（首页图）\n- 草稿ID：appmsgid=XXXXXXX\n- 查看草稿：访问 https://mp.weixin.qq.com/ 草稿箱\n```\n"}, {"slug": "toutiao-publish", "name": "SKILL.txt", "title": "今日头条文章发布", "desc": "将Markdown文章发布到今日头条号草稿箱。通过浏览器自动化，自动填写标题、正文、标签，并保存为草稿。适用于将本地Markdown文章批量发布到头条号的场景。", "file": "skills-doc/toutiao-publish/SKILL.txt", "raw": "---\nname: toutiao-publish\ndescription: \"将Markdown文章发布到今日头条号草稿箱。通过浏览器自动化，自动填写标题、正文、标签，并保存为草稿。适用于将本地Markdown文章批量发布到头条号的场景。\"\n---\n\n# 今日头条文章发布\n\n## 功能概述\n\n将Markdown格式的文章自动发布到今日头条号（mp.toutiao.com）草稿箱。自动完成：标题填写、正文粘贴（保留格式）、标签添加、保存草稿。\n\n## 触发条件\n\n当用户需要将文章发布到今日头条时调用此skill。典型场景：\n- 用户说\"发到头条\"\n- 用户说\"上传到头条号\"\n- 用户说\"把这篇文章发头条\"\n\n## 前置条件\n\n1. **已登录头条号**：用户需在浏览器中已登录头条号创作平台 (mp.toutiao.com)\n2. **文章内容**：Markdown格式的文章内容（可从本地文件读取或直接提供）\n3. **排版工具（可选）**：如需保留Markdown格式转换为HTML，可使用排版工具 `https://shengmingzhishu.github.io/tools/wechat/editor-v1.html` 的 `mdToHtml()` 函数\n\n## 核心流程\n\n### 第零步：内容准备规范\n\n在发布文章前，需要对 Markdown 内容做以下处理：\n\n1. **首句加粗**：文章正文的第一句话必须用 `**...**` 包裹加粗，让文章开篇更有冲击力。例如：\n   - 原文：`你有没有发现一个现象：`\n   - 处理后：`**你有没有发现一个现象：**`\n\n2. **图片处理**：\n   - **默认无图发布**：如果没有上传图片，在发布页选择\"无封面\"选项，直接以纯文本方式发布\n   - **固定配图（可选）**：如果需要配图，可使用固定的网络图片 URL，通过 HTML `<img>` 标签插入正文，或在封面设置中选择\"单图\"并填入图片 URL\n   - 推荐固定图片 URL 示例：`https://images.unsplash.com/photo-1455390582262-044cdead277a?w=800`（书籍/阅读主题）\n\n3. **标题截断**：头条号标题限制 30 字以内，超长需截断\n\n### 第一步：导航到头条号发布页\n\n```\nURL: https://mp.toutiao.com/profile_v4/graphic/publish\n```\n\n等待页面加载完成，通过 `browser_snapshot` 确认标题输入框和正文编辑器已出现。\n\n**如果页面跳转到登录页**，说明未登录，需要提醒用户先登录头条号。\n\n### 第二步：填写标题\n\n头条号的标题输入框是一个 **textarea** 元素（实测验证），placeholder 为\"请输入文章标题（2～30个字）\"。\n\n```javascript\n// 在browser_evaluate中执行\n// 查找标题输入框（实测为 TEXTAREA 元素）\nconst titleInput = document.querySelector('[placeholder*=\"标题\"]');\n\nif (titleInput) {\n  // 标题是 textarea，必须用 HTMLTextAreaElement.prototype\n  const nativeSetter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;\n  nativeSetter.call(titleInput, '文章标题');\n  titleInput.dispatchEvent(new Event('input', { bubbles: true }));\n  titleInput.dispatchEvent(new Event('change', { bubbles: true }));\n  return 'title set: ' + titleInput.value;\n}\nreturn 'title input not found';\n```\n\n**注意**：\n- 标题是 `TEXTAREA` 元素，必须用 `HTMLTextAreaElement.prototype` 的 setter，用 `HTMLInputElement.prototype` 会报 \"Illegal invocation\" 错误\n- 标题限制 30 字以内，超长需截断\n\n### 第三步：填写正文（两种方式）\n\n#### 方式A：粘贴HTML（推荐，保留格式）\n\n如果已通过排版工具将Markdown转为HTML，使用ClipboardEvent注入：\n\n```javascript\n// 在browser_evaluate中执行\n// 查找正文编辑器 - 头条号通常使用ProseMirror或contenteditable编辑器\nconst editor = document.querySelector('.ProseMirror') ||\n               document.querySelector('[contenteditable=true]') ||\n               document.querySelector('.public-DraftEditor-content') ||\n               document.querySelector('[class*=\"editor\"][contenteditable]') ||\n               document.querySelector('[class*=\"content\"][contenteditable]');\n\nif (!editor) return 'editor not found';\n\neditor.focus();\n\n// 构造HTML内容\nconst html = '<p>正文段落1<\/p><h3>小标题<\/h3><p>正文段落2<\/p>';\n\n// 通过ClipboardEvent注入HTML\nconst clipboardData = new DataTransfer();\nclipboardData.setData('text/html', html);\nclipboardData.setData('text/plain', html.replace(/<[^>]*>/g, ''));\nconst pasteEvent = new ClipboardEvent('paste', {\n  bubbles: true,\n  cancelable: true,\n  clipboardData: clipboardData\n});\neditor.dispatchEvent(pasteEvent);\nreturn 'content pasted via ClipboardEvent';\n```\n\n#### 方式B：直接插入纯文本\n\n如果不需要保留格式，可以直接设置文本：\n\n```javascript\n// 在browser_evaluate中执行\nconst editor = document.querySelector('[contenteditable=true]') ||\n               document.querySelector('.ProseMirror');\nif (!editor) return 'editor not found';\n\neditor.focus();\ndocument.execCommand('selectAll', false, null);\ndocument.execCommand('insertText', false, '正文内容...');\nreturn 'content inserted via execCommand';\n```\n\n### 第四步：添加标签\n\n头条号发布页通常有\"添加标签\"的入口。\n\n```javascript\n// 在browser_evaluate中执行\n// 查找标签输入区域\nconst tagBtn = Array.from(document.querySelectorAll('button, a, [role=button], [class*=tag]'))\n  .find(el => el.textContent.includes('标签') || el.textContent.includes('话题'));\n\nif (tagBtn) {\n  tagBtn.click();\n  // 等待标签输入框出现后输入标签\n  await new Promise(r => setTimeout(r, 1000));\n  const tagInput = document.querySelector('[placeholder*=\"标签\"]') ||\n                   document.querySelector('[placeholder*=\"输入\"]') ||\n                   document.querySelector('.tag-input input');\n  if (tagInput) {\n    const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;\n    setter.call(tagInput, '标签内容');\n    tagInput.dispatchEvent(new Event('input', { bubbles: true }));\n    tagInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));\n    return 'tag added';\n  }\n  return 'tag button clicked but no input found';\n}\nreturn 'no tag button found';\n```\n\n**注意**：标签不是必填项。如果找不到标签入口，跳过此步骤。\n\n### 第五步：草稿自动保存（无需手动操作）\n\n**重要发现（实测验证）**：头条号编辑器有**自动保存草稿**功能，不需要手动点击任何保存按钮！\n\n页面底部会显示自动保存状态，元素 class 为 `footer-tip footer-draft-save`，显示文本为\"草稿已保存\"和字数统计（如\"共 970 字\"）。\n\n页面底部按钮只有：预览、定时发布、预览并发布——**没有\"保存草稿\"按钮**，因为草稿是自动保存的。\n\n**操作方式**：填写完标题和正文后，等待 3 秒让编辑器自动保存即可。\n\n```javascript\n// 在browser_evaluate中执行 - 验证草稿已自动保存\nconst draftTip = document.querySelector('.footer-draft-save') ||\n                 document.querySelector('[class*=draft-save]') ||\n                 document.querySelector('.footer-tip-save');\nif (draftTip) {\n  return 'auto-save status: ' + dra
