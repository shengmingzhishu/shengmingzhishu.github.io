ftTip.textContent.trim();\n}\n// 备用：检查底部文本是否含\"草稿已保存\"\nconst footer = document.querySelector('.publish-footer');\nif (footer && footer.textContent.includes('草稿已保存')) {\n  return 'draft auto-saved';\n}\nreturn 'auto-save status unknown';\n```\n\n### 第六步：确认保存成功\n\n草稿自动保存后，可通过以下方式确认：\n\n**方式A：检查页面底部提示（当前页面）**\n```javascript\n// 页面底部应显示\"草稿已保存 共 N 字\"\nconst footer = document.querySelector('.publish-footer, .garr-footer-publish-content');\nreturn footer ? footer.textContent.trim().substring(0, 50) : 'no footer found';\n```\n\n**方式B：重新访问发布页查看草稿列表**\n重新导航到 `https://mp.toutiao.com/profile_v4/graphic/publish`，页面会显示草稿列表，包含已保存的草稿标题、\"继续编辑\"和\"更多草稿\"链接。\n\n```javascript\n// 检查草稿列表\nconst draftSection = Array.from(document.querySelectorAll('*'))\n  .find(el => el.textContent.includes('继续编辑') && el.textContent.includes('草稿'));\nif (draftSection) {\n  return 'drafts visible: ' + draftSection.textContent.trim().substring(0, 100);\n}\nreturn 'no draft section found';\n```\n\n## Token优化策略\n\n### 单篇文章完整发布脚本模板\n\n将标题填写、正文粘贴、标签添加合并到一个evaluate中执行：\n\n```javascript\n// === 在browser_evaluate中一次性执行 ===\nconst title = '文章标题';\nconst html = '<p><strong>首句加粗<\/strong>，正文内容...<\/p>';\n\n// 1. 填写标题（标题是 TEXTAREA，必须用 HTMLTextAreaElement.prototype）\nconst titleInput = document.querySelector('[placeholder*=\"标题\"]');\nif (titleInput) {\n  const setter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;\n  setter.call(titleInput, title.substring(0, 30));\n  titleInput.dispatchEvent(new Event('input', { bubbles: true }));\n}\n\n// 2. 粘贴正文\nawait new Promise(r => setTimeout(r, 500));\nconst editor = document.querySelector('.ProseMirror') ||\n               document.querySelector('[contenteditable=true]');\nif (editor) {\n  editor.focus();\n  const cd = new DataTransfer();\n  cd.setData('text/html', html);\n  cd.setData('text/plain', html.replace(/<[^>]*>/g, ''));\n  editor.dispatchEvent(new ClipboardEvent('paste', {\n    bubbles: true, cancelable: true, clipboardData: cd\n  }));\n}\n\n// 3. 等待内容渲染后添加标签\nawait new Promise(r => setTimeout(r, 1000));\n// 标签添加逻辑（如果有标签入口）\n\n// 4. 等待草稿自动保存（头条号编辑器自动保存，无需手动点击）\nawait new Promise(r => setTimeout(r, 3000));\nconst draftTip = document.querySelector('.footer-draft-save, .footer-tip-save');\nif (draftTip && draftTip.textContent.includes('草稿已保存')) {\n  return 'article auto-saved to draft: ' + draftTip.textContent.trim();\n}\n// 即使没找到提示元素，草稿也已自动保存\nreturn 'article filled, draft auto-saving';\n```\n\n## Markdown转HTML的方法\n\n### 方法一：使用排版工具（推荐）\n\n1. 在浏览器中打开排版工具：`https://shengmingzhishu.github.io/tools/wechat/editor-v1.html`\n2. 在排版工具标签页中执行evaluate，调用 `mdToHtml()` 函数：\n\n```javascript\n// 在排版工具标签页的browser_evaluate中执行\nconst textarea = document.querySelector('textarea');\ntextarea.value = markdownContent;\ntextarea.dispatchEvent(new Event('input', { bubbles: true }));\nconst html = mdToHtml(textarea.value);\nreturn html; // 返回HTML字符串\n```\n\n3. 获取到HTML后，在头条号标签页中通过ClipboardEvent粘贴\n\n### 方法二：简单转换\n\n如果不需要复杂格式，可以直接将Markdown转为简单HTML：\n\n```javascript\nfunction simpleMdToHtml(md) {\n  let html = md;\n  // 标题\n  html = html.replace(/^### (.+)$/gm, '<h3>$1<\/h3>');\n  html = html.replace(/^## (.+)$/gm, '<h2>$1<\/h2>');\n  html = html.replace(/^# (.+)$/gm, '<h1>$1<\/h1>');\n  // 粗体\n  html = html.replace(/\\*\\*(.+?)\\*\\*/g, '<strong>$1<\/strong>');\n  // 引用\n  html = html.replace(/^> (.+)$/gm, '<blockquote>$1<\/blockquote>');\n  // 列表\n  html = html.replace(/^- (.+)$/gm, '<li>$1<\/li>');\n  html = html.replace(/(<li>.+<\\/li>\\n?)+/g, '<ul>$&<\/ul>');\n  // 段落（把剩余的纯文本行包装成<p>）\n  html = html.split('\\n\\n').map(p => {\n    if (p.match(/^<(h|ul|ol|blockquote|table)/)) return p;\n    return '<p>' + p.replace(/\\n/g, '<br>') + '<\/p>';\n  }).join('');\n  return html;\n}\n```\n\n## 完整发布流程（从Markdown文件到草稿）\n\n1. 读取本地Markdown文件内容\n2. 打开排版工具标签页，将Markdown输入文本框，调用 `mdToHtml()` 获取HTML\n3. 打开头条号发布页 (`https://mp.toutiao.com/profile_v4/graphic/publish`)\n4. 等待页面加载，确认标题输入框和编辑器已出现\n5. 执行完整evaluate脚本：填写标题 + 粘贴正文 + 等待自动保存\n6. 等待3秒，通过页面底部\"草稿已保存\"提示确认保存成功\n7. 解锁浏览器，向用户报告结果\n\n## 批量发布流程\n\n如果需要发布多篇文章：\n\n1. 读取包含多篇文章的Markdown文件（如 `10篇拆书文章.md`）\n2. 按文章分隔符（如 `## 文章XX：标题`）拆分为单篇文章\n3. 对每篇文章执行上述完整发布流程\n4. 每篇之间等待5秒，避免频繁操作\n5. 记录每篇的发布结果，最后统一报告\n\n### 批量发布脚本结构\n\n```\n对每篇文章：\n  → 导航到 https://mp.toutiao.com/profile_v4/graphic/publish\n  → 等待2秒页面加载\n  → evaluate: 填写标题 + 粘贴正文 + 等待3秒自动保存\n  → 确认页面底部显示\"草稿已保存\"\n  → 记录结果\n  → 继续下一篇\n```\n\n## 重要注意事项\n\n1. **登录状态**：头条号页面如果跳转到登录页，说明登录已过期，需要提醒用户重新登录\n2. **标题输入框类型**：标题是 `TEXTAREA` 元素（不是 input），必须用 `HTMLTextAreaElement.prototype` 的 setter，否则报 \"Illegal invocation\" 错误\n3. **标题长度**：头条号标题建议30字以内，最长不超过64字（placeholder提示为\"请输入文章标题（2～30个字）\"）\n4. **首句加粗**：文章正文第一句必须用 `**...**` 加粗，提升开篇冲击力\n5. **正文格式**：头条号支持HTML粘贴，表格、引用块、标题、列表、粗体等格式全部保留（实测验证）\n6. **草稿自动保存**：头条号编辑器有自动保存功能，填写完内容后等待3秒即可，无需手动点击保存按钮\n7. **草稿位置**：头条号草稿保存在云端（与小红书不同），换设备登录也能看到。草稿列表在发布页(`publish`)右侧显示，不是单独的草稿箱页面\n8. **图片处理**：默认无图发布（选择\"无封面\"），如需配图可用固定网络图片 URL\n9. **发布频率**：批量发布时每篇间隔5秒以上，避免被平台限制\n10. **标签限制**：头条号标签通常限制5个以内，每个标签不超过10字\n11. **DOM变化**：头条号前端可能更新，如果选择器失效，需要重新snapshot探查页面结构\n\n## 实测验证的选择器（2026-07-17）\n\n| 元素 | 选择器 | 状态 |\n|------|--------|------|\n| 标题输入框 | `[placeholder*=\"标题\"]` | ✅ 有效，元素类型为 `TEXTAREA`（placeholder: \"请输入文章标题（2～30个字）\"） |\n| 正文编辑器 | `.ProseMirror` 或 `[contenteditable=true]` | ✅ 有效（DIV 元素，contenteditable） |\n| 自动保存提示 | `.footer-draft-save` 或 `.footer-tip-save` | ✅ 有效（显示\"草稿已保存\"） |\n| 底部按钮区 | `.publish-footer` | ✅ 有效（含预览、定时发布、预览并发布） |\n| 无封面选项 | 页面中含\"无封面\"文本的元素 | ✅ 有效（默认无图发布时选择） |\n\n## 错误处理\n\n| 错误情况 | 处理方式 |\n|---------|---------|\n| 页面跳转到登录页 | 提醒用户登录头条号后重试 |\n| 标题输入框未找到 | snapshot探查页面，更新选择器 |\n| \"Illegal invocation\" 错误 | 标题是 textarea，需用 `HTMLTextAreaElement.prototype` 而非 `HTMLInputElement.prototype` |\n| 编辑器未找到 | 尝试 `.ProseMirror` 或 `[contenteditable=true]` |\n| 草稿未自动保存 | 等待更长时间（5秒），或检查网络连接 |\n| 内容粘贴失败 | 确认编辑器已 focus，重试 ClipboardEvent 粘贴 |\n\n## 输出报告格式\n\n发布完成后向用户报告：\n```\n头条号发布完成\n- 总计：N篇文章\n- 成功：M篇\n- 失败：K篇（列出失败的文章标题）\n- 全部已自动保存为草稿\n- 查看草稿：访问 https://mp.toutiao.com/profile_v4/graphic/publish ，页面右侧显示草稿列表\n```\n"}, {"slug": "xhs-batch-upload", "name": "SKILL.txt", "title": "小红书批量图文上传", "desc": "批量上传本地目录下的图片到小红书图文草稿箱。通过浏览器自动化操作，将指定目录中每个子文件夹的图片按顺序上传为小红书图文笔记，自动填写标题和正文，保存为草稿。适用于多篇文章批量发布到小红书的场景。", "file": "skills-doc/xhs-batch-upload/SKILL.txt", "raw": "---\nname: xhs-batch-upload\ndescription: \"批量上传本地目录下的图片到小红书图文草稿箱。通过浏览器自动化操作，将指定目录中每个子文件夹的图片按顺序上传为小红书图文笔记，自动填写标题和正文，保存为草稿。适用于多篇文章批量发布到小红书的场景。\"\n---\n\n# 小红书批量图文上传\n\n## 功能概述\n\n将本地某个目录下的多个子文件夹（每个子文件夹代表一篇文章）中的图片，批量上传到小红书创作者中心的图文草稿箱。\n\n## 触发条件\n\n当用户需要将本地图片批量上传到小红书时调用此skill。典型场景：\n- 用户说\"上传图片到小红书\"\n- 用户说\"把xxx目录的文章发到小红书\"\n- 用户说\"批量上传小红书图文\"\n\n## 前置条件\n\n1. **已登录小红书**：用户需在浏览器中已登录小红书创作者中心 (creator.xiaohongshu.com)\n2. **图片目录结构**：指定目录下有多个子文件夹，每个子文件夹内含按顺序编号的图片文件（如 01.png, 02.png, ...），代表一篇文章的页面（封面→内容页→尾页）\n3. **本地文件服务器**：需要启动一个本地HTTP服务器来提供图片URL（小红书网页端只接受URL上传，不支持直接读取本地文件路径）\n\n## 核心流程\n\n### 第一步：启动本地文件服务器\n\n在临时工作目录创建一个Python文件服务器脚本，将图片根目录暴露为HTTP服务：\n\n```python\n# file_server.py - 放在临时工作目录\nimport http.server, os, sys\n\nPORT = 18888\nDIRECTORY = sys.argv[1]  # 图片根目录路径\n\nclass Handler(http.server.SimpleHTTPRequestHandler):\n    def __init__(self, *args, **kwargs):\n        super().__init__(*args, directory=DIRECTORY, **kwargs)\n\nhttpd = http.server.HTTPServer((\"127.0.0.1\", PORT), Handler)\nprint(f\"Serving {DIRECTORY} on port {PORT}\")\nhttpd.serve_forever()\n```\n\n运行方式（在临时工作目录中执行）：\n```bash\npython file_server.py \"D:\\图片根目录路径\"\n```\n\n**注意**：此命令需以 `blocking: false` 方式运行（长驻进程），完成后需要手动终止。\n\n### 第二步：扫描目录结构\n\n读取指定目录下的所有子文件夹，每个子文件夹代表一篇文章：\n- 子文件夹名 = 文章标题（需去除emoji字符）\n- 子文件夹内的图片按文件名排序 = 文章页面顺序\n\n### 第三步：逐篇文章上传\n\n对每个子文件夹执行以下操作（使用integrated_browser的MCP工具）：\n\n#### 3.1 导航到发布页并切换到图文tab\n\n```\nURL: https://creator.xiaohongshu.com/publish/publish\n```\n\n**重要**：页面默认显示\"上传视频\"tab，需要切换到\"上传图文\"tab：\n\n```javascript\n// 在browser_evaluate中执行\nconst tabs = document.querySelectorAll('.creator-tab');\nfor (const t of tabs) {\n  if (t.textContent.includes('上传图文')) { t.click(); break; }\n}\nreturn 'switched to 上传图文';\n```\n\n等待2秒让页面加载完成。\n\n#### 3.2 上传图片（关键步骤 - 使用evaluate减少token消耗）\n\n小红书图片上传有两种方式，优先使用方式A：\n\n**方式A：通过input[type=file]直接设置文件（推荐，但浏览器MCP可能不支持）**\n\n```javascript\n// 在evaluate中执行\nconst fileInput = document.querySelector('input[type=file]');\n// 注意：由于安全限制，通常无法直接设置input.files\n// 需要使用DataTransfer API\nconst dt = new DataTransfer();\n// 此方式在大多数浏览器中受限，建议使用方式B\n```\n\n**方式B：通过本地URL上传（可靠方案）**\n\n1. 对每张图片，构造本地URL：`http://127.0.0.1:18888/子文件夹名/图片文件名`\n2. 使用fetch获取图片为Blob\n3. 通过DataTransfer API构造File对象\n4. 设置到input[type=file]元素上并触发change事件\n\n```javascript\n// 单张图片上传的核心JS（在browser_evaluate中执行）\nasync function uploadImage(imageUrl) {\n  const response = await fetch(imageUrl);\n  const blob = await response.blob();\n  const fileName = imageUrl.split('/').pop();\n  const file = new File([blob], fileName, { type: blob.type });\n  \n  const fileInput = document.querySelector('input[type=file]');\n  const dt = new DataTransfer();\n  dt.items.add(file);\n  fileInput.files = dt.files;\n  fileInput.dispatchEvent(new Event('change', { bubbles: true }));\n  return 'uploaded: ' + fileName;\n}\n```\n\n**方式C：逐张上传（最可靠，但token消耗较多）**\n\n如果方式B在evaluate中受限，则：\n1. 使用 `browser_snapshot` 获取图片上传input的ref\n2. 逐张图片使用 `browser_evaluate` 执行fetch+DataTransfer上传\n3. 每张上传后等待2秒让页面处理\n4. 使用 `browser_snapshot` 确认上传成功\n\n#### 3.3 填写标题\n\n标题 = 子文件夹名（去除emoji和特殊字符），限制在20字以内。\n\n```javascript\n// 在browser_evaluate中执行\nconst titleInput = document.querySelector('#title-textarea') || \n                   document.querySelector('[placeholder*=\"标题\"]');\n// 设置值并触发React/Vue响应\nconst nativeInputValueSetter = Object.getOwnPropertyDescriptor(\n  window.HTMLInputElement.prototype, 'value'\n).set;\nnativeInputValueSetter.call(titleInput, '文章标题');\ntitleInput.dispatchEvent(new Event('input', { bubbles: true }));\n```\n\n**注意**：小红书标题限制20字，如果文件夹名过长需截断。\n\n#### 3.4 填写正文\n\n正文格式：\n```\n{标题}\n\n{引导语}\n\n#公众号运营 #软文写作 #内容营销\n```\n\n默认引导语：`这篇图文详细分享了实操经验，希望对你有帮助～`\n\n```javascript\n// 在browser_evaluate中执行\nconst descInput = document.querySelector('#post-textarea') || \n                  document.querySelector('[placeholder*=\"描述\"]') ||\n                  document.querySelector('.content-input');\nconst nativeInputValueSetter = Object.getOwnPropertyDescriptor(\n  window.HTMLTextAreaElement.prototype, 'value'\n).set;\nnativeInputValueSetter.call(descInput, fullText);\ndescInput.dispatchEvent(new Event('input', { bubbles: true }));\n```\n\n#### 3.5 保存为草稿\n\n**重要**：新版小红书没有\"暂存离开\"按钮。点击\"发布笔记\"按钮会将内容保存到草稿箱（不会直接发布）。\n\n```javascript\n// 在browser_evaluate中执行 - 触发完整鼠标事件序列点击发布按钮\nconst btnInner = document.querySelector('.btn-inner');\nif (btnInner) {\n  const events = ['mousedown', 'mouseup', 'click'];\n  for (const ev of events) {\n    btnInner.dispatchEvent(new MouseEvent(ev, {bubbles: true, cancelable: true, view: window}));\n  }\n  return 'publish button clicked (saves to draft)';\n}\nreturn 'no publish button found';\n```\n\n点击后等待5秒，确认页面URL发生变化（跳转回发布首页），且侧边栏显示\"草稿箱(N+1)\"即表示保存成功。\n\n#### 3.6 单篇上传完成后的处理\n\n- 使用 `browser_snapshot` 确认已保存成功（页面应跳转回发布管理页或显示成功提示）\n- 继续下一篇\n\n### 第四步：清理\n\n1. 终止本地文件服务器进程\n2. 解锁浏览器（`browser_unlock`）\n3. 向用户报告上传结果\n\n## Token优化策略（核心）\n\n1. **合并evaluate调用**：将上传图片、填写标题、填写正文合并到一个evaluate脚本中执行，而非分步调用\n2. **减少snapshot次数**：只在关键节点（页面加载后、上传完成后、保存后）做snapshot，中间步骤用evaluate返回值判断状态\n3. **批量图片上传**：在单个evaluate中循环上传所有图片，而非逐张调用\n4. **避免重复探索DOM**：将选择器固化在此skill中，不需要每次都snapshot探索\n\n### 单篇文章的完整evaluate脚本模板\n\n```javascript\n// === 在browser_evaluate中一次性执行 ===\n// 1. 上传所有图片\nconst folderName = '文章文件夹名';\nconst imageFiles = ['01.png', '02.png', '03.png']; // 从目录扫描获得\nconst baseUrl = 'http://127.0.0.1:18888';\n\nasync function uploadAll() {\n  for (const img of imageFiles) {\n    const url = `${baseUrl}/${encodeURIComponent(folderName)}/${img}`;\n    const resp = await fetch(url);\n    const blob = await resp.blob();\n    const file = new File([blob], img, { type: blob.type });\n    const input = document.querySelector('input[type=file]');\n    const dt = new DataTransfer();\n    dt.items.add(file);\n    input.files = dt.files;\n    input.dispatchEvent(new Event('change', { bubbles: true }));\n    await new Promise(r => setTimeout(r, 2000)); // 等待上传处理\n  }\n  return 'all images uploaded';\n}\n\nawait uploadAll();\n\n// 2. 填写标题和正文\nawait new Promise(r => setTimeout(r, 1000));\nconst title = '清理后的标题';\nconst content = title + '\\n\\n这篇图文详细分享了实操经验，希望对你有帮助～\\n\\n#公众号运营 #软文写作 #内容营销';\n\nconst titleEl = document.querySelector('#title-textarea') || document.querySelector('[placeholder*=\"标题\"]');\nconst descEl = document.querySelector('#post-textarea') || document.querySelector('[placeholder*=\"描述\"]');\n\nif (titleEl) {\n  const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;\n  setter.call(titleEl, title);\n  titleEl.dispatchEvent(new Event('input', { bubbles: true }));\n}\nif (descEl) {\n  const setter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;\n  setter.call(descEl, content);\n  descEl.dispatchEvent(new Event('input', { bubbles: true }));\n}\n\n// 3. 等待并保存草稿（新版小红书点击\"发布笔记\"会保存到草稿箱）\nawait new Promise(r => setTimeout(r, 2000));\nconst btnInner = document.querySelector('.btn-inner');\nif (btnInner) {\n  const events = ['mousedown', 'mouseup', 'click'];\n  for (const ev of events) {\n    btnInner.dispatchEvent(new MouseEvent(ev, {bubbles: true, cancelable: true, view: window}));\n  }\n  return 'article uploaded + saved to draft';\n}\nreturn 'uploaded but no publish button found';\n```\n\n## 重要注意事项\n\n1. **上传间隔**：每张图片上传后等待2秒，避免上传过快导致失败\n2. **保存等待**：点击暂存后等待3秒再确认，确保数据保存成功\n3. **错误处理**：如果某篇文章上传失败，记录错误并继续下一篇，不要中断整个流程\n4. **emoji清理**：文件夹名可能含emoji字符，需用正则去除：`name.replace(/[\\u{1F000}-\\u{1FFFF}]|[\\u{2600}-\\u{27BF}]/gu, '').trim()`\n5. **标题长度**：小红书标题限制20字，超长需截断\n6. **图片格式**：支持png/jpg/jpeg/webp，按文件名自然排序\n7. **文件服务器端口**：默认使用18888，如被占用可更换\n\n## 输出报告格式\n\n上传完成后向用户报告：\n```\n小红书批量上传完成 ✅\n- 总计：N篇文章\n- 成功：M篇\n- 失败：K篇（列出失败的文件夹名）\n- 全部已保存为草稿，请在小红书创作者中心草稿箱中查看\n```\n"}, {"slug": "xhs-poster", "name": "SKILL.txt", "title": "小红书排版图片生成", "desc": "将Markdown内容转换为小红书风格排版图片并下载。通过浏览器自动化，在poster.html页面输入Markdown，自动生成封面/内容/尾页图片，打包ZIP下载到指定目录。适用于将文章内容生成小红书图文笔记图片的场景。", "file": "skills-doc/xhs-poster/SKILL.txt", "raw": "---\nname: xhs-poster\ndescription: \"将Markdown内容转换为小红书风格排版图片并下载。通过浏览器自动化，在poster.html页面输入Markdown，自动生成封面/内容/尾页图片，打包ZIP下载到指定目录。适用于将文章内容生成小红书图文笔记图片的场景。\"\n---\n\n# 小红书排版图片生成\n\n## 功能概述\n\n将Markdown格式的内容转换为小红书风格的排版图片（封面、内容页、尾页），打包为ZIP文件下载到指定目录。使用 html2canvas 截图，生成 2160×2880 高清PNG图片。\n\n## 触发条件\n\n当用户需要将内容生成小红书风格图片时调用此skill。典型场景：\n- 用户说\"生成小红书图片\"\n- 用户说\"把这篇文章做成小红书图文\"\n- 用户说\"生成小红书排版图片\"\n- 用户说\"转换为小红书海报\"\n\n## 前置条件\n\n1. **网络访问**：需要能访问 `https://shengmingzhishu.github.io/tools/xiaohongshu/poster.html`\n2. **Markdown内容**：需要转换为图片的Markdown格式内容\n3. **下载目录**：浏览器默认下载目录可用（通常为 `C:\\Users\\用户名\\Downloads`）\n\n## Markdown格式规范\n\nposter.html 页面对Markdown有特殊的解析规则：\n\n```\n首行 = 封面大标题\n第二行 = 封面副标题\n--- = 分隔符（分隔封面和内容页，也分隔多个内容页）\n最后一行 = 尾页文案\n\n支持以下Markdown语法：\n# 标题 / ## 标题 / ### 标题\n**加粗文本**\n> 引用块\n- 列表项\n1. 有序列表\n`代码` / ```代码块```\n```\n\n**示例Markdown：**\n```markdown\n文章标题\n\n副标题或引导语\n\n---\n\n### 第一部分标题\n\n正文内容...\n\n**重点加粗内容**\n\n> 金句引用\n\n- 要点一\n- 要点二\n- 要点三\n\n---\n\n### 第二部分标题\n\n更多内容...\n\n---\n\n关注我，获取更多干货 ✨\n```\n\n## 核心流程\n\n### 第一步：导航到海报生成页面\n\n```\nURL: https://shengmingzhishu.github.io/tools/xiaohongshu/poster.html\n```\n\n等待页面加载完成，通过 `browser_snapshot` 确认页面已出现。\n\n### 第二步：设置作者名（可选）\n\n作者名用于生成文件名前缀。默认值是\"北屿的蓝色\"，建议修改为文章相关名称。\n\n```javascript\n// 在browser_evaluate中执行\nconst authInput = document.getElementById('auth');\nif (authInput) {\n  const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;\n  setter.call(authInput, '作者名或文章名');\n  authInput.dispatchEvent(new Event('input', { bubbles: true }));\n  return 'auth set: ' + authInput.value;\n}\nreturn 'auth input not found';\n```\n\n### 第三步：输入Markdown内容（核心步骤）\n\n将Markdown内容输入到页面的文本框（id为 `mi`）。\n\n```javascript\n// 在browser_evaluate中执行\nconst md = `文章标题\n\n副标题\n\n---\n\n### 内容标题\n\n正文内容...\n\n---\n\n关注我 ✨`;\n\nconst textarea = document.getElementById('mi');\nif (textarea) {\n  const setter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;\n  setter.call(textarea, md);\n  textarea.dispatchEvent(new Event('input', { bubbles: true }));\n  textarea.dispatchEvent(new Event('change', { bubbles: true }));\n  return 'markdown input set, length: ' + textarea.value.length;\n}\nreturn 'textarea not found';\n```\n\n### 第四步：等待预览渲染\n\n输入Markdown后，页面右侧会实时渲染预览。每张卡片是一个 class 为 `swp` 的元素。\n\n```javascript\n// 在browser_evaluate中执行 - 检查预览卡片数量\nawait new Promise(r => setTimeout(r, 2000));\nconst cards = document.querySelectorAll('.swp');\nreturn JSON.stringify({\n  cardCount: cards.length,\n  authValue: document.getElementById('auth') ? document.getElementById('auth').value : 'n/a'\n});\n```\n\n### 第五步：点击导出按钮\n\n点击\"一键导出\"按钮（id为 `dlBtn`），页面会使用 html2canvas 逐张截图，打包成ZIP下载。\n\n```javascript\n// 在browser_evaluate中执行\nconst btn = document.getElementById('dlBtn');\nif (btn) {\n  btn.click();\n  return 'export button clicked';\n}\nreturn 'export button not found';\n```\n\n### 第六步：等待下载完成\n\nhtml2canvas 截图需要时间，每张卡片约2-3秒。3张卡片约需10秒。\n\n```javascript\n// 在browser_evaluate中执行 - 检查导出状态\n// dlBusy 是页面全局变量，true表示正在导出\nconst busy = typeof dlBusy !== 'undefined' ? dlBusy : 'unknown';\nconst btn = document.getElementById('dlBtn');\nreturn JSON.stringify({\n  dlBusy: busy,\n  btnDisabled: btn ? btn.disabled : 'n/a',\n  btnText: btn ? btn.textContent.trim().substring(0, 30) : 'n/a'\n});\n```\n\n当 `dlBusy` 为 `false` 且按钮恢复原文本时，表示导出完成。\n\n### 第七步：查找并解压ZIP文件\n\nZIP文件会下载到浏览器默认下载目录（Windows: `C:\\Users\\用户名\\Downloads`）。\n\n文件名格式：`时间戳_标题.zip`（如 `20260717_021127_认知觉醒读书笔记.zip`）\n\n使用 PowerShell 查找并解压到指定目录：\n\n```powershell\n# 查找最近5分钟内下载的ZIP文件\n$zipFile = Get-ChildItem -Path \"$env:USERPROFILE\\Downloads\" -Filter \"*.zip\" |\n  Where-Object { $_.LastWriteTime -gt (Get-Date).AddMinutes(-5) } |\n  Sort-Object LastWriteTime -Descending |\n  Select-Object -First 1\n\nif ($zipFile) {\n  $destPath = \"d:\\目标目录\"\n  if (!(Test-Path $destPath)) { New-Item -ItemType Directory -Path $destPath -Force }\n  Expand-Archive -Path $zipFile.FullName -DestinationPath $destPath -Force\n  Write-Output \"解压完成: $destPath\"\n  Get-ChildItem -Path $destPath | Select-Object Name, Length\n}\n```\n\n## Token优化策略\n\n### 单次生成完整脚本模板\n\n将作者名设置、Markdown输入、预览检查合并到一个evaluate中执行：\n\n```javascript\n// === 在browser_evaluate中一次性执行 ===\nconst authorName = '文章名';\nconst md = `文章标题\n\n副标题\n\n---\n\n### 内容标题\n\n正文内容...\n\n---\n\n关注我 ✨`;\n\n// 1. 设置作者名\nconst authInput = document.getElementById('auth');\nif (authInput) {\n  const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;\n  setter.call(authInput, authorName);\n  authInput.dispatchEvent(new Event('input', { bubbles: true }));\n}\n\n// 2. 输入Markdown\nawait new Promise(r => setTimeout(r, 300));\nconst textarea = document.getElementById('mi');\nif (textarea) {\n  const setter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;\n  setter.call(textarea, md);\n  textarea.dispatchEvent(new Event('input', { bubbles: true }));\n}\n\n// 3. 等待预览渲染\nawait new Promise(r => setTimeout(r, 2000));\nconst cards = document.querySelectorAll('.swp');\n\n// 4. 点击导出按钮\nconst btn = document.getElementById('dlBtn');\nif (btn) btn.click();\n\nreturn JSON.stringify({\n  authSet: authInput ? authInput.value : 'n/a',\n  mdLength: textarea ? textarea.value.length : 0,\n  cardCount: cards.length,\n  exportClicked: !!btn\n});\n```\n\n执行后等待10秒，然后用PowerShell查找并解压ZIP文件。\n\n### 完整生成流程（从内容到图片）\n\n1. 导航到 `https://shengmingzhishu.github.io/tools/xiaohongshu/poster.html`\n2. 等待页面加载\n3. 执行evaluate：设置作者名 + 输入Markdown + 等待渲染 + 点击导出\n4. 等待10秒让html2canvas截图并打包ZIP\n5. 检查 `dlBusy` 是否为 `false`（确认导出完成）\n6. 用PowerShell在下载目录查找ZIP文件（按时间过滤）\n7. 解压ZIP到指定目录\n8. 验证生成的PNG图片（检查文件大小和图片尺寸）\n9. 解锁浏览器，向用户报告结果\n\n## 批量生成流程\n\n如果需要为多篇文章生成小红书图片：\n\n1. 准备多篇文章的Markdown内容\n2. 对每篇文章执行上述完整生成流程\n3. 每篇之间等待15秒（确保前一篇的ZIP下载完成）\n4. 每篇解压到不同的子目录\n5. 记录每篇的生成结果，最后统一报告\n\n### 批量生成脚本结构\n\n```\n对每篇文章：\n  → 导航到 poster.html（或复用同一页面，清空重新输入）\n  → 等待2秒页面加载\n  → evaluate: 设置作者名 + 输入Markdown + 等待渲染 + 点击导出\n  → 等待10秒下载完成\n  → PowerShell: 查找最新ZIP并解压到指定子目录\n  → 验证图片\n  → 记录结果\n  → 继续下一篇\n```\n\n## 输出文件结构\n\nZIP文件解压后包含以下文件：\n\n| 文件 | 说明 |\n|------|------|\n| `{作者名}_001_封面.png` | 封面图片（2160×2880） |\n| `{作者名}_002_内容.png` | 内容页图片（2160×2880） |\n| `{作者名}_003_尾页.png` | 尾页图片（2160×2880） |\n| `{作者名}_source_时间戳.md` | Markdown源文件 |\n| `README.txt` | 说明文件 |\n\n**注意**：内容页数量取决于Markdown内容长度和 `---` 分隔符，可能有多张内容页。\n\n## 实测验证的页面元素（2026-07-17）\n\n| 元素 | 选择器 | 状态 |\n|------|--------|------|\n| Markdown输入框 | `#mi` 或 `textarea` | ✅ 有效（TEXTAREA元素） |\n| 作者名输入框 | `#auth` | ✅ 有效（INPUT元素） |\n| 导出按钮 | `#dlBtn` 或 `.dlb` | ✅ 有效（onclick=\"dlA()\"） |\n| 预览卡片 | `.swp` | ✅ 有效（每张代表一页） |\n| 导出状态变量 | `dlBusy`（全局变量） | ✅ 有效（true=导出中，false=完成） |\n| 场景元素 | `.scene`（卡片内） | ✅ 有效（缩放容器） |\n\n## 页面技术栈\n\n- **html2canvas 1.4.1**：用于将DOM元素截图为Canvas\n- **JSZip 3.10.1**：用于将多张图片打包为ZIP\n- 截图参数：`scale:2`（2倍清晰度），`allowTaint:true`，`backgroundColor:null`\n- 截图尺寸：每张卡片临时展开为 1080×1440，截图后为 2160×2880\n\n## 重要注意事项\n\n1. **下载目录**：ZIP文件默认下载到浏览器下载目录（`C:\\Users\\用户名\\Downloads`），需用PowerShell查找并移动\n2. **导出时间**：每张卡片截图约2-3秒，3张卡片约需10秒，多张内容页需更长时间\n3. **文件名**：ZIP文件名格式为 `时间戳_标题.zip`，标题取自Markdown首行\n4. **图片尺寸**：所有图片都是 2160×2880 像素（小红书标准尺寸1080×1440的2倍高清）\n5. **Markdown格式**：首行是封面标题，第二行是副标题，`---`分隔页面，最后一行是尾页\n6. **作者名用途**：作者名作为ZIP内文件名前缀，建议设为文章相关名称\n7. **页面复用**：可以在同一页面中多次输入不同内容并导出，无需每次重新导航\n8. **字体加载**：页面首次加载时字体可能需要时间渲染，建议等待2秒再截图\n9. **内容长度**：内容过长会自动分页，生成多张内容页图片\n10. **网络依赖**：页面依赖CDN加载html2canvas和JSZip，需确保网络畅通\n\n## 错误处理\n\n| 错误情况 | 处理方式 |\n|---------|---------|\n| 页面加载失败 | 检查网络连接，重新导航 |\n| 文本框未找到 | 确认页面已完全加载，用 `#mi` 选择器 |\n| 预览卡片为0 | 检查Markdown格式是否正确，确认 `---` 分隔符 |\n| 导出按钮未响应 | 检查 `dlBusy` 是否为 true（正在导出中） |\n| ZIP文件未下载 | 等待更长时间（15秒），检查浏览器下载设置 |\n| ZIP文件未找到 | 扩大搜索时间范围，检查下载目录路径 |\n| 图片尺寸为0 | 检查html2canvas是否成功截图，查看浏览器控制台错误 |\n| 字体显示异常 | 等待页面字体加载完成再导出 |\n\n## 验证图片可用性\n\n使用PowerShell验证生成的PNG图片：\n\n```powershell\nAdd-Type -AssemblyName System.Drawing\n$files = Get-ChildItem \"目标目录\\*.png\"\nforeach ($f in $files) {\n  $img = [System.Drawing.Image]::FromFile($f.FullName)\n  Write-Output \"$($f.Name) - Size: $($img.Width)x$($img.Height)\"\n  $img.Dispose()\n}\n```\n\n正常图片应为 2160×2880 像素，PNG格式。\n\n## 输出报告格式\n\n生成完成后向用户报告：\n```\n小红书排版图片生成完成\n- 文章标题：XXX\n- 生成图片：N张（封面1张 + 内容X张 + 尾页1张）\n- 图片尺寸：2160×2880（高清）\n- 保存目录：d:\\目标目录\n- 文件列表：\n  - XXX_001_封面.png (2.7MB)\n  - XXX_002_内容.png (528KB)\n  - XXX_003_尾页.png (617KB)\n```\n"}, {"slug": "zhihu-publish", "name": "SKILL.txt", "title": "知乎文章发布", "desc": "将Markdown文章发布到知乎专栏。通过浏览器自动化，自动填写标题、粘贴正文（保留格式）、选择创作声明并发布。适用于将本地Markdown文章发布到知乎的场景。", "file": "skills-doc/zhihu-publish/SKILL.txt", "raw": "---\nname: zhihu-publish\ndescription: \"将Markdown文章发布到知乎专栏。通过浏览器自动化，自动填写标题、粘贴正文（保留格式）、选择创作声明并发布。适用于将本地Markdown文章发布到知乎的场景。\"\n---\n\n# 知乎文章发布\n\n## 功能概述\n\n将Markdown格式的文章自动发布到知乎专栏（zhuanlan.zhihu.com）。自动完成：标题填写、正文粘贴（保留格式）、创作声明选择、发布文章。\n\n## 触发条件\n\n当用户需要将文章发布到知乎时调用此skill。典型场景：\n- 用户说\"发到知乎\"\n- 用户说\"上传到知乎\"\n- 用户说\"把这篇文章发知乎\"\n\n## 前置条件\n\n1. **已登录知乎**：用户需在浏览器中已登录知乎 (zhihu.com)\n2. **文章内容**：Markdown格式的文章内容（可从本地文件读取或直接提供）\n3. **排版工具（可选）**：如需保留Markdown格式转换为HTML，可使用排版工具 `https://shengmingzhishu.github.io/tools/wechat/editor-v1.html` 的 `mdToHtml()` 函数\n\n## 核心流程\n\n### 第零步：内容准备规范\n\n在发布文章前，需要对 Markdown 内容做以下处理：\n\n1. **首句加粗**：文章正文的第一句话必须用 `**...**` 包裹加粗，让文章开篇更有冲击力。例如：\n   - 原文：`\"一万小时定律\"你一定听过`\n   - 处理后：`**\"一万小时定律\"你一定听过**`\n\n2. **图片处理**：\n   - **默认无图发布**：知乎文章可以不配图直接发布\n   - **固定配图（可选）**：如需配图，可通过 HTML `<img>` 标签插入正文\n\n3. **标题截断**：知乎标题建议100字以内\n\n### 第一步：导航到知乎写作页\n\n```\nURL: https://zhuanlan.zhihu.com/write\n```\n\n等待页面加载完成，通过 `browser_snapshot` 确认标题输入框和正文编辑器已出现。\n\n**如果页面跳转到登录页**，说明未登录，需要提醒用户先登录知乎。\n\n### 第二步：填写标题\n\n知乎的标题输入框是一个 **textarea** 元素（实测验证），placeholder 为\"请输入标题（最多 100 个字）\"。\n\n```javascript\n// 在browser_evaluate中执行\n// 查找标题输入框（实测为 TEXTAREA 元素，不是 input）\nconst titleInput = document.querySelector('textarea[placeholder*=\"标题\"]');\n\nif (titleInput) {\n  // 标题是 textarea，必须用 HTMLTextAreaElement.prototype\n  const nativeSetter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;\n  nativeSetter.call(titleInput, '文章标题');\n  titleInput.dispatchEvent(new Event('input', { bubbles: true }));\n  titleInput.dispatchEvent(new Event('change', { bubbles: true }));\n  return 'title set: ' + titleInput.value;\n}\nreturn 'title input not found';\n```\n\n**注意**：\n- 标题是 `TEXTAREA` 元素，必须用 `HTMLTextAreaElement.prototype` 的 setter，用 `HTMLInputElement.prototype` 会报 \"Illegal invocation\" 错误\n- 选择器必须用 `textarea[placeholder*=\"标题\"]`，不能用 `input[placeholder*=\"标题\"]`（后者匹配不到）\n- 知乎标题限制 100 字以内\n\n### 第三步：填写正文\n\n知乎使用 Draft.js 编辑器（`contenteditable` 元素），通过 ClipboardEvent 注入 HTML：\n\n```javascript\n// 在browser_evaluate中执行\n// 查找正文编辑器 - 知乎使用 Draft.js\nconst editor = document.querySelector('.public-DraftEditor-content') ||\n               document.querySelector('[contenteditable=true]');\n\nif (!editor) return 'editor not found';\n\neditor.focus();\n\n// 构造HTML内容\nconst html = '<p>正文段落1<\/p><h3>小标题<\/h3><p>正文段落2<\/p>';\n\n// 通过ClipboardEvent注入HTML\nconst clipboardData = new DataTransfer();\nclipboardData.setData('text/html', html);\nclipboardData.setData('text/plain', html.replace(/<[^>]*>/g, ''));\nconst pasteEvent = new ClipboardEvent('paste', {\n  bubbles: true,\n  cancelable: true,\n  clipboardData: clipboardData\n});\neditor.dispatchEvent(pasteEvent);\nreturn 'content pasted via ClipboardEvent';\n```\n\n**注意**：知乎编辑器可能对某些HTML标签有过滤，但表格、引用块、标题、列表、粗体等基本格式都能保留。\n\n### 第四步：创作声明（默认无声明，可直接发布）\n\n知乎发布页底部有创作声明选项，默认为\"无声明\"。**实测验证：无需手动选择创作声明，可直接点击发布按钮发布。**\n\n页面底部按钮区域包含：无声明、添加话题、添加来源、预览、发布。\n\n如果需要选择\"原创\"声明：\n\n```javascript\n// 在browser_evaluate中执行（可选步骤）\n// 查找\"无声明\"按钮并点击展开选项\nconst noDeclareBtn = Array.from(document.querySelectorAll('button'))\n  .find(btn => btn.textContent.trim() === '无声明');\nif (noDeclareBtn) {\n  noDeclareBtn.click();\n  await new Promise(r => setTimeout(r, 500));\n  // 选择\"原创\"\n  const originalOption = Array.from(document.querySelectorAll('[role=option], [role=menuitem], li, button'))\n    .find(el => el.textContent.trim().includes('原创'));\n  if (originalOption) {\n    originalOption.click();\n    return 'declaration set to 原创';\n  }\n}\nreturn 'declaration not changed (default: 无声明)';\n```\n\n**注意**：创作声明不是必选项，默认\"无声明\"即可直接发布。\n\n### 第五步：发布文章\n\n知乎的发布按钮在页面底部或右上角。\n\n```javascript\n// 在browser_evaluate中执行\n// 查找发布按钮\nconst publishBtn = Array.from(document.querySelectorAll('button'))\n  .find(btn => btn.textContent.trim() === '发布' || btn.textContent.includes('发布文章'));\n\nif (publishBtn) {\n  publishBtn.click();\n  return 'publish button clicked';\n}\n\n// 备用：查找 class 含 publish 的按钮\nconst btns = document.querySelectorAll('[class*=publish] button, [class*=Publish] button');\nif (btns.length > 0) {\n  btns[btns.length - 1].click();\n  return 'publish button clicked via class';\n}\nreturn 'no publish button found';\n```\n\n### 第六步：确认发布成功\n\n发布后页面应跳转到文章详情页（URL 含 `/p/` 编号）。\n\n```javascript\n// 检查URL是否跳转到文章页\nreturn JSON.stringify({\n  url: location.href,\n  isArticlePage: location.href.includes('/p/'),\n  title: document.title\n});\n```\n\n## Token优化策略\n\n### 单篇文章完整发布脚本模板\n\n将标题填写、正文粘贴合并到一个evaluate中执行：\n\n```javascript\n// === 在browser_evaluate中一次性执行 ===\nconst title = '文章标题';\nconst html = '<p><strong>首句加粗<\/strong>，正文内容...<\/p>';\n\n// 1. 填写标题（知乎标题是 TEXTAREA 元素）\nconst titleInput = document.querySelector('textarea[placeholder*=\"标题\"]');\nif (titleInput) {\n  const setter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;\n  setter.call(titleInput, title);\n  titleInput.dispatchEvent(new Event('input', { bubbles: true }));\n}\n\n// 2. 粘贴正文\nawait new Promise(r => setTimeout(r, 500));\nconst editor = document.querySelector('.public-DraftEditor-content') ||\n               document.querySelector('[contenteditable=true]');\nif (editor) {\n  editor.focus();\n  const cd = new DataTransfer();\n  cd.setData('text/html', html);\n  cd.setData('text/plain', html.replace(/<[^>]*>/g, ''));\n  editor.dispatchEvent(new ClipboardEvent('paste', {\n    bubbles: true, cancelable: true, clipboardData: cd\n  }));\n}\n\n// 3. 等待内容渲染，发布按钮激活\nawait new Promise(r => setTimeout(r, 1500));\n\n// 4. 滚动到底部\nwindow.scrollTo(0, document.body.scrollHeight);\nawait new Promise(r => setTimeout(r, 500));\n\n// 5. 点击发布按钮（创作声明默认\"无声明\"，可直接发布）\nconst publishBtn = Array.from(document.querySelectorAll('button'))\n  .find(btn => btn.textContent.trim() === '发布');\nif (publishBtn && !publishBtn.disabled) {\n  publishBtn.click();\n  return 'article published';\n}\nreturn 'article filled but publish button not ready (disabled: ' + (publishBtn ? publishBtn.disabled : 'not found') + ')';\n```\n\n## Markdown转HTML的方法\n\n### 方法一：使用排版工具（推荐）\n\n1. 在浏览器中打开排版工具：`https://shengmingzhishu.github.io/tools/wechat/editor-v1.html`\n2. 在排版工具标签页中执行evaluate，调用 `mdToHtml()` 函数：\n\n```javascript\n// 在排版工具标签页的browser_evaluate中执行\nconst textarea = document.querySelector('textarea');\ntextarea.value = markdownContent;\ntextarea.dispatchEvent(new Event('input', { bubbles: true }));\nconst html = mdToHtml(textarea.value);\nreturn html; // 返回HTML字符串\n```\n\n3. 获取到HTML后，在知乎标签页中通过ClipboardEvent粘贴\n\n### 方法二：简单转换\n\n如果不需要复杂格式，可以直接将Markdown转为简单HTML：\n\n```javascript\nfunction simpleMdToHtml(md) {\n  let html = md;\n  html = html.replace(/^### (.+)$/gm, '<h3>$1<\/h3>');\n  html = html.replace(/^## (.+)$/gm, '<h2>$1<\/h2>');\n  html = html.replace(/^# (.+)$/gm, '<h1>$1<\/h1>');\n  html = html.replace(/\\*\\*(.+?)\\*\\*/g, '<strong>$1<\/strong>');\n  html = html.replace(/^> (.+)$/gm, '<blockquote>$1<\/blockquote>');\n  html = html.replace(/^- (.+)$/gm, '<li>$1<\/li>');\n  html = html.replace(/(<li>.+<\\/li>\\n?)+/g, '<ul>$&<\/ul>');\n  html = html.split('\\n\\n').map(p => {\n    if (p.match(/^<(h|ul|ol|blockquote|table)/)) return p;\n    return '<p>' + p.replace(/\\n/g, '<br>') + '<\/p>';\n  }).join('');\n  return html;\n}\n```\n\n## 完整发布流程（从Markdown文件到发布）\n\n1. 读取本地Markdown文件内容\n2. **首句加粗处理**：将正文第一句用 `**...**` 包裹\n3. 打开排版工具标签页，将Markdown输入文本框，调用 `mdToHtml()` 获取HTML\n4. 打开知乎写作页 (`https://zhuanlan.zhihu.com/write`)\n5. 等待页面加载，确认标题输入框和编辑器已出现\n6. 执行完整evaluate脚本：填写标题 + 粘贴正文 + 等待按钮激活 + 发布\n7. 确认页面跳转到文章详情页（URL 含 `/p/`）\n8. 解锁浏览器，向用户报告结果\n\n## 批量发布流程\n\n如果需要发布多篇文章：\n\n1. 读取包含多篇文章的Markdown文件\n2. 按文章分隔符拆分为单篇文章\n3. 对每篇文章执行上述完整发布流程\n4. 每篇之间等待5秒，避免频繁操作\n5. 记录每篇的发布结果，最后统一报告\n\n### 批量发布脚本结构\n\n```\n对每篇文章：\n  → 导航到 https://zhuanlan.zhihu.com/write\n  → 等待2秒页面加载\n  → evaluate: 填写标题 + 粘贴正文 + 选择创作声明 + 发布\n  → 确认页面跳转到文章详情页\n  → 记录结果\n  → 继续下一篇\n```\n\n## 重要注意事项\n\n1. **登录状态**：知乎页面如果跳转到登录页，说明登录已过期，需要提醒用户重新登录\n2. **标题输入框类型**：知乎标题是 `TEXTAREA` 元素（与头条号相同），必须用 `HTMLTextAreaElement.prototype`，选择器用 `textarea[placeholder*=\"标题\"]`\n3. **标题长度**：知乎标题限制100字以内（placeholder: \"请输入标题（最多 100 个字）\"）\n4. **首句加粗**：文章正文第一句必须用 `**...**` 加粗，提升开篇冲击力\n5. **正文格式**：知乎支持HTML粘贴，表格、引用块、标题、列表、粗体等格式保留（实测验证）\n6. **编辑器类型**：知乎使用 Draft.js 编辑器（`.public-DraftEditor-content`），与头条号的 ProseMirror 不同\n7. **发布按钮激活**：发布按钮在标题和正文都填写后才会从 disabled 变为可点击，需要等待1.5秒\n8. **创作声明**：默认\"无声明\"，可直接发布，不需要手动选择\n9. **发布即公开**：与头条号（草稿）和小红书（草稿）不同，知乎点击\"发布\"后文章直接公开\n10. **发布频率**：批量发布时每篇间隔5秒以上，避免被平台限制\n11. **DOM变化**：知乎前端可能更新，如果选择器失效，需要重新snapshot探查页面结构\n\n## 实测验证的选择器（2026-07-17）\n\n| 元素 | 选择器 | 状态 |\n|------|--------|------|\n| 标题输入框 | `textarea[placeholder*=\"标题\"]` | ✅ 有效，元素类型为 `TEXTAREA`（placeholder: \"请输入标题（最多 100 个字）\"） |\n| 正文编辑器 | `.public-DraftEditor-content` 或 `[contenteditable=true]` | ✅ 有效（Draft.js 编辑器） |\n| 发布按钮 | `button` 文本为\"发布\" | ✅ 有效（标题+正文填写后激活） |\n| 创作声明 | `button` 文本为\"无声明\" | ✅ 有效（默认无声明，可直接发布） |\n| 底部按钮区 | 含\"无声明\"、\"添加话题\"、\"添加来源\"、\"预览\"、\"发布\" | ✅ 有效 |\n\n## 错误处理\n\n| 错误情况 | 处理方式 |\n|---------|---------|\n| 页面跳转到登录页 | 提醒用户登录知乎后重试 |\n| 标题输入框未找到 | 用 `textarea[placeholder*=\"标题\"]`（不是 input） |\n| \"Illegal invocation\" 错误 | 标题是 textarea，需用 `HTMLTextAreaElement.prototype` 而非 `HTMLInputElement.prototype` |\n| 编辑器未找到 | 尝试 `.public-DraftEditor-content` 或 `[contenteditable=true]` |\n| 内容粘贴失败 | 确认编辑器已 focus，重试 ClipboardEvent 粘贴 |\n| 发布按钮 disabled | 等待1.5秒让标题和正文渲染完成，按钮会自动激活 |\n| 发布后未跳转 | 等待更长时间，检查是否有错误提示或弹窗 |\n\n## 输出报告格式\n\n发布完成后向用户报告：\n```\n知乎发布完成\n- 总计：N篇文章\n- 成功：M篇\n- 失败：K篇（列出失败的文章标题）\n- 文章链接：https://zhuanlan.zhihu.com/p/XXXXXXX\n```\n"}]</script>
<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('skill-data').textContent);

  /* ---------- v11 思路:文件列表 + 内联内容映射 ---------- */
  var skillFiles = DATA.map(function(s){
    return {slug:s.slug, name:s.name, title:s.title, desc:s.desc, file:s.file};
  });
  var skillContent = {};
  DATA.forEach(function(s){ skillContent[s.slug] = s.raw; });

  /* ---------- 工具 ---------- */
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escAttr(s){
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function findSkill(slug){
    for(var i=0;i<skillFiles.length;i++){
      if(skillFiles[i].slug === slug) return skillFiles[i];
    }
    return null;
  }

  /* ---------- Markdown 渲染器(轻量,覆盖常见语法)----------
     行内元素先替换为 @@TOKEN@@ 哨兵,转义正文后再还原,
     避免代码/链接内部被二次处理。 */
  function inline(text){
    var codes=[], links=[], imgs=[];
    text = text.replace(/`+([^`]+?)`+/g, function(m,c){ codes.push(c); return '@@CODE'+(codes.length-1)+'@@'; });
    text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g, function(m,alt,url,t){
      imgs.push({alt:alt,url:url,t:t}); return '@@IMG'+(imgs.length-1)+'@@';
    });
    text = text.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g, function(m,txt,url,t){
      links.push({txt:txt,url:url,t:t}); return '@@LINK'+(links.length-1)+'@@';
    });
    text = esc(text);
    text = text.replace(/\*\*([^\n]+?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/__([^\n]+?)__/g, '<strong>$1</strong>');
    text = text.replace(/~~([^\n]+?)~~/g, '<del>$1</del>');
    text = text.replace(/(^|[^*])\*(?!\s)([^\n*]+?)\*(?!\*)/g, '$1<em>$2</em>');
    text = text.replace(/(^|[^_\w])_(?!\s)([^\n_]+?)_(?!_|\w)/g, '$1<em>$2</em>');
    text = text.replace(/@@LINK(\d+)@@/g, function(m,i){
      var L=links[+i];
      return '<a href="'+escAttr(L.url)+'"'+(L.t?' title="'+escAttr(L.t)+'"':'')+'>'+esc(L.txt)+'</a>';
    });
    text = text.replace(/@@IMG(\d+)@@/g, function(m,i){
      var I=imgs[+i];
      return '<img src="'+escAttr(I.url)+'" alt="'+escAttr(I.alt)+'"'+(I.t?' title="'+escAttr(I.t)+'"':'')+'>';
    });
    text = text.replace(/@@CODE(\d+)@@/g, function(m,i){
      return '<code>'+esc(codes[+i])+'</code>';
    });
    return text;
  }

  function splitRow(line){
    line = line.trim().replace(/^\|/,'').replace(/\|\s*$/,'');
    return line.split('|');
  }

  function renderMarkdown(md){
    if(!md) return '';
    // 去 BOM + frontmatter
    md = md.replace(/^﻿?---\s*\n[\s\S]*?\n---\s*\n/, '');
    // 提取 fenced code block 为哨兵占位。
    // 开闭围栏都必须在行首(常见 Markdown 规范),避免把行内的 ``` 当成围栏
    // 误切(否则会产生 "@@BLOCK0@@文字@@BLOCK1@@" 这种夹杂占位符的行,
    // 既不匹配纯占位符、又被段落守卫 !/^@@BLOCK/ 拒收,导致死循环)。
    var blocks=[];
    md = md.replace(/(^|\n)```([^\n`]*)\r?\n([\s\S]*?)\r?\n```(?=\r?\n|$)/g, function(m,pre,lang,code){
      blocks.push({lang:(lang||'').trim(), code:code.replace(/\n$/,'')});
      return pre+'@@BLOCK'+(blocks.length-1)+'@@';
    });

    var lines = md.split(/\r?\n/);
    var out=[];
    var i=0;
    while(i < lines.length){
      var line = lines[i];

      if(/^\s*$/.test(line)){ i++; continue; }

      // 代码块占位(单独一行)
      var bm = line.match(/^@@BLOCK(\d+)@@\s*$/);
      if(bm){
        var b = blocks[+bm[1]];
        out.push('<pre class="code-block"><code class="lang-'+escAttr(b.lang)+'">'+esc(b.code)+'</code></pre>');
        i++; continue;
      }

      // 标题
      var hm = line.match(/^(#{1,6})\s+(.*?)(?:\s*#+\s*)?$/);
      if(hm){
        var lv = hm[1].length;
        out.push('<h'+lv+'>'+inline(hm[2])+'</h'+lv+'>');
        i++; continue;
      }

      // 水平线
      if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)){ out.push('<hr>'); i++; continue; }

      // 引用块
      if(/^\s*>/.test(line)){
        var q=[];
        while(i<lines.length && /^\s*>/.test(lines[i])){
          q.push(lines[i].replace(/^\s*>?\s?/, ''));
          i++;
        }
        out.push('<blockquote>'+inline(q.join('\n').replace(/\n/g,'<br>'))+'</blockquote>');
        continue;
      }

      // 无序列表
      if(/^\s*[-*+]\s+/.test(line)){
        var it=[];
        while(i<lines.length && (/^\s*[-*+]\s+/.test(lines[i]) || (/^\s+\S/.test(lines[i]) && it.length))){
          if(/^\s*[-*+]\s+/.test(lines[i])){
            var c = lines[i].replace(/^\s*[-*+]\s+/, '');
            var tm = c.match(/^\[( |x|X)\]\s+(.*)$/);
            if(tm){
              it.push('<li class="task">'+(tm[1].toLowerCase()==='x'?'<input type="checkbox" checked disabled>':'<input type="checkbox" disabled>')+' '+inline(tm[2])+'</li>');
            } else {
              it.push('<li>'+inline(c)+'</li>');
            }
          } else {
            it[it.length-1] += ' ' + inline(lines[i].trim());
          }
          i++;
        }
        out.push('<ul>'+it.join('')+'</ul>');
        continue;
      }

      // 有序列表
      if(/^\s*\d+\.\s+/.test(line)){
        var ot=[];
        while(i<lines.length && (/^\s*\d+\.\s+/.test(lines[i]) || (/^\s+\S/.test(lines[i]) && ot.length))){
          if(/^\s*\d+\.\s+/.test(lines[i])){
            ot.push('<li>'+inline(lines[i].replace(/^\s*\d+\.\s+/, ''))+'</li>');
          } else {
            ot[ot.length-1] += ' ' + inline(lines[i].trim());
          }
          i++;
        }
        out.push('<ol>'+ot.join('')+'</ol>');
        continue;
      }

      // 表格
      if(/^\s*\|/.test(line) && i+1<lines.length && /^\s*\|[\s:|-]+\|?\s*$/.test(lines[i+1])){
        var hdr = splitRow(line);
        var al = splitRow(lines[i+1]).map(function(c){
          c = c.trim();
          if(/^:.*:$/.test(c)) return 'center';
          if(/:$/.test(c)) return 'right';
          if(/^:/.test(c)) return 'left';
          return '';
        });
        i += 2;
        var rows=[];
        while(i<lines.length && /^\s*\|/.test(lines[i])){
          rows.push(splitRow(lines[i]));
          i++;
        }
        var thead = '<thead><tr>'+hdr.map(function(c,idx){
          return '<th style="text-align:'+(al[idx]||'left')+'">'+inline(c.trim())+'</th>';
        }).join('')+'</tr></thead>';
        var tbody = '<tbody>'+rows.map(function(r){
          return '<tr>'+r.map(function(c,idx){
            return '<td style="text-align:'+(al[idx]||'left')+'">'+inline(c.trim())+'</td>';
          }).join('')+'</tr>';
        }).join('')+'</tbody>';
        out.push('<table>'+thead+tbody+'</table>');
        continue;
      }

      // 段落
      var para=[];
      while(i<lines.length && !/^\s*$/.test(lines[i])
        && !/^@@BLOCK/.test(lines[i])
        && !/^(#{1,6})\s/.test(lines[i])
        && !/^\s*>/.test(lines[i])
        && !/^\s*[-*+]\s+/.test(lines[i])
        && !/^\s*\d+\.\s+/.test(lines[i])
        && !/^\s*\|/.test(lines[i])
        && !/^\s*([-*_])(\s*\1){2,}\s*$/.test(lines[i])){
        para.push(lines[i]); i++;
      }
      if(para.length){
        out.push('<p>'+inline(para.join('\n').replace(/\n/g,'<br>'))+'</p>');
      } else {
        // 安全兜底:该行未被任何块匹配(例如夹杂在行内的 @@BLOCK 占位、孤立的 | 等),
        // 直接作为段落消费并前进,绝对避免死循环。
        out.push('<p>'+inline(lines[i])+'</p>');
        i++;
      }
    }
    return out.join('\n');
  }

  /* ---------- 内容加载:fetch 优先,内联回退 ---------- */
  function loadContent(s, cb){
    var inlineTxt = skillContent[s.slug] || '';
    // file:// 下 fetch 本地文件受跨域限制,直接用内联内容
    if(location.protocol === 'file:' || !window.fetch){
      cb(inlineTxt);
      return;
    }
    fetch(s.file, {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
      .then(function(txt){ cb(txt); })
      .catch(function(){ cb(inlineTxt); });
  }

  /* ---------- 列表渲染 ---------- */
  function renderList(filter){
    var list = document.getElementById('skill-list');
    var html = '';
    var shown = 0;
    skillFiles.forEach(function(s){
      if(filter){
        var hay = (s.title+' '+s.desc+' '+s.slug).toLowerCase();
        if(hay.indexOf(filter) === -1) return;
      }
      shown++;
      html += '<a class="card" href="#'+escAttr(s.slug)+'">'
        + '<div class="card-head"><span class="card-badge">SKILL</span>'
        + '<h2 class="card-title">'+esc(s.title)+'</h2></div>'
        + '<p class="card-desc">'+esc(s.desc)+'</p>'
        + '<div class="card-foot"><span class="card-file">📁 '+esc(s.file)+'</span>'
        + '<span class="card-go">查看详情 -></span></div>'
        + '</a>';
    });
    list.innerHTML = html;
    document.getElementById('empty').hidden = shown > 0;
    document.getElementById('count').textContent = shown + ' / ' + skillFiles.length;
  }

  /* ---------- 路由 ---------- */
  function showList(){
    document.getElementById('list-view').hidden = false;
    document.getElementById('detail-view').hidden = true;
    document.title = 'Skills 技能文档';
    window.scrollTo(0, 0);
  }
  function showDetail(s){
    document.getElementById('list-view').hidden = true;
    document.getElementById('detail-view').hidden = false;
    document.getElementById('detail-file').textContent = s.file;
    var rawLink = document.getElementById('raw-link');
    rawLink.href = s.file;
    rawLink.style.display = '';
    var box = document.getElementById('detail-content');
    box.innerHTML = '<div class="loading">加载中…</div>';
    document.title = s.title + ' - Skills';
    window.scrollTo(0, 0);
    loadContent(s, function(txt){
      box.innerHTML = renderMarkdown(txt);
    });
  }
  function route(){
    var hash = location.hash.slice(1);
    if(!hash){ showList(); return; }
    try { hash = decodeURIComponent(hash); } catch(e){}
    var s = findSkill(hash);
    if(s){ showDetail(s); return; }
    showList();
  }

  /* ---------- 事件 ---------- */
  window.addEventListener('hashchange', route);
  document.getElementById('search').addEventListener('input', function(){
    renderList(this.value.toLowerCase().trim());
  });
  document.getElementById('back-btn').addEventListener('click', function(e){
    e.preventDefault();
    if(location.hash){
      if(history.length > 1){ history.back(); }
      else { location.hash = ''; }
    }
  });

  renderList('');
  route();
})();
</script>
