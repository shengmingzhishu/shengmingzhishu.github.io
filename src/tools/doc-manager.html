<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>墨韵文档管理器 · 结构化设计文档</title>
  <link rel="stylesheet" href="../assets/css/core/theme.css">
  <link rel="stylesheet" href="../assets/css/pages/doc-manager.css">
</head>
<body>

  <!-- ========== 顶栏导航 ========== -->
  <nav class="page-nav">
    <a class="nav-home" href="../../index.html">← 墨韵工具集</a>
    <span class="nav-title">/ 文档管理器</span>
    <div class="nav-actions">
      <button class="my-btn my-btn--ghost nav-btn" id="btnUndo" title="撤销 (Ctrl+Z)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 10h10a5 5 0 0 1 0 10H9"/><path d="M3 10l4-4M3 10l4 4"/></svg>
        撤销
      </button>
      <button class="my-btn my-btn--ghost nav-btn" id="btnExport" title="导出全部为 Markdown">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        导出
      </button>
    </div>
  </nav>

  <!-- ========== 主内容 ========== -->
  <div class="page-main doc-main">

    <!-- 顶部操作栏 -->
    <div class="doc-toolbar">
      <div class="toolbar-left">
        <h1 class="doc-title">📄 文档管理器</h1>
        <span class="doc-subtitle">使用缩进结构，快速组织项目设计文档</span>
      </div>
      <div class="toolbar-right">
        <!-- 模板选择下拉 -->
        <div class="template-dropdown" id="templateDropdown">
          <button class="my-btn my-btn--ghost" id="btnAddBlock">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            添加分块
          </button>
          <div class="dropdown-menu" id="templateMenu">
            <div class="dropdown-header">选择模板</div>
            <button class="dropdown-item" data-template="blank">
              <span class="template-icon">📝</span> 空白分块
            </button>
            <button class="dropdown-item" data-template="project-design">
              <span class="template-icon">🏗️</span> 项目设计模板
            </button>
            <button class="dropdown-item" data-template="issue-fix">
              <span class="template-icon">🔧</span> 问题修复计划
            </button>
            <button class="dropdown-item" data-template="new-feature">
              <span class="template-icon">✨</span> 新功能追加设计
            </button>
            <button class="dropdown-item" data-template="task-breakdown">
              <span class="template-icon">📋</span> 项目任务分解
            </button>
            <button class="dropdown-item" data-template="change-request">
              <span class="template-icon">🔄</span> 旧功能变更记录
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 分块容器 -->
    <div class="blocks-container" id="blocksContainer">
      <!-- 分块会通过 JS 动态创建 -->
    </div>
  </div>

  <!-- ========== 模板文本（隐藏） ========== -->
  <template id="tmplBlock">
    <div class="doc-block" data-block-id="">
      <div class="block-header">
        <div class="block-drag-handle" title="拖拽排序">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></svg>
        </div>
        <input class="block-title-input" type="text" placeholder="输入分块标题..." value="">
        <div class="block-color-picker">
          <button class="color-dot" data-color="" style="background:#4d6bfe" title="蓝色标记"></button>
          <button class="color-dot" data-color="" style="background:#10b981" title="绿色标记"></button>
          <button class="color-dot" data-color="" style="background:#f59e0b" title="橙色标记"></button>
          <button class="color-dot" data-color="" style="background:#ef4444" title="红色标记"></button>
          <button class="color-dot" data-color="" style="background:#8b5cf6" title="紫色标记"></button>
          <button class="color-dot" data-color="none" style="background:var(--line)" title="无颜色"></button>
        </div>
        <div class="block-actions">
          <button class="block-action-btn" data-action="collapse" title="折叠/展开">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <button class="block-action-btn" data-action="duplicate" title="复制分块">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button class="block-action-btn block-action-btn--danger" data-action="delete" title="删除分块">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
        </div>
      </div>
      <div class="block-body">
        <!-- 左侧：Markdown 文本编辑 -->
        <div class="panel panel--left">
          <div class="panel-header">
            <span class="panel-label">Markdown 文本</span>
            <span class="panel-hint">Tab 缩进表示层级 · ↑↓ 光标直达行尾</span>
          </div>
          <textarea class="md-editor" spellcheck="false" placeholder="在此输入 Markdown 文本...&#10;使用缩进（Tab 或 2空格）来表示层级：&#10;&#10;# 标题&#10;  ## 子项一&#10;    - 描述内容&#10;  ## 子项二&#10;    - 详细说明"></textarea>
        </div>
        <!-- 右侧：树形结构展示 -->
        <div class="panel panel--right">
          <div class="panel-header">
            <span class="panel-label">结构预览</span>
            <div class="panel-actions">
              <button class="panel-action-btn" data-action="expand-all" title="全部展开">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <button class="panel-action-btn" data-action="collapse-all" title="全部收起">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="18 15 12 9 6 15"/></svg>
              </button>
            </div>
          </div>
          <div class="tree-container">
            <div class="tree-view"></div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- ========== 右侧节点操作菜单（隐藏） ========== -->
  <div class="node-context-menu" id="nodeContextMenu" style="display:none;">
    <button class="ctx-item" data-action="add-child">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      添加子节点
    </button>
    <button class="ctx-item" data-action="add-sibling">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      添加同级节点
    </button>
    <hr class="ctx-divider">
    <button class="ctx-item" data-action="edit">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      编辑文本
    </button>
    <button class="ctx-item" data-action="color">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
      标记颜色
      <span class="color-submenu-arrow">▸</span>
    </button>
    <hr class="ctx-divider">
    <button class="ctx-item ctx-item--danger" data-action="delete">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      删除节点
    </button>
  </div>

  <!-- 颜色子菜单 -->
  <div class="color-submenu" id="colorSubmenu" style="display:none;">
    <button class="color-option" data-node-color="#4d6bfe" style="background:#4d6bfe" title="蓝"></button>
    <button class="color-option" data-node-color="#10b981" style="background:#10b981" title="绿"></button>
    <button class="color-option" data-node-color="#f59e0b" style="background:#f59e0b" title="橙"></button>
    <button class="color-option" data-node-color="#ef4444" style="background:#ef4444" title="红"></button>
    <button class="color-option" data-node-color="#8b5cf6" style="background:#8b5cf6" title="紫"></button>
    <button class="color-option" data-node-color="none" style="background:var(--line)" title="无"></button>
  </div>

  <script src="../assets/js/pages/doc-manager.js"></script>
  <script>
    // 页头合并（TX-20260817-06）：仅隐藏返回链接与标题，按钮保留在页面顶部居右
    window.SITE_NAV = {
      title: '文档管理器',
      hideSelectors: ['.page-nav .nav-home', '.page-nav .nav-title']
    };
  </script>
  <script src="../assets/js/components/site-nav.js"></script>
</body>
</html>
