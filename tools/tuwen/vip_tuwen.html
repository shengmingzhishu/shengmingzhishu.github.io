<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="VIP图文工具 - 文本转MD、MD预览、URL提取一站式整合">
<title>VIP图文工具 · 整合版</title>
<script src="../../assets/js/marked.min.js"></script>
<link rel="stylesheet" href="../../assets/css/github.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#eef2f7;--panel:#fff;--line:#e7ecf3;--text:#1e293b;--sub:#64748b;--muted:#94a3b8;--accent:#3b82f6;--accent-2:#2563eb;--accent-soft:#dbeafe;--radius:12px;--shadow:0 4px 16px rgba(15,23,42,.06)}
html,body{height:100%}
body{background:var(--bg);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);line-height:1.6;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

.topbar{height:56px;background:#fff;display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;border-bottom:1px solid #e8e8e8;box-shadow:0 1px 6px rgba(0,0,0,.04);z-index:30}
.topbar .brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:#1e293b}
.topbar .brand .logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.topbar .spacer{flex:1}
.tbtn{height:34px;padding:0 12px;border-radius:8px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:.15s;white-space:nowrap;text-decoration:none}
.tbtn.ghost{background:#f1f4f8;color:#475569}
.tbtn.ghost:hover{background:#e2e8f0}
.tbtn.success{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 2px 8px rgba(22,163,74,.3);height:32px;font-size:12px}
.tbtn.success:hover{filter:brightness(1.08)}
.tbtn.primary{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3);height:32px;font-size:12px}
.tbtn.primary:hover{filter:brightness(1.08)}

.workspace{display:flex;height:calc(100vh - 56px);gap:10px;padding:10px}
.col{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.col-left{flex:0 0 42%}
.col-right{flex:1}
.col-head{height:40px;padding:0 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;border-bottom:1px solid var(--line);background:#fbfcfe;font-size:13px;font-weight:700;color:#334155}
.col-head .hint{margin-left:auto;font-weight:400;color:var(--muted);font-size:11px}

.opt-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:#fafbfc;flex-shrink:0;font-size:12px}
.opt-btn{height:26px;padding:0 10px;border-radius:6px;font-size:11px;font-weight:600;color:#475569;background:#f1f5f9;display:inline-flex;align-items:center;gap:3px;transition:.12s;border:1px solid transparent;cursor:pointer;font-family:inherit}
.opt-btn:hover{background:var(--accent-soft);color:var(--accent-2);border-color:#bfdbfe}
.opt-btn.danger:hover{background:#fee2e2;color:#dc2626;border-color:#fecaca}

.tabs-bar{display:flex;align-items:center;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);background:#fafbfc;flex-shrink:0;overflow-x:auto}
.tab-btn{height:38px;padding:0 14px;font-size:12px;font-weight:600;color:#64748b;border-bottom:2px solid transparent;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tab-btn:hover{color:var(--accent-2);background:var(--accent-soft)}
.tab-btn.active{color:var(--accent-2);border-bottom-color:var(--accent);background:var(--accent-soft)}

.editor-wrap{flex:1;position:relative;display:flex;flex-direction:column;min-height:0}
#editor{flex:1;padding:14px 16px;outline:none;border:none;resize:none;font-family:'Courier New',monospace;font-size:13px;line-height:1.7;color:#334155;width:100%;background:#fcfdff}

.result-wrap{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.result-content{flex:1;overflow-y:auto;padding:14px 16px}
.result-content pre{white-space:pre-wrap;word-wrap:break-word;font-family:'Courier New',monospace;font-size:13px;line-height:1.7;color:#334155}
.result-content .wx-content{line-height:1.6;font-size:16px;color:#333}
.result-content .wx-content img{max-width:100%!important;height:auto!important}
.result-content .wx-content h1{font-size:24px;font-weight:700;margin:16px 0 8px;border-bottom:2px solid var(--line);padding-bottom:6px}
.result-content .wx-content h2{font-size:20px;font-weight:700;margin:14px 0 6px}
.result-content .wx-content h3{font-size:17px;font-weight:600;margin:12px 0 5px}
.result-content .wx-content p{margin:8px 0}
.result-content .wx-content ul,.result-content .wx-content ol{margin:8px 0;padding-left:24px}
.result-content .wx-content li{margin:4px 0}
.result-content .wx-content blockquote{border-left:4px solid var(--accent);padding:8px 12px;margin:8px 0;background:#f8fafc;color:var(--sub)}
.result-content .wx-content code{background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:13px;font-family:'Courier New',monospace}
.result-content .wx-content pre{background:#f8fafc;padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0}
.result-content .wx-content pre code{background:none;padding:0}
.result-content .wx-content a{color:var(--accent);text-decoration:none}
.result-content .wx-content table{border-collapse:collapse;width:100%;margin:8px 0}
.result-content .wx-content th,.result-content .wx-content td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.result-content .empty-hint{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:13px}
.result-content .url-list{display:flex;flex-direction:column;gap:4px}
.result-content .url-item{padding:6px 10px;background:#f8fafc;border-radius:6px;border:1px solid var(--line);font-size:12px;word-break:break-all;color:#334155}
.result-content .url-item a{color:var(--accent-2);text-decoration:none}
.result-content .url-item a:hover{text-decoration:underline}
.result-content .img-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.result-content .img-preview img{max-width:140px;max-height:140px;border-radius:6px;border:1px solid var(--line);object-fit:cover}

.action-bar{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:8px;flex-shrink:0;background:#fafbfc;align-items:center;justify-content:flex-end}

#toast{position:fixed;top:22px;left:50%;transform:translateX(-50%) translateY(-60px);background:linear-gradient(45deg,#FFD1DC,#FFB5E8);color:#444;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.1);display:flex;align-items:center;gap:6px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:768px){
  .workspace{flex-direction:column;height:auto}
  .col-left,.col-right{flex:1 1 auto;width:100%;min-height:300px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">📝</span>VIP图文工具</div>
  <span style="font-size:11px;color:var(--muted)">文本转MD · MD预览 · URL提取</span>
  <div class="spacer"></div>
  <a href="../../index.html" class="tbtn ghost">🏠 返回主页</a>
</header>

<div class="workspace">
  <section class="col col-left">
    <div class="col-head">
      <span>📝 输入文本</span>
      <span class="hint" id="status">就绪</span>
    </div>
    <div class="opt-bar">
      <button class="opt-btn" onclick="shuffleText()">🔀 文本乱序</button>
      <button class="opt-btn" onclick="removeEmptyLines()">🗑 删除空行</button>
      <button class="opt-btn" onclick="addEmptyLines()">➕ 增加空行</button>
      <button class="opt-btn" onclick="removeShortLines()">✂ 删除短句</button>
      <button class="opt-btn danger" onclick="clearInput()">📋 清空</button>
      <button class="opt-btn" onclick="loadSample()">📖 示例</button>
    </div>
    <div class="editor-wrap">
      <textarea id="editor" placeholder="输入文本或Markdown内容...&#10;左侧输入 → 右侧选择功能标签查看结果 → 复制或回填"></textarea>
    </div>
  </section>

  <section class="col col-right">
    <div class="tabs-bar">
      <button class="tab-btn active" data-tab="text2md" onclick="switchTab('text2md')">📝 文本转MD</button>
      <button class="tab-btn" data-tab="mdpreview" onclick="switchTab('mdpreview')">👁 MD预览</button>
      <button class="tab-btn" data-tab="articleUrl" onclick="switchTab('articleUrl')">🔗 文章URL</button>
      <button class="tab-btn" data-tab="imageUrl" onclick="switchTab('imageUrl')">🖼 图片URL</button>
    </div>
    <div class="result-wrap">
      <div class="result-content" id="resultContent">
        <div class="empty-hint">在左侧输入内容后，结果将在此显示</div>
      </div>
    </div>
    <div class="action-bar">
      <span style="font-size:11px;color:var(--muted);margin-right:auto" id="resultMeta">—</span>
      <button class="tbtn ghost" onclick="copyResult()">📋 复制文本</button>
      <button class="tbtn primary" onclick="fillBack()">⬅ 回填</button>
    </div>
  </section>
</div>

<div id="toast">✅ 操作成功</div>

<script>
// ===== 全局状态 =====
let currentTab = 'text2md';
let currentResult = ''; // 纯文本结果（用于复制、回填）

// ===== 工具函数 =====
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

let toastTimer = null;
function showToast(msg, duration) {
    duration = duration || 2000;
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.classList.remove('show'); }, duration);
}

// ===== 左侧文本处理按钮 =====

// 文本乱序 — 参考 line-break-v4.html clearSort()
function shuffleText() {
    const ta = document.getElementById('editor');
    let text = ta.value.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    if (!text.trim()) { showToast('⚠️ 文本为空'); return; }
    let lines = text.split('\n');
    lines.sort(function() { return Math.random() - 0.5; });
    ta.value = lines.join('\n');
    processCurrentTab();
    showToast('🔀 已乱序');
}

// 删除空行 — 参考 url-extractor-v1.html clearEnter()
// 移除所有空行，只保留有内容的行
function removeEmptyLines() {
    const ta = document.getElementById('editor');
    let text = ta.value.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    // 将连续的换行（含空行）压缩为单个换行
    text = text.replace(/\n\s*\n/g, '\n').trim();
    ta.value = text;
    processCurrentTab();
    showToast('🗑 已删除空行');
}

// 增加空行 — 每行数据间隔一个空行
function addEmptyLines() {
    const ta = document.getElementById('editor');
    let text = ta.value.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    if (!text.trim()) { showToast('⚠️ 文本为空'); return; }
    // 过滤掉空行，然后每行之间用 \n\n 连接
    let lines = text.split('\n').filter(function(line) { return line.trim() !== ''; });
    ta.value = lines.join('\n\n');
    processCurrentTab();
    showToast('➕ 已增加空行');
}

// 删除短句 — 参考 line-break-v4.html clearShort()
// 每行去掉空格不超过3个字符的都要删除掉
function removeShortLines() {
    const ta = document.getElementById('editor');
    let text = ta.value.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    let lines = text.split('\n');
    let filtered = lines.filter(function(line) {
        // 保留空行或长度大于3的行
        return line.trim() === '' || line.trim().length > 3;
    });
    ta.value = filtered.join('\n');
    processCurrentTab();
    showToast('✂ 已删除短句');
}

// 清空
function clearInput() {
    document.getElementById('editor').value = '';
    processCurrentTab();
    showToast('📋 已清空');
}

// 加载示例
function loadSample() {
    const sample = '# 欢迎使用VIP图文工具\n' +
        '\n' +
        '这是一段普通的文本内容。\n' +
        '工具会自动识别标题、列表和引用。\n' +
        '\n' +
        '一、智能识别功能\n' +
        '\n' +
        '工具能够自动识别文本中的标题、列表、引用等元素。\n' +
        '例如，以数字序号开头的内容会被识别为列表项。\n' +
        '引用的内容会被自动添加引用标记。\n' +
        '\n' +
        '二、段落处理策略\n' +
        '\n' +
        '工具采用智能段落合并策略，避免过度分段。\n' +
        '同时能够识别独立的短句，将其作为单独段落处理。\n' +
        '\n' +
        '三、常见问题\n' +
        '\n' +
        '1. 工具支持中文和英文混排\n' +
        '2. 自动识别数字列表和符号列表\n' +
        '3. 支持引用的自动格式化\n' +
        '4. 保留原始换行结构\n' +
        '\n' +
        '> 这是一段引用文字，展示了引用的格式化效果。\n' +
        '\n' +
        'https://mp.weixin.qq.com/s/example-article-link\n' +
        'https://mmbiz.qpic.cn/mmbiz_png/SafC09p6yPmkKicjV7Eib4QicxEsLtDy0akTFJOkpZu5pfCpw4MtoZLdTY2l0eGlEwmVbNOyK7EaEndpqCrvlXwBQ/640?wx_fmt=png\n' +
        '<img src="https://mmbiz.qpic.cn/mmbiz_jpg/example/300?wx_fmt=jpeg" alt="test"/>';
    document.getElementById('editor').value = sample;
    processCurrentTab();
    showToast('📖 已加载示例');
}

// ===== 文本转MD逻辑（参考 text-to-md.html）=====

function formatToMarkdown(text) {
    if (!text.trim()) return '';

    const originalLines = text.split('\n');
    const lines = originalLines.map(function(line) { return line.trim(); }).filter(function(line) { return line; });
    let markdown = [];

    const analysis = analyzeContentStructure(lines);

    // 智能生成主标题
    if (lines.length > 0 && !lines[0].startsWith('#') && !detectHeadingLevel(lines[0], analysis).isHeading) {
        const mainTitle = generateMainTitle(lines[0], analysis);
        markdown.push('# ' + mainTitle + '\n');
    }

    let currentParagraph = [];
    let lastWasEmpty = false;
    let isInList = false;
    let consecutiveShortLines = 0;

    for (let i = 0; i < originalLines.length; i++) {
        const originalLine = originalLines[i];
        const line = originalLine.trim();

        if (!line) {
            if (currentParagraph.length > 0) {
                markdown.push(formatParagraph(currentParagraph, analysis));
                currentParagraph = [];
            }
            markdown.push('');
            lastWasEmpty = true;
            consecutiveShortLines = 0;
            isInList = false;
            continue;
        }

        const headingInfo = detectHeadingLevel(line, analysis);
        const isListItem = isLikelyListItem(line, i, originalLines, analysis);
        const isQuote = isQuoteText(line);

        if (headingInfo.isHeading) {
            if (currentParagraph.length > 0) {
                markdown.push(formatParagraph(currentParagraph, analysis));
                currentParagraph = [];
            }
            markdown.push('#'.repeat(headingInfo.level) + ' ' + line + '\n');
            isInList = false;
            lastWasEmpty = false;
            consecutiveShortLines = 0;
            continue;
        }

        if (isListItem) {
            if (currentParagraph.length > 0) {
                markdown.push(formatParagraph(currentParagraph, analysis));
                currentParagraph = [];
            }
            markdown.push(formatListItem(line, analysis));
            isInList = true;
            lastWasEmpty = false;
            consecutiveShortLines = 0;
            continue;
        }

        if (isQuote) {
            if (currentParagraph.length > 0) {
                markdown.push(formatParagraph(currentParagraph, analysis));
                currentParagraph = [];
            }
            markdown.push(formatQuote(line, analysis));
            isInList = false;
            lastWasEmpty = false;
            consecutiveShortLines = 0;
            continue;
        }

        const shouldStartNewParagraph = shouldStartNewParagraphLogic(
            line, currentParagraph, lastWasEmpty, consecutiveShortLines,
            isInList, i, originalLines, analysis
        );

        if (shouldStartNewParagraph && currentParagraph.length > 0) {
            markdown.push(formatParagraph(currentParagraph, analysis));
            currentParagraph = [];
        }

        currentParagraph.push(line);

        if (line.length <= 20) {
            consecutiveShortLines++;
        } else {
            consecutiveShortLines = 0;
        }

        lastWasEmpty = false;
    }

    if (currentParagraph.length > 0) {
        markdown.push(formatParagraph(currentParagraph, analysis));
    }

    return markdown.join('\n');
}

function analyzeContentStructure(lines) {
    const analysis = {
        totalLines: lines.length, avgLength: 0, shortLineCount: 0,
        hasNumbers: false, hasChinesePunct: false, hasEnglishOnly: false,
        articleType: 'general', keyPhrases: [], mainTopic: ''
    };
    let totalLength = 0, numberLines = 0;
    lines.forEach(function(line) {
        totalLength += line.length;
        if (line.length <= 15) analysis.shortLineCount++;
        if (/\d/.test(line)) numberLines++;
        if (/[。！？，、；：""''（）【】《》]/.test(line)) analysis.hasChinesePunct = true;
        if (/^[a-zA-Z0-9\s.,!?;:]+$/.test(line)) analysis.hasEnglishOnly = true;
        if (/^\d+[\.、．\s]/.test(line)) analysis.hasNumbers = true;
    });
    analysis.avgLength = lines.length > 0 ? totalLength / lines.length : 0;
    if (analysis.shortLineCount / lines.length > 0.4 && numberLines / lines.length > 0.3) {
        analysis.articleType = 'list';
    } else if (analysis.hasChinesePunct && lines.length > 5) {
        analysis.articleType = 'mixed';
    }
    return analysis;
}

function detectHeadingLevel(line, analysis) {
    const result = { isHeading: false, level: 0 };
    if (/^[a-z0-9\s]/.test(line) && !/^[一二三四五六七八九十]/.test(line)) return result;
    if (line.length > 50) return result;
    const numberHeadingMatch = line.match(/^(?:第[一二三四五六七八九十]+章?|[一二三四五六七八九十]+[、．\.]\s*|[\(\[]?\d+[\)\]\.、．]\s*)/);
    const hasTitleKeywords = /^(?:关于|论|浅谈|浅析|探讨|研究|分析|总结|报告|通知|公告|方案|计划|策略|方法|技术|如何|怎样|什么|为什么|什么是)/.test(line);
    const hasTitlePattern = /^(?:[「【《]|.*[」】》])$/.test(line) || /^[「【《]/.test(line);
    const isShortAndMeaningful = line.length >= 6 && line.length <= 30 && !line.includes('，') && !line.includes('。');
    const isPowerfulShort = line.length >= 4 && line.length <= 20 && /[的之]$/.test(line);
    if (numberHeadingMatch || hasTitleKeywords || isPowerfulShort) {
        result.isHeading = true; result.level = 2;
    } else if (hasTitlePattern && isShortAndMeaningful) {
        result.isHeading = true; result.level = 3;
    }
    if (line.length < 4 || line.length > 45) result.isHeading = false;
    return result;
}

function isLikelyListItem(line, index, originalLines, analysis) {
    if (/^\d+[\.、．\s]/.test(line)) return true;
    if (/^[\(\[（]\d+[\)\]）]/.test(line)) return true;
    if (/^[①②③④⑤⑥⑦⑧⑨⑩]/.test(line)) return true;
    if (/^[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]/.test(line)) return true;
    if (/^[•·●■◆\-*]\s/.test(line)) return true;
    if (index > 0 && originalLines[index - 1] && originalLines[index - 1].trim()) {
        const prevLine = originalLines[index - 1].trim();
        if (prevLine.length <= 30 && line.length <= 30 &&
            !prevLine.endsWith('。') && !line.endsWith('。') && !/^[#]/.test(prevLine)) {
            return true;
        }
    }
    return false;
}

function isQuoteText(text) {
    const prefixes = ['"', '"', '"', '"', '「', '『', '【', '《', '>', '》', '】', '』', '」'];
    return prefixes.some(function(prefix) { return text.startsWith(prefix); });
}

function shouldStartNewParagraphLogic(line, currentParagraph, lastWasEmpty, consecutiveShortLines, isInList, index, originalLines, analysis) {
    if (lastWasEmpty) return true;
    if (isInList) return true;
    if (consecutiveShortLines >= 3) return true;
    if (currentParagraph.length >= 8) return true;
    return false;
}

function formatParagraph(lines, analysis) {
    if (lines.length === 0) return '';
    if (lines.length === 1 && lines[0].length <= 30) return '- ' + lines[0];
    return lines.join('，');
}

function formatListItem(line, analysis) {
    let cleanLine = line.replace(/^\d+[\.、．\s]/, '').replace(/^[\(\[（]\d+[\)\]）]/, '').replace(/^[•·●■◆\-*]\s/, '');
    return '- ' + cleanLine;
}

function formatQuote(line, analysis) {
    return '> ' + line;
}

function generateMainTitle(firstLine, analysis) {
    let title = firstLine.replace(/^[#\s]+/, '').trim();
    if (title.length > 30) title = title.substring(0, 30) + '...';
    return title;
}

// ===== MD换行逻辑（参考 line-break-v4.html formatMD）=====
// 在MD标记前添加换行，使未换行的MD内容变为换行展示

function formatMD(text) {
    var patterns = [
        /#{1,8}\s/g,
        /\d+\./g,
        /-\s/g,
        />\s/g,
        /```\s/g
    ];
    var formattedText = text;
    patterns.forEach(function(pattern) {
        formattedText = formattedText.replace(pattern, function(match) {
            return '\n' + match;
        });
    });
    return formattedText;
}

// ===== URL提取逻辑（参考 url-extractor-v1.html setUniqueUrlsToEditor）=====
// 支持从纯文本和HTML中提取URL

function extractUrls(text, filterType) {
    // 正则匹配所有 http/https 开头的URL
    // 排除引号、尖括号、括号等HTML属性分隔符
    const urlRegex = /https?:\/\/[^"'\s<>\)\]\\]+/g;
    let urls = text.match(urlRegex) || [];

    // 遍历处理每个URL
    urls = urls.map(function(url) {
        // 移除末尾可能存在的标点符号
        let processed = url.replace(/[);,.\]>]+$/, '');
        // 分离query参数
        let qIdx = processed.indexOf('?');
        let base = qIdx >= 0 ? processed.substring(0, qIdx) : processed;
        let query = qIdx >= 0 ? processed.substring(qIdx) : '';
        // 移除末尾的 /300 或 /640，替换为 /（原图）
        base = base.replace(/\/(640|300)+$/, '/');
        return base + query;
    });

    // 根据类型过滤
    if (filterType === 'article') {
        urls = urls.filter(function(url) { return url.includes('mp.weixin.qq.com'); });
    } else if (filterType === 'image') {
        urls = urls.filter(function(url) { return url.includes('qpic.cn'); });
    }

    // 去重
    const uniqueUrls = Array.from(new Set(urls));

    // 图片URL进一步按图片名去重（参考 url-extractor-v1.html）
    if (filterType === 'image') {
        return deduplicateByImageName(uniqueUrls);
    }

    return uniqueUrls;
}

// 按图片名去重：如果多个url图片名相同，只保留最短的那个
function deduplicateByImageName(urls) {
    function getImgName(url) {
        if (!url.includes('mmbiz.qpic.cn')) return url;
        let parts = url.split('/');
        return parts.reduce(function(a, b) { return a.length >= b.length ? a : b; }, '');
    }
    const imgNameToUrl = new Map();
    urls.forEach(function(url) {
        const imgName = getImgName(url);
        if (!imgNameToUrl.has(imgName)) {
            imgNameToUrl.set(imgName, url);
        } else {
            if (url.length < imgNameToUrl.get(imgName).length) {
                imgNameToUrl.set(imgName, url);
            }
        }
    });
    return Array.from(imgNameToUrl.values());
}

// ===== Tab切换与处理 =====

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    processCurrentTab();
}

function processCurrentTab() {
    const text = document.getElementById('editor').value;
    const content = document.getElementById('resultContent');
    const meta = document.getElementById('resultMeta');

    if (!text.trim()) {
        content.innerHTML = '<div class="empty-hint">在左侧输入内容后，结果将在此显示</div>';
        currentResult = '';
        meta.textContent = '—';
        return;
    }

    if (currentTab === 'text2md') {
        // 先转为MD格式，再添加换行
        let md = formatToMarkdown(text);
        md = formatMD(md);
        currentResult = md;
        content.innerHTML = '<pre>' + escapeHtml(md) + '</pre>';
        meta.textContent = '📝 ' + md.split('\n').length + ' 行 · ' + md.length + ' 字符';
    } else if (currentTab === 'mdpreview') {
        // MD预览：用marked.js渲染为HTML，再提取纯文本
        marked.setOptions({ breaks: true });
        const html = marked.parse(text);
        // 用临时DOM提取渲染后的纯文本（去掉MD标签符号）
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = html;
        currentResult = tempDiv.innerText;
        content.innerHTML = '<div class="wx-content">' + html + '</div>';
        meta.textContent = '👁 已渲染 · ' + currentResult.length + ' 字符';
    } else if (currentTab === 'articleUrl') {
        const articleUrls = extractUrls(text, 'article');
        currentResult = articleUrls.join('\n');
        if (articleUrls.length > 0) {
            let html = '<div class="url-list">';
            articleUrls.forEach(function(url, i) {
                html += '<div class="url-item"><a href="' + escapeHtml(url) + '" target="_blank">' + (i+1) + '. ' + escapeHtml(url) + '</a></div>';
            });
            html += '</div>';
            content.innerHTML = html;
        } else {
            content.innerHTML = '<div class="empty-hint">未找到公众号文章URL（mp.weixin.qq.com）</div>';
        }
        meta.textContent = '🔗 提取到 ' + articleUrls.length + ' 个文章链接';
    } else if (currentTab === 'imageUrl') {
        const imageUrls = extractUrls(text, 'image');
        currentResult = imageUrls.join('\n');
        if (imageUrls.length > 0) {
            let html = '<div class="url-list">';
            imageUrls.forEach(function(url, i) {
                html += '<div class="url-item"><a href="' + escapeHtml(url) + '" target="_blank">' + (i+1) + '. ' + escapeHtml(url) + '</a></div>';
            });
            html += '</div>';
            // 图片预览
            html += '<hr style="margin:12px 0;border:none;border-top:1px solid var(--line)">';
            html += '<div class="img-preview">';
            imageUrls.forEach(function(url) {
                html += '<img src="' + escapeHtml(url) + '" onerror="this.style.display=\'none\'">';
            });
            html += '</div>';
            content.innerHTML = html;
        } else {
            content.innerHTML = '<div class="empty-hint">未找到公众号图片URL（qpic.cn）</div>';
        }
        meta.textContent = '🖼 提取到 ' + imageUrls.length + ' 个原图链接';
    }
}

// ===== 复制与回填 =====

function copyResult() {
    if (!currentResult) {
        showToast('⚠️ 没有内容可复制');
        return;
    }
    const textarea = document.createElement('textarea');
    textarea.value = currentResult;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    textarea.setSelectionRange(0, textarea.value.length);
    try {
        document.execCommand('copy');
        showToast('✅ 复制成功！');
    } catch (err) {
        showToast('❌ 复制失败，请手动复制');
    }
    document.body.removeChild(textarea);
}

function fillBack() {
    if (!currentResult) {
        showToast('⚠️ 没有内容可回填');
        return;
    }
    document.getElementById('editor').value = currentResult;
    processCurrentTab();
    showToast('✅ 已回填到左侧！');
}

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('editor').addEventListener('input', function() {
        processCurrentTab();
    });
    loadSample();
});
</script>
